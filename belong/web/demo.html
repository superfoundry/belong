<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belong. demo</title>
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/belong.css">
<link rel="stylesheet" href="/ds/theme-dark.css">
<style>
  .stage { display: grid; grid-template-columns: 380px minmax(400px, 1fr) 380px; gap: var(--space-6);
           padding: var(--space-8) var(--space-6) var(--space-16); max-width: 1600px; margin: 0 auto; align-items: start; }
  @media (max-width: 1240px) { .stage { grid-template-columns: 1fr; max-width: 540px; } .panel { order: 3; } }
  .phone-wrap > .eyebrow { margin: 0 0 var(--space-3) var(--space-2); color: var(--text-tertiary); }

  /* ---------- phone ---------- */
  /* Every phone screen is the same slight off-white (the palest paper); cards stay white on it. */
  .phone { --phone-bg: var(--sf-paper-100); background: var(--phone-bg); border: 10px solid var(--surface-inverse); border-radius: 44px; height: 800px;
           display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-lg); }
  .phone .top { padding: var(--space-4) var(--space-5) var(--space-3); border-bottom: 1px solid var(--border-subtle);
                display: flex; align-items: center; gap: var(--space-2); background: var(--phone-bg); }
  .phone .top .wordmark { font-size: 19px; }
  .phone .top .who { font: var(--text-body-s); color: var(--text-secondary); }
  .phone .top .badge { margin-left: auto; }
  .screen { flex: 1; overflow-y: auto; padding: var(--space-5); }
  .phone .top { position: relative; }
  .menu-btn { all: unset; box-sizing: border-box; width: 36px; height: 36px; display: inline-flex; flex-direction: column; justify-content: center;
              align-items: center; gap: 4px; cursor: pointer; border-radius: var(--radius-md); margin-left: auto; }
  .menu-btn span { display: block; width: 16px; height: 2px; background: var(--text-primary); border-radius: 1px;
                   transition: transform var(--duration-base) var(--ease-standard), opacity var(--duration-base); }
  .menu-btn:hover { background: var(--surface-raised); }
  .menu-btn:focus-visible { outline: 2px solid var(--focus-ring); }
  /* On a listing's profile, by the user's choice: no back row taking up height; a home icon beside the menu. */
  .home-btn { all: unset; box-sizing: border-box; width: 36px; height: 36px; display: inline-flex; justify-content: center;
              align-items: center; cursor: pointer; border-radius: var(--radius-md); margin-left: auto; color: var(--text-primary); }
  .home-btn:hover { background: var(--surface-raised); }
  .home-btn:focus-visible { outline: 2px solid var(--focus-ring); }
  .page-title { margin: 0 0 var(--space-4); }  /* a menu page's name; home is in the top bar */
  .home-btn + .menu-btn { margin-left: calc(-1 * var(--space-2)); }  /* close beside the menu */
  .menu-btn[aria-expanded="true"] span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .menu-btn[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
  .menu-btn[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .menu { position: absolute; top: calc(100% + 4px); right: var(--space-3); z-index: 5; min-width: 180px; background: var(--surface-card);
          border: 1px solid var(--border-default); border-radius: var(--radius-md); box-shadow: var(--shadow-md); padding: var(--space-1) 0; }
  .menu button { all: unset; box-sizing: border-box; display: block; width: 100%; padding: var(--space-3) var(--space-4); cursor: pointer; font: var(--text-body-s); }
  .menu button:hover, .menu button:focus-visible { background: var(--surface-raised); }
  .menu button.sep { border-top: 1px solid var(--border-subtle); margin-top: var(--space-1); color: var(--text-secondary); }
  .tabbar { display: grid; grid-template-columns: 1fr 1fr; background: var(--phone-bg); border-top: 1px solid var(--border-subtle); flex-shrink: 0; }
  .tabbar button { all: unset; box-sizing: border-box; position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
                   padding: var(--space-4) 0 var(--space-5); cursor: pointer; color: var(--text-tertiary);
                   transition: color var(--duration-fast) var(--ease-standard); }
  .tabbar button + button { border-left: 1px solid var(--border-subtle); }
  .tabbar button::before { content: ""; position: absolute; top: -1px; left: 28%; right: 28%; height: 2px; background: transparent; border-radius: 0 0 2px 2px; }
  .tabbar button.on { color: var(--text-primary); background: linear-gradient(var(--accent-muted), transparent 70%); }
  .tabbar button.on::before { background: var(--border-accent); }
  .tabbar button:hover { color: var(--text-primary); }
  .tabbar button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
  .tab-label { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: -0.01em; position: relative; }
  /* Notification dots are pure red by the user's choice, outside the token palette. */
  .phone { --notify: #ff0000; }
  .tabbar .dot { position: absolute; top: 2px; right: -11px; width: 8px; height: 8px; border-radius: 50%; background: var(--notify); }
  .setting-row { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) 0; border-bottom: 1px solid var(--border-subtle); }
  .setting-row:first-child { padding-top: 0; } .setting-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .toggle-row { cursor: pointer; gap: var(--space-4); }
  /* A switch, from the system's Switch: coral when on. */
  .switch { appearance: none; flex-shrink: 0; width: 40px; height: 24px; border-radius: var(--radius-pill); background: var(--border-strong);
            position: relative; cursor: pointer; transition: background var(--duration-base) var(--ease-standard); margin: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface-card);
                   box-shadow: var(--shadow-sm); transition: transform var(--duration-base) var(--ease-standard); }
  .switch:checked { background: var(--accent-default); }
  .switch:checked::after { transform: translateX(16px); }
  .switch:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .phone .tabs { background: var(--surface-card); padding: 0 var(--space-4); border-top: 1px solid var(--border-subtle); border-bottom: 0; justify-content: space-between; }
  .phone .tabs button { margin: 0; padding: var(--space-3) 2px var(--space-4); position: relative; font: var(--text-label); font-weight: 600; }
  .phone .tabs .dot { position: absolute; top: 9px; right: -8px; width: 6px; height: 6px; border-radius: 50%; background: var(--notify); }
  .stack > * + * { margin-top: var(--space-4); }
  .screen.split { padding: 0; position: relative; overflow: hidden; }
  /* Base layer: the profile, full screen. Its bottom padding follows the sheet's height (set after each
     draw), so the whole profile scrolls clear of the chat. */
  .profile-pane { position: absolute; inset: 0; overflow-y: auto; padding: var(--space-4) var(--space-4) var(--space-16); }
  /* Top layer: the agent chat as a sheet. Drag its top edge to any height; minimised, it keeps the agent's
     last message so the profile has the screen. */
  .chat-sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 62%; max-height: calc(100% - var(--space-12));
                display: flex; flex-direction: column;
                background: var(--surface-card); border-top: 1px solid var(--border-default);
                border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-lg);
                transition: height var(--duration-slow) var(--ease-standard); }
  .chat-sheet.min { height: auto; }
  /* By the user's choice, a new listing starts as the agent's chat, the whole screen: no profile behind it yet and
     nothing to minimise to. Its header says when the profile appears. */
  .chat-sheet.full { height: 100%; max-height: none; border-top: 0; border-radius: 0; box-shadow: none; }
  .chat-sheet.dragging { transition: none; user-select: none; }
  .sheet-head { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: var(--space-2); width: 100%;
                padding: var(--space-4) var(--space-4) var(--space-3); cursor: grab; flex-shrink: 0; touch-action: none;
                border-bottom: 1px solid var(--border-subtle); }
  .chat-sheet.dragging .sheet-head { cursor: grabbing; }
  /* Minimised: the agent's latest message, up to three lines; tapping it opens the chat. */
  .peek { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 0 var(--space-4) var(--space-3); cursor: pointer; }
  .peek .bubble { margin: 0; }
  .peek .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .peek .working { display: inline-flex; align-items: center; gap: var(--space-2); color: var(--text-ai); }
  .peek .working .typing { padding: 0; }
  .peek:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
  .sheet-head:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
  .sheet-head .eyebrow { flex: 1; }
  .sheet-head .handle { width: 32px; height: 4px; border-radius: var(--radius-pill); background: var(--border-strong);
                        position: absolute; top: 6px; left: 50%; transform: translateX(-50%); }
  .chevron { width: 8px; height: 8px; border-right: 2px solid var(--text-tertiary); border-bottom: 2px solid var(--text-tertiary);
             transform: rotate(45deg); margin: -4px 4px 0; transition: transform var(--duration-base) var(--ease-standard); }
  .chat-sheet.min .chevron { transform: rotate(-135deg); margin-top: 4px; }
  .chat-sheet.min .chat-pane, .chat-sheet.min .composer-bar { display: none; }
  .chat-sheet.min .sheet-head { border-bottom: 0; }
  /* The profile in two tones: on white, hello in the person's own words, each detail a part to tap
     and change; below, on the phone's own off-white (by the user's choice, as on Belong., not cream), the
     other details, the hidden well, what's left to add and the editor. */
  .profile-pane { background: var(--phone-bg); }
  .profile-pane.blank { background: var(--surface-card); }  /* nothing to show below the hello yet */
  .profile-top { background: var(--surface-card); margin: calc(-1 * var(--space-4)) calc(-1 * var(--space-4)) 0;
                 padding: var(--space-4) var(--space-4) 0; }
  .hello { padding: var(--space-2) 0 var(--space-5); }
  .profile-details { padding-top: var(--space-4); }
  /* A third tone, by the user's choice: hidden details in a red band of their own, between what's shown and
     what's left to do, there only when something is hidden. It keeps the Hidden badge and its line. */
  .hidden-band { margin: 0 calc(-1 * var(--space-4)); padding: var(--space-4);
                 background: linear-gradient(var(--accent-error-muted), var(--accent-error-muted)), var(--surface-card); }
  .profile-details > :first-child { margin-top: 0; }
  .hello-head { display: flex; align-items: center; gap: var(--space-3); }
  .monogram.lg { width: 56px; height: 56px; font-size: 26px; }
  .hello-name { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 1.15; letter-spacing: var(--tracking-tight); }
  .hello-name .drop { text-shadow: var(--shadow-text-ember); }
  .age-label { text-transform: uppercase; letter-spacing: var(--tracking-wider); font-weight: 600; color: var(--text-tertiary); margin-right: 6px; }
  .in-words { margin: var(--space-4) 0 0; font-family: var(--font-display); font-weight: 500; font-size: 19px; line-height: 1.65;
              letter-spacing: var(--tracking-tight); overflow-wrap: anywhere; }
  /* A part flows like the words around it: it wraps mid-part, its highlight carried onto each line. */
  .word { display: inline; -webkit-box-decoration-break: clone; box-decoration-break: clone; color: var(--text-primary);
          background: var(--sf-char-100); border-bottom: 2px solid var(--border-strong); border-radius: var(--radius-sm);
          padding: 1px 5px; cursor: pointer; transition: border-color var(--duration-fast) var(--ease-standard); }
  .word:hover, .word.on { border-bottom-color: var(--border-accent); }
  .word:focus-visible, .fact:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 1px; }
  .word.blank { background: transparent; border: 1px dashed var(--border-strong); color: var(--text-tertiary); }
  .word.blank:hover { border-color: var(--border-accent); color: var(--text-primary); }
  .facts { display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-4); }
  .fact-row { display: grid; grid-template-columns: 112px 1fr; gap: var(--space-2); align-items: baseline; }
  .fact { font: var(--text-body-s); color: var(--text-primary); background: transparent; border: 0; border-bottom: 1px dashed var(--border-strong);
          padding: 0; cursor: pointer; text-align: left; overflow-wrap: anywhere; }
  .fact:hover, .fact.on { border-bottom-color: var(--border-accent); }
  /* An open detail's scale, as its agent wrote it: a segmented row that wraps when the steps are long. */
  .segmented.steps { display: flex; flex-wrap: wrap; width: fit-content; max-width: 100%; }
  /* One detail at a time: a tapped part of the profile opens just that detail, its shown or hidden choice
     included, in a sheet over the dimmed phone. */
  .phone { position: relative; }
  .scrim { position: absolute; inset: 0; z-index: 10; background: var(--surface-overlay); }
  .detail-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 11; max-height: calc(100% - var(--space-16)); overflow-y: auto;
                  box-sizing: border-box; padding: var(--space-6) var(--space-4) var(--space-5); background: var(--surface-card);
                  border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-lg); }
  .detail-sheet:focus { outline: none; }
  .detail-sheet .field .head .label { color: var(--text-primary); }
  .detail-sheet .note { margin: var(--space-4) 0 0; }
  .detail-sheet .actions { margin-top: var(--space-5); }
  .scrim.rise { animation: fade-in var(--duration-slow) var(--ease-standard); }
  .detail-sheet.rise { animation: rise var(--duration-slow) var(--ease-standard); }
  @keyframes fade-in { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(100%); } }
  /* While a new profile is put together (once, before it's first shown): the phone's own status line in the agent's
     colour, with three lines, a profile taking shape, pulsing on the system's motion tokens. */
  .assembling { display: flex; align-items: center; gap: var(--space-3); max-width: 86%; margin: var(--space-2) 0;
                padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); border-bottom-left-radius: var(--radius-sm);
                background: var(--accent-ai-muted); color: var(--text-ai); font: var(--text-body-s); }
  .assembling .lines { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
  .assembling .lines span { display: block; width: 22px; height: 3px; border-radius: var(--radius-pill); background: var(--accent-ai);
                            transform-origin: left center; animation: assemble calc(4 * var(--duration-slow)) var(--ease-standard) infinite; }
  .assembling .lines span:nth-child(2) { width: 15px; animation-delay: var(--duration-base); }
  .assembling .lines span:nth-child(3) { width: 19px; animation-delay: calc(2 * var(--duration-base)); }
  @keyframes assemble { 0%, 100% { opacity: .35; transform: scaleX(.55); } 50% { opacity: 1; transform: scaleX(1); } }
  /* A change the person made on their profile, as their agent was told it: a short line in the agent's colour. */
  .change-line { margin: var(--space-2) 0; text-align: center; font: var(--text-caption); color: var(--text-ai); }
  /* Without a model agent: the other parts that still say what the person changed, each offered with one tap, in a
     cream highlight panel under the hello, on its white. */
  .offers-band { padding-bottom: var(--space-4); }  /* white below the panel, inside the profile's top */
  .offers { padding: var(--space-3) var(--space-4); background: var(--surface-raised); border-radius: var(--radius-md); }
  .offers .offer { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) 0; border-top: 1px solid var(--border-subtle); }
  .offers .offer:first-of-type { border-top: 0; }
  .offers .offer .grow { min-width: 0; overflow-wrap: anywhere; }
  .offers .offer .btn { flex-shrink: 0; }
  @media (prefers-reduced-motion: reduce) { .scrim.rise, .detail-sheet.rise { animation: none; } .chat-sheet { transition: none; }
    .typing span { animation: none; opacity: .6; } .assembling .lines span { animation: none; opacity: .7; } }
  .monogram { width: 40px; height: 40px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
              border-radius: var(--radius-md); background: var(--sf-char-100); color: var(--text-secondary);
              font-family: var(--font-display); font-weight: 700; font-size: 18px; }
  .profile-line { display: grid; grid-template-columns: 84px 1fr; gap: var(--space-2); margin-top: var(--space-3); align-items: baseline; }
  .progress-row { margin-top: var(--space-4); }
  .progress { height: 4px; background: var(--surface-sunken); border-radius: var(--radius-pill); overflow: hidden; margin-top: var(--space-2); }
  .progress span { display: block; height: 100%; background: var(--accent-default); transition: width var(--duration-slow) var(--ease-standard); }
  .suggest { margin-top: var(--space-3); }
  .why { margin: var(--space-2) 0 0; }
  .back-bar { display: flex; align-items: center; gap: var(--space-2); margin: calc(-1 * var(--space-2)) 0 var(--space-3) calc(-1 * var(--space-3)); }
  .back-chev { width: 7px; height: 7px; border-left: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); margin-right: 6px; }
  .list-head { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-4); }
  .list-head .heading-m { margin: 0; }
  .empty { text-align: center; margin-top: var(--space-10); }
  .empty .heading-l { margin: 0 0 var(--space-2); }
  .empty .btn { margin-top: var(--space-5); }
  .listing-card { position: relative; }
  .listing-card .listing-open > .row:first-child { padding-right: 34px; }
  .gear { all: unset; position: absolute; top: var(--space-3); right: var(--space-3); width: 32px; height: 32px; border-radius: 50%;
          display: inline-flex; align-items: center; justify-content: center; color: var(--text-tertiary); cursor: pointer; z-index: 1; }
  .gear:hover { background: var(--surface-raised); color: var(--text-primary); }
  /* "No matches yet. Want to include close matches?" on the listing card itself. */
  .broaden { margin-top: var(--space-4); padding: var(--space-3) var(--space-4); background: var(--surface-raised); border-radius: var(--radius-md); }
  /* A listing's settings: a tight menu of rows, each a label with a short line under it, and Delete set apart below. */
  .gear-pop { position: absolute; top: 46px; right: var(--space-2); z-index: 4; width: 248px; background: var(--surface-card);
              border: 1px solid var(--border-default); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: var(--space-1); }
  .pop-row { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: var(--space-3); width: 100%;
             padding: 10px var(--space-3); border-radius: var(--radius-md); cursor: pointer; }
  .pop-row:hover { background: var(--phone-bg); }
  .pop-row:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
  .pop-row.disabled { cursor: default; } .pop-row.disabled:hover { background: none; }
  .pop-row.disabled .pop-text, .pop-row.disabled .switch { opacity: .5; }
  .pop-text { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
  .pop-label { font: var(--text-label); color: var(--text-primary); }
  .pop-note { font: var(--text-caption); color: var(--text-tertiary); margin: 0; }
  .pop-sep { height: 1px; background: var(--border-subtle); margin: var(--space-1) var(--space-2); }
  .pop-row.danger { font: var(--text-label); color: var(--text-error); }
  .pop-row.danger:hover { background: var(--accent-error-muted); }
  .gear-pop.confirm { padding: var(--space-4); }
  .gear-pop.confirm .pop-note { margin-top: var(--space-1); }
  .pop-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-4); }
  /* The menu's Settings page: account-wide choices as the listing menu's rows, in a card with the menu's inset. */
  .card.pop-rows { padding: var(--space-1); }
  .settings-foot { margin: var(--space-2) var(--space-4) 0; }
  .toggle-row.disabled { opacity: .5; cursor: default; }
  /* A paused listing is greyed out; its settings stay usable. */
  .listing-card.paused > :not(.gear):not(.gear-pop) { opacity: .45; filter: grayscale(1); }
  .gear:focus-visible { outline: 2px solid var(--focus-ring); }
  .listing-open { all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer; }
  .listing-open > .row { display: flex; }
  .listing-open:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 4px; }
  .listing-open:hover .text-accent { text-decoration: underline; }
  .linkish { all: unset; cursor: pointer; color: var(--text-accent); text-decoration: underline; text-underline-offset: 2px; }
  .found-card { all: unset; box-sizing: border-box; display: flex; gap: var(--space-3); align-items: center; width: 100%; cursor: pointer;
                background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); }
  .found-card:hover { border-color: var(--border-strong); }
  .found-card:focus-visible { outline: 2px solid var(--focus-ring); }
  .found-card .grow > span { display: block; }
  .found-card .msg-preview { margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--notify); flex-shrink: 0; }
  .thread { display: flex; flex-direction: column; height: 100%; background: var(--phone-bg); }
  .thread-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-5) var(--space-4) var(--space-3);
                 background: var(--surface-card); border-bottom: 1px solid var(--border-subtle); }
  .thread-head .back { padding: var(--space-2); }
  .thread-head .back .back-chev { margin: 0 0 0 4px; }
  .thread-head .heading-s { margin: 0; }
  .why { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; font: var(--text-caption); color: var(--text-accent); }
  .why .chevron { width: 6px; height: 6px; margin: -3px 0 0 4px; border-color: var(--text-accent); }
  .why[aria-expanded="true"] .chevron { transform: rotate(-135deg); margin-top: 3px; }
  .why-panel { background: var(--surface-card); border-bottom: 1px solid var(--border-subtle); padding: var(--space-3) var(--space-4) var(--space-4); }
  .thread-pane { flex: 1; overflow-y: auto; padding: var(--space-4); }
  .thread-note { text-align: center; margin: var(--space-2) 0 var(--space-4); }
  /* Chat bubbles are rounder than the system's radii, by the user's choice. */

<script>
// ---------------------------------------------------------------------------------
// Scenarios: presets the presenter can load. They only fill in what a person would

// ---------------------------------------------------------------------------------
const SCENARIOS = {

      hidden: { politics: "politically progressive" }, values: { city: "Berlin" } },

      hidden: { politics: "politically progressive" }, values: { city: "Tokyo" } } },

  fishing: { label: "Fishing in Ireland (needs the AI agent)", A: { name: "Aoife", age: 29,
      message: "Looking for a friend to teach me how to fish in ireland" },
    B: { name: "Seán", age: 41, message: "I've fished all my life around Galway and I'd love to teach a beginner, weekends mostly." } },
  stalker: { label: "Someone tries to find a specific person", A: { name: "Sam", age: 30,

let S = null;               // last state from the server

// The phones on this page: A and B beside the presenter panel, or one phone on its own

const ONLY = new URLSearchParams(location.search).get("phone");
const VIEW = ONLY && /^[A-Za-z0-9]{1,16}$/.test(ONLY) ? [ONLY] : ["A", "B"];
const SINGLE = VIEW.length === 1;
if (SINGLE) {

  if (!document.querySelector(`.phone-wrap[data-slot="${ONLY}"]`)) {
    document.body.classList.add("taken");
    document.querySelector(".stage").insertAdjacentHTML("beforeend", `<div class="phone-wrap gone" data-slot="${ONLY}">
      <div class="wrap-head"><p class="eyebrow" id="label-${ONLY}">Synthetic person</p>
        <button class="btn ghost sm" onclick="handBack('${ONLY}')">Hand back</button></div>
      <div class="phone" id="phone-${ONLY}"></div></div>`);
  }

// Per phone: the open tab, the verify form, which listing is open, and per-listing local

const fresh = () => ({ tab: null, view: null, thread: null, form: {}, current: null, ls: {}, seen: {}, msg: {}, seenFound: {} });
const local = Object.fromEntries(VIEW.map(s => [s, fresh()]));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const val = v => Array.isArray(v) ? v.join(", ") : v;
// Lists in a sentence, every page's way: "a, b and c", "a, b or c".
const andList = v => { const a = [].concat(v).map(String); return a.length > 1 ? `${a.slice(0, -1).join(", ")} and ${a.at(-1)}` : a[0] || ""; };
const orList = v => { const a = [].concat(v).map(String); return a.length > 1 ? `${a.slice(0, -1).join(", ")} or ${a.at(-1)}` : a[0] || ""; };
const $ = id => document.getElementById(id);
const composing = e => e.isComposing || e.keyCode === 229;  // an Enter that picks a word in an input method
const badge = (tone, text) => `<span class="badge ${tone}">${esc(text)}</span>`;
const tags = values => values.map(v => `<span class="tag">${esc(v)}</span>`).join("");
const cap = t => t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
const hasValue = v => Array.isArray(v) ? v.length > 0 : v !== null && v !== undefined && v !== "";
// What a person's agent understood, recorded on the listing: the kind of match and, for dating, who
// they'd like to meet and those people's ages. Worded the same on your profile and on a match's card.
const KIND_LABELS = { dating: "Dating", other: "Something else" };
// The same kinds inside a sentence, as the agent names them.
const KIND_WORDS = { dating: "a relationship or date", other: "something else" };
const UNDERSTOOD = ["kind", "wants_gender", "wants_age"];
// An open detail's key is about:name, as schema.split_key reads it (me: about the person, them: what they'd
// like the other person's to be, both: something both must share); null for a built-in detail.
const detailParts = key => { const m = /^(me|them|both):(.+)$/.exec(key || ""); return m ? { about: m[1], name: m[2] } : null; };
// An open detail in a match's view: { values, compare, steps, required }, copied from their shown listing.
const isDetail = v => !!v && typeof v === "object" && !Array.isArray(v);
// An open detail's values, read by whom it is about: the person's own are all theirs ("a, b"), a wish or what both
// share is met by any one of them ("a, b or c").

// ---------------------------------------------------------------------------------
// Listings: every listing, each with its matches in a collapsible section
// ---------------------------------------------------------------------------------
// A row of a settings menu (a listing's gear, and the menu's Settings page): a label, a short line under it, a switch
// (id: which one, so focus can come back to it after the redraw its answer makes).
function popRow(label, note, on, change, disabled, id = "") {
  return `<label class="pop-row${disabled ? " disabled" : ""}">
      <span class="pop-text"><span class="pop-label">${label}</span><span class="pop-note">${note}</span></span>
      <input type="checkbox" data-switch="${esc(id)}" class="switch" ${on ? "checked" : ""} ${disabled ? "disabled" : ""} onchange="${change}"></label>`;
}
function listingCard(slot, p, l) {
  const c = local[slot].ls[l.id] ||= { draft: null, draftFrom: null, chatText: "", editing: false, chatMin: false, seenChat: 0, sending: null };
  const waiting = needsAnswer(l), asks = l.followups.filter(q => q.question_id !== "broaden");
  const broaden = l.followups.find(q => q.question_id === "broaden"), total = l.intros.length + asks.length;
  // Open the matches when something new needs an answer, not only the first time the card is drawn.
  if (c.open === undefined || waiting > (c.seenWaiting || 0)) c.open = waiting > 0 || !!c.open;
  c.seenWaiting = waiting;
  const paused = l.listed && l.active === false;
  const status = l.unsaved ? badge("warning", "Unsaved changes") : paused ? badge("", "Paused") : l.listed ? badge("accent", "Matching") : badge("", "Draft");
  const summary = !l.listed ? "Not matching yet" : total ? `${total} match${total === 1 ? "" : "es"}${waiting ? `, ${waiting} waiting on you` : ""}` : "No matches yet";
  const body = !l.listed
    ? ""
    : total
      ? `<details class="matches" ${c.open ? "open" : ""} ontoggle="local['${slot}'].ls['${l.id}'].open=this.open">
          <summary>${waiting ? "Matches and questions" : "Matches"} (${total})</summary>
          <div class="stack" style="margin-top: var(--space-3)">${asks.map(q => followupCard(slot, l, q)).join("")}${l.intros.map(i => introCard(slot, l, i)).join("")}</div></details>`
      : broaden ? broadenCard(slot, l) : "";
  const pr = shownPrefs(slot, l), open = local[slot].gear === l.id, active = l.listed && l.active !== false;
  // Deleting asks first, in the same place: it can't be undone. What it says is true of the listing as it is now:
  // matched, paused (not matched), or a draft (never matched).
  const pop = !open ? "" : local[slot].gearConfirm === l.id
    ? `<div class="gear-pop confirm" role="alertdialog" aria-labelledby="del-${slot}" aria-describedby="del-note-${slot}" onkeydown="gearKey(event,'${slot}','${l.id}')">
        <span class="pop-label" id="del-${slot}">Delete this listing?</span>
        <p class="pop-note" id="del-note-${slot}">${active ? "It stops being matched, and its matches and chats leave your phone."
          : l.listed ? "Its matches and chats leave your phone." : "The draft and your chat with your agent about it go."} This can't be undone.</p>
        <div class="pop-actions"><button class="btn secondary sm" data-focus onclick="cancelDelete('${slot}')">Cancel</button>
          <button class="btn destructive sm" onclick="deleteListing('${slot}','${l.id}')">Delete</button></div></div>`
    : `<div class="gear-pop" role="dialog" aria-label="Settings for ${esc(l.title)}" onkeydown="gearKey(event,'${slot}','${l.id}')">
        ${popRow("Active", !l.listed ? "Once you start matching" : active ? "Being matched" : "Paused, not matched",
                 active, `setActive('${slot}','${l.id}',this.checked)`, !l.listed, `${l.id}:active`)}
        ${popRow("Close matches", "Almost what you asked for", pr.notify_close, `setPref('${slot}','${l.id}','notify_close',this.checked)`, false, `${l.id}:notify_close`)}
        ${popRow("Questions", "To help find you a match", pr.notify_questions, `setPref('${slot}','${l.id}','notify_questions',this.checked)`, false, `${l.id}:notify_questions`)}
        <div class="pop-sep" role="separator"></div>
        <button class="pop-row danger" onclick="askDelete('${slot}','${l.id}')">${TRASH}<span>Delete listing</span></button></div>`;
  return `<div class="card md listing-card${paused ? " paused" : ""}">
    <button class="gear" data-id="${esc(l.id)}" onclick="toggleGear('${slot}','${l.id}')" aria-expanded="${open}" aria-label="Settings for ${esc(l.title)}" title="Settings">${GEAR}</button>${pop}
    <button class="listing-open" onclick="openListing('${slot}','${l.id}')" aria-label="Open ${esc(l.title)}">
      <span class="row"><span class="heading-m grow">${esc(cap(l.title))}</span>${status}</span>
      <span class="row" style="margin-top: var(--space-1)"><span class="caption secondary grow">${esc(summary)}</span><span class="caption text-accent">Edit</span></span></button>${body}</div>`;
}

// ---------------------------------------------------------------------------------
// Profile: the listing shown as a work-in-progress profile, filled in with the agent
// ---------------------------------------------------------------------------------
function draftValues(c) {
  const shown = {}, hidden = [];
  for (const f of (c.draft ? c.draft.fields : [])) {
    if (!f.enabled || !hasValue(f.value)) continue;
    if (f.visibility === "hidden") hidden.push(f); else shown[f.key] = f.value;
  }
  return { shown, hidden };
}

// The profile adapts to the request: a job-style post for paid help (it shows pay), a personal profile
// for dating, and a general one for everything else. Each has its own checklist.
function layoutFor(c) {
  const d = c.draft, { shown } = draftValues(c);
  if (d && d.kind === "dating") return "dating";
  if (shown.pay) return "offer";
  return "general";
}

// "Looking for" and "you are" are both needed for matching, but for a one-way request one is
// just the mirror of the other (a technician / a customer). Show the side that says something:
// what you need, or what you offer. Show both only when each adds something (a band / a guitarist).
const CLIENT_WORDS = new Set(["customer", "customers", "client", "clients", "student", "students", "learner", "learners",
  "beginner", "beginners", "pupil", "pupils", "patient", "patients", "buyer", "buyers", "tenant", "tenants", "renter",
  "apprentice", "mentee", "mentees", "novice", "homeowner", "homeowners", "household", "households", "people", "anyone"]);
const FILLER = new Set(["a", "an", "the", "or", "and", "of", "for", "to", "in", "on", "who", "with", "need", "needs", "needing",
  "looking", "someone", "person", "this"]);
const words = t => String(t || "").toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(Boolean);
function sides(shown) {
  const seek = words(shown.seeking), off = words(shown.offering);
  const clientIn = ws => ws.some(w => CLIENT_WORDS.has(w) || ["need", "needs", "needing", "wants"].includes(w));
  const core = ws => ws.filter(w => !FILLER.has(w) && !CLIENT_WORDS.has(w));
  const a = new Set(core(seek)), b = new Set(core(off));
  const same = shown.seeking && shown.seeking === shown.offering;
  if (!shown.offering || same) return { side: "needs", main: shown.seeking, other: null };
  if (clientIn(off) && !clientIn(seek)) return { side: "needs", main: shown.seeking, other: null };
  if (clientIn(seek) && !clientIn(off)) return { side: "offers", main: shown.offering, other: null };
  // Mirror: one phrase's activity words are all inside the other's.
  const within = (x, y) => [...x].every(w => y.has(w));
  if (a.size && b.size && (within(a, b) || within(b, a)) && seek.at(-1) === off.at(-1))
    return { side: "needs", main: shown.seeking, other: null };
  return { side: "both", main: shown.seeking, other: shown.offering };
}

// Who a dating draft would like to meet and their ages, as matching reads them: the details on the
// profile as edited here when they're shown, else what the description says (l.wants.said, read by
// the server), because a hidden detail never decides a match.
function lookingFor(c, l) {
  const { shown } = draftValues(c), w = (l && l.wants) || {}, said = w.said || {};
  const genders = shown.wants_gender ? [].concat(shown.wants_gender) : said.genders || [];
  return { genders, ages: spanOf(shown.wants_age) || said.ages || null, def: w.default };
}

// Save (or Start matching) needs what it's for and where (DemoSession._ready, the same rule); a live listing
// can be saved without them, except a dating listing nobody can match: one with no gender wanted is never matched.
function canSave(c, l) {
  const d = c.draft;
  if (!d || (d.kind === "dating" && !lookingFor(c, l).genders.length)) return false;
  const items = checklist(c, l);
  return (items[0].done && items[1].done) || l.listed;
}

function checklist(c, l) {
  const d = c.draft, { shown, hidden } = draftValues(c);
  // A listing that can meet online can be matched without a place (two people who both meet online are matched
  // wherever they live), as the agent's save counts it (build_draft); one that only meets in person can't.
  const online = ["Online", "In person or online"].includes(shown.format);
  // need: what matching needs, the only items progress counts (progressOf).
  const where = { done: !!(shown.city || shown.country) || online, label: "Where", ask: "I'm based in ", need: true };
  // Matching compares two phrases, who you're looking for and what you are to them, so both are needed; the one
  // still missing is the one asked for.
  const looking = shown.seeking && !shown.offering
    ? { done: false, label: "What you are to them", ask: "To them, I'm ", need: true }
    : { done: !!(shown.seeking && shown.offering), label: "Who you're looking for", ask: "I'm looking for ", need: true };
  const hiddenItem = { done: hidden.length > 0, label: "A hidden detail", optional: true, ask: "Something private that could improve my matches: " };
  // Dating needs who you'd like to meet, your own gender and their ages: it's how the right people find
  // you. Gender may stay hidden, but a hidden detail never decides a match, so the person is told what that means.
  const gender = (d ? d.fields : []).find(f => f.key === "gender" && f.enabled && hasValue(f.value));
  const lf = lookingFor(c, l);
  const datingNeeds = [
    gender && gender.visibility === "hidden"
      ? { done: true, label: "Your gender", ask: "I'm a ", warn: true, need: true,
          why: "Your gender is hidden, so it can't help people looking for a woman or a man find you: hidden details never decide a match. You may get fewer matches." }
      : { done: !!gender, label: "Your gender", ask: "I'm a ", need: true, why: "Your gender is needed so people looking for a woman or a man can find you." },
    { done: !!lf.ages, label: "Their age", ask: "Ideally aged ", need: true,
      why: lf.def ? `No ages yet, so you're open to people aged ${agesText(lf.def)}, one age band either side of yours.` : "" },
  ];
  // What to add next is the agent's call, by common sense for this request (the problem for a
  // repair, interests for dating). Who and where are always needed, for matching, and for dating
  // your gender and the ages you want.
  const essentials = d && d.kind === "dating"
    ? [{ done: lf.genders.length > 0, label: "Who you'd like to meet", ask: "I'd like to meet ", need: true,
         why: "Who you'd like to meet (a woman, a man, or anyone): you're only introduced to people you'd like to meet who'd also like to meet you." },
       where, ...datingNeeds]
    : [looking, where];
  // A model agent says what to ask for this request, what matching still needs first (its suggestions): the
  // essentials still count towards saving and progress, but they're asked only through it.
  if (d && Array.isArray(d.suggestions)) return [...essentials.map(i => ({ ...i, quiet: true })),
                                                 ...d.suggestions.map(x => ({ done: false, label: x.label, ask: x.ask }))];
  if (d && d.by === "quick") return essentials;  // the agent's suggestions arrive with its reply
  // The rule-based agent (offline): only what it can fill in from a message. It writes fixed choices and places,
  // and a sensitive word as a hidden detail; any other detail only in words other people already use, which
  // this phone never sees, so it doesn't ask for one.
  const format = { done: !!shown.format, label: "In person or online", ask: "I'd prefer to meet " };
  switch (layoutFor(c)) {
    case "offer": {
      const offering = sides(shown).side === "offers";
      return [looking, where,
        { done: !!shown.pay, label: offering ? "Your rate" : "What you'll pay", ask: offering ? "I charge " : "I can pay " }, format];
    }
    case "dating":
      return [...essentials, hiddenItem];
    default:
      return [looking, where, format, hiddenItem];
  }
}

// The profile in the person's own words: a few short sentences in the first person ("I'd prefer to meet
// online"), led by their headline when it's shown, each detail a part they can tap to change, and the details that
// don't read as a sentence as labelled facts. Only shown details (hidden ones keep their own well), and for dating,
// who they'd like to meet as matching reads it (lookingFor). A detail that's needed and missing is a blank to fill
// in with the agent. Wording that depends on a side (rate or budget) is used only when the shown details say which
// side they're on; otherwise the detail is a labelled fact. An open detail is a sentence of its own, from its name
// and whose it is (detailSentence), so any name its agent chose reads the same way.
// Each entry: the field, the words before it (null: no sentence, a fact) and after it, and lowercase for a
// choice word (In person, Online) inside a sentence. Every value makes a plain sentence, as a person says it.
const IN_WORDS = [
  { key: "gender", say: () => "I'm", text: v => GENDER_WORDS[v] || v },
  // One way to meet is a preference; both ways means they're open to either.
  { key: "format", say: (o, v) => v === "In person or online" ? "I'm happy to meet" : "I'd prefer to meet", lower: true },

// about what both share "The {name} is {a or b}.". The value "any" (open to any) reads "any {name}".

function profileWords(c, l) {
  const d = c.draft, { shown } = draftValues(c), layout = layoutFor(c), items = checklist(c, l);

  // A detail that's needed and missing is a blank to fill in, unless a model agent drafted this: then it says
  // what to ask (its suggestions), and the sentence says only what's known.
  const asks = !(d && (Array.isArray(d.suggestions) || d.by === "quick"));
  const blank = (label, text) => asks ? { blank: true, text, label, n: ask(label) } : null;

  const where = place ? word(shown.city ? "city" : "country", place) : blank("Where", "add a place");
  const at = where ? [" in ", where] : [], based = where ? [["I'm based in ", where]] : [];
  // Which side they're on, from shown details only: offering, seeking, or not known (a hidden value never
  // chooses words).
  const sd = sides(shown), offering = sd.side === "offers";
  const seeking = !offering && sd.side === "needs" && !!shown.seeking;
  const used = new Set(["first_name", "age_band", "city", "country", "seeking", "offering", "headline", ...UNDERSTOOD]);
  const sentences = [];
  if (layout === "dating") {
    const lf = lookingFor(c, l), who = wantsText(lf.genders, null), ages = agesText(lf.ages);
    const whom = who ? word("wants_gender", who) : blank("Who you'd like to meet", "add who");
    const aged = ages ? word("wants_age", ages) : blank("Their age", "add ages");
    sentences.push(["I'd like to meet ", whom || "someone", ...(aged ? [" aged ", aged] : []), ...at]);
  } else if (shown.headline) {
    // Their own words lead: the headline, which the agent starts with an -ing word. "Looking for" and
    // "you are" are written as [what] [role] for matching only, so they can read stiffly as a sentence.
    // The headline is a sentence of its own and the place another: its grammar is the agent's (a phrase, or
    // clauses), so "in <place>" is never joined onto it. A headline that ends on the shown place drops it there,
    // so the place isn't said twice.
    const alts = [place, shown.city, shown.country].filter(Boolean).map(s => String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
    let h = String(shown.headline).trim();
    if (alts) h = h.replace(new RegExp(`\\s+in\\s+(?:${alts})[\\s.!]*$`, "iu"), "");

    sentences.push(["I'm ", word("offering", shown.offering), ...at]);

    used.add(w.key);

  const order = { me: 0, both: 1, them: 2 };

    .sort((a, b) => order[detailParts(a.key).about] - order[detailParts(b.key).about]);
  for (const f of open) {

  // it's "something else": then the headline and the phrases say what it is.
  const facts = [];
  if (shown.kind && shown.kind !== "other") facts.push(word("kind", KIND_LABELS[shown.kind] || shown.kind));
  for (const [k, v] of Object.entries(shown)) if (!used.has(k) && hasValue(v)) facts.push(word(k, val(v)));

// Before anything is known (nothing told to the agent, no detail filled in), the profile is just who you

const started = c => !!(c.draft && (c.editing || c.draft.intent_text

function progressOf(items) {

// top: what goes above the hello on the white (the way back, a notice of unsaved changes).

// The full editor: your details (built-in ones and those your agent wrote about you or about what you both

// A new listing starts as the agent's chat, the whole screen: there's no profile to show until its draft has what

function toggleChat(slot) {

// What the Matchmaker AI did, for the presenter only (the phones never see it): how its last run decided the pairs the

function aiLine(m) {

  let line = ` Last run: the Matchmaker AI judged ${n("judge") + n("kept")} pairs the rules allow (${n("kept")} from earlier answers)`;
  if (n("waiting")) line += `, ${n("waiting")} waiting for its answer`;
  if (rules) line += `, ${rules} decided by the rules instead (over the run's cap, or no answer)`;
  line += ".";
  if (m.refused) line += ` ${m.refused} request${m.refused === 1 ? "" : "s"} stopped by the Warden's check before ${m.refused === 1 ? "it" : "they"} went.`;
  if (m.usage) line += ` Requests: ${u.answered || 0} answered, ${u.failed || 0} failed. Tokens: ${(u.prompt_tokens || 0).toLocaleString()} in, ${(u.completion_tokens || 0).toLocaleString()} out.`;
  if (m.resting) line += ` Resting after a failure (${esc(m.last_error || "no answer")}): the rules decide meanwhile.`;
  return line;
}

let ffBusy = false;
async function fastForward() {

  ffBusy = true; renderRoom();
  try {
    for (const slot of ["A", "B"]) {
      const sc = SCENARIOS[scenario][slot];
      toast(`Setting up phone ${slot}…`);
      if (!S.phones[slot].verified && !await api("verify", { slot, name: sc.name, age: sc.age })) return;
      let l = S.phones[slot].listings.find(x => x.chat.some(m => m.from === "me" && m.text === sc.message));
      if (!l) {
        if (!await api("new_listing", { slot })) return;
        l = S.phones[slot].listings.find(x => x.id === S.phones[slot].current);
      }
      local[slot].current = l.id;

      for (let i = 0; i < 2 && !curListing(slot).draft; i++) {  // a real agent may ask a question first

        if (!await api("agent", { slot, listing_id, text: "That's everything for now. Please draft my listing." })) return;
      }
      syncDraft(slot);
      // An agent that still has a question drafts nothing: its question is in the chat, and nothing goes live.
      if (!curListing(slot).draft) { openView(slot, "profile"); toast(`Phone ${slot}'s agent needs a bit more first. Its question is in the chat.`); return; }
      if (!curListing(slot).listed) { openView(slot, "profile"); await submit(slot); }

}
fetch(STATE_URL).then(r => r.json()).then(d => { S = d; render(VIEW); });
// Keep in sync with actions from other windows or devices (e.g. each person on their own phone).
// Each check-in also lets the Matchmaker run (every few seconds), so matches arrive without a button.
setInterval(async () => {
  if (inflight) return;
  try { const d = await (await fetch(STATE_URL)).json(); if (!inflight) { const first = !S; S = d; render(first ? VIEW : []); } } catch (_) {}
}, 2500);
</script>
</body>
</html>
