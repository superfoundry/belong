<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belong Demo</title>
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/belong.css">
<link rel="stylesheet" href="/ds/theme-dark.css">
<style>
  .stage { display: grid; grid-template-columns: 380px minmax(400px, 1fr) 380px; gap: var(--space-6);
           padding: var(--space-8) var(--space-6) var(--space-16); max-width: 1600px; margin: 0 auto; align-items: start; }
  @media (max-width: 1240px) { .stage { grid-template-columns: 1fr; max-width: 540px; } .panel { order: 3; } }
  .phone-wrap > .eyebrow { margin: 0 0 var(--space-3) var(--space-2); color: var(--text-tertiary); }

  /* ---------- phone ---------- */
  .phone { background: var(--surface-app); border: 10px solid var(--surface-inverse); border-radius: 44px; height: 800px;
           display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-lg); }
  .phone .top { padding: var(--space-4) var(--space-5) var(--space-3); border-bottom: 1px solid var(--border-subtle);
                display: flex; align-items: center; gap: var(--space-2); background: var(--surface-card); }
  .phone .top .wordmark { font-size: 19px; }
  .phone .top .who { font: var(--text-body-s); color: var(--text-secondary); }
  .phone .top .badge { margin-left: auto; }
  .screen { flex: 1; overflow-y: auto; padding: var(--space-5); }
  .phone .tabs { background: var(--surface-card); padding: 0 var(--space-4); border-top: 1px solid var(--border-subtle); border-bottom: 0; justify-content: space-between; }
  .phone .tabs button { margin: 0; padding: var(--space-3) 2px var(--space-4); position: relative; font: var(--text-label); font-weight: 600; }
  .phone .tabs .dot { position: absolute; top: 9px; right: -8px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-default); }
  .stack > * + * { margin-top: var(--space-4); }

  .welcome { text-align: center; padding: var(--space-10) var(--space-2) var(--space-8); }
  .welcome .wordmark { font-size: 44px; display: block; margin-bottom: var(--space-4); }
  .welcome p { color: var(--text-secondary); margin: 0; font: var(--text-body-s); }
  .form-row + .form-row { margin-top: var(--space-4); }
  /* Looks like a link; not clickable yet (bring-your-own-agent isn't built). */
  .connect-agent { color: var(--text-secondary); text-decoration: underline; text-underline-offset: 2px; cursor: default; }

  .bubble { max-width: 86%; padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); margin: var(--space-2) 0;
            white-space: pre-wrap; font: var(--text-body-s); }
  .bubble.agent { background: var(--accent-ai-muted); color: var(--text-primary); border-bottom-left-radius: var(--radius-sm); }
  .bubble.me { background: var(--surface-inverse); color: var(--text-inverse); margin-left: auto; border-bottom-right-radius: var(--radius-sm); }
  .bubble-note { margin: -2px 0 var(--space-2); }
  .typing { display: inline-flex; gap: 4px; padding: 13px 15px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-ai); animation: blink 1.2s infinite var(--ease-standard); }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .composer { display: flex; gap: var(--space-2); margin-top: var(--space-4); align-items: flex-end; }
  .composer .textarea { min-height: 56px; }
  .agent-note { text-align: center; margin-bottom: var(--space-3); }

  .notice { border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); font: var(--text-body-s); margin-bottom: var(--space-4); }
  .notice.error { background: var(--accent-error-muted); color: var(--text-error); }
  .notice.live { background: var(--accent-olive-muted); color: var(--text-olive); }
  .group-title { margin: var(--space-6) 0 var(--space-2); }
  .group-note { font: var(--text-caption); color: var(--text-secondary); margin: 0 0 var(--space-3); }
  .field { padding: var(--space-4) 0; border-bottom: 1px solid var(--border-subtle); }
  .field:first-child { padding-top: 0; } .field:last-child { border-bottom: 0; padding-bottom: 0; }
  .field .head { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-2); }
  .field .head .label { color: var(--text-secondary); }
  .field .head .push { margin-left: auto; }
  .field.hidden-field { background: var(--surface-sunken); border: 1px solid var(--border-ai); border-radius: var(--radius-md);
                        padding: var(--space-3); margin: var(--space-3) 0; }
  .field.hidden-field .hidden-note { margin-top: var(--space-2); }
  .exactness { display: flex; align-items: center; gap: var(--space-3); font: var(--text-caption); color: var(--text-secondary); margin-top: var(--space-3); }
  .exactness input { flex: 1; accent-color: var(--accent-default); }
  .preview { border: 1px dashed var(--border-strong); border-radius: var(--radius-md); padding: var(--space-4); margin: var(--space-6) 0 var(--space-4); }
  .reason { font: var(--text-body-s); color: var(--text-primary); margin: var(--space-3) 0 0; }
  .row { display: flex; gap: var(--space-2); align-items: center; }
  .row .grow { flex: 1; }
  .check-row { display: flex; gap: var(--space-2); align-items: center; padding: 4px 0; font: var(--text-body-s); }
  .check-row input { accent-color: var(--accent-default); }
  details.compare { margin-top: var(--space-4); }
  details.compare summary { cursor: pointer; font: var(--text-label); font-weight: 600; color: var(--text-accent); }
  .in-common { margin-top: var(--space-4); }
  .receipt-row { display: flex; gap: var(--space-2); align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border-subtle); }
  .receipt-row .grow { flex: 1; font: var(--text-body-s); }

  /* ---------- presenter panel ("Belong at night": the panel explaining private matching) ---------- */
  .panel { background: var(--surface-app); background-image: var(--gradient-app); color: var(--text-primary); border-radius: var(--radius-md);
           padding: var(--space-8); min-height: 800px; margin-top: 30px; box-shadow: var(--shadow-lg); }
  .panel .sub { color: var(--text-secondary); font: var(--text-body-s); margin: var(--space-2) 0 var(--space-6); }
  .panel .sub b { color: var(--text-primary); font-weight: 600; }
  .controls { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-6); }
  .controls .select { width: auto; background: var(--surface-card); }
  .audit { display: flex; gap: var(--space-4); align-items: flex-start; background: var(--surface-card); border: 1px solid var(--border-default);
           border-radius: var(--radius-md); padding: var(--space-4) var(--space-5); margin-bottom: var(--space-6); }
  .audit .heading-s { margin-bottom: 2px; }
  .inside-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-bottom: var(--space-6); }
  @media (max-width: 1460px) { .inside-grid { grid-template-columns: 1fr; } }
  .inside { background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: var(--space-5); }
  .inside .intent { font: var(--text-caption); color: var(--text-secondary); margin: var(--space-2) 0 var(--space-3); }
  .frow { display: grid; grid-template-columns: 110px 1fr; gap: var(--space-2); padding: 3px 0; font: var(--text-caption); align-items: baseline; }
  .frow .k { color: var(--text-tertiary); }
  .frow .hidden-well { padding: 4px 8px; display: inline-block; color: var(--text-primary); }
  .crowd { display: block; margin-top: 3px; font: var(--text-caption); }
  .crowd.usable { color: var(--text-ai); } .crowd.rare { color: var(--text-warning); }
  .legend { font: var(--text-caption); color: var(--text-secondary); margin: var(--space-2) 0 var(--space-4); display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); align-items: center; }
  .log { display: flex; flex-direction: column; gap: var(--space-3); }
  .ev { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); }
  .ev.blocked { border-color: var(--text-error); }
  .ev .t { font: var(--text-body-s); font-weight: 600; margin-left: var(--space-2); }
  .ev .x { font: var(--text-caption); color: var(--text-secondary); margin-top: 4px; }
  .payload { margin-top: var(--space-2); display: grid; gap: var(--space-2); }
  .pv { border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: var(--space-2) var(--space-3); font: var(--text-caption); }
  .pv .to { color: var(--text-tertiary); margin-bottom: 4px; }
  .pv .tag { background: var(--surface-raised); }
  .panel details summary { cursor: pointer; font: var(--text-caption); color: var(--text-secondary); margin-top: var(--space-2); }
  .rc { font: var(--text-mono-s); font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }
  .rc .pass { color: var(--text-success); } .rc .fail { color: var(--text-error); }
  table.mini { width: 100%; border-collapse: collapse; font: var(--text-caption); margin-top: var(--space-2); }
  table.mini td, table.mini th { padding: 4px; border-bottom: 1px solid var(--border-subtle); text-align: left; vertical-align: top; }
  table.mini th { color: var(--text-tertiary); font-weight: 500; }
  .panel a { color: var(--text-accent); }

  #toast { position: fixed; bottom: var(--space-6); left: 50%; transform: translateX(-50%); display: none; z-index: 30; }

  body.only-A .stage, body.only-B .stage { grid-template-columns: minmax(0, 420px); justify-content: center; }
  body.only-A .panel, body.only-B .panel, body.only-A .phone-wrap:last-child, body.only-B .phone-wrap:first-child { display: none; }
</style>
</head>
<body>
<script src="/nav.js"></script>
<div class="stage">
  <div class="phone-wrap"><p class="eyebrow">Person A's phone</p><div class="phone" id="phone-A"></div></div>
  <div class="panel" id="room" data-theme="dark"></div>
  <div class="phone-wrap"><p class="eyebrow">Person B's phone</p><div class="phone" id="phone-B"></div></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
// ---------------------------------------------------------------------------------
// Scenarios: presets the presenter can load. They only fill in what a person would
// type and choose; everything still goes through the agent and the Warden agent.
// ---------------------------------------------------------------------------------
const SCENARIOS = {
  climbers: { label: "Climbers in Osaka", A: { name: "Yuki", age: 27,
      message: "Looking for a climbing partner in Osaka on weekends. I'm an intermediate climber, into bouldering and ramen.",
      hidden: { religion: "Buddhist", smoking: "doesn't smoke" } },
    B: { name: "Ren", age: 29, message: "Need someone to belay with at Osaka gyms, weekends. Intermediate level, I also like jazz and ramen.",
      hidden: { religion: "Buddhist", health: "ADHD" } } },
  dating: { label: "Dating in Lisbon", A: { name: "Inês", age: 31,
      message: "Looking for a serious relationship with a man in Lisbon, aged 30 to 39. I'm a woman who loves hiking and film photography.",
      hidden: { religion: "Christian", children: "wants children" } },
    B: { name: "Tiago", age: 34, message: "I'd like to meet a woman in Lisbon for a long-term partner. Ideally aged 28 to 36. I'm a man into hiking and cooking.",
      hidden: { religion: "Christian", children: "wants children", income_band: "€30–50k" } } },
  language: { label: "Language exchange, Berlin and Tokyo", A: { name: "Lena", age: 26,
      message: "Language exchange, online is fine: I speak German natively and want to practice Japanese. I live in Berlin and love anime.",
      hidden: { politics: "politically progressive" }, values: { city: "Berlin" } },
    B: { name: "Haruto", age: 28, message: "Native Japanese speaker learning German, looking for a tandem partner. Online works too. Based in Tokyo, into anime.",
      hidden: { politics: "politically progressive" }, values: { city: "Tokyo" } } },
  band: { label: "Band in Tokyo (needs the AI agent)", A: { name: "Ren", age: 28,
      message: "i need to find someone in tokyo who plays guitar for my ska band" },
    B: { name: "Kai", age: 26, message: "I'm a guitarist in Tokyo, really into ska and punk, and I'd love to join a band. Weekends work best." } },
  fishing: { label: "Fishing in Ireland (needs the AI agent)", A: { name: "Aoife", age: 29,
      message: "Looking for a friend to teach me how to fish in ireland" },
    B: { name: "Seán", age: 41, message: "I've fished all my life around Galway and I'd love to teach a beginner, weekends mostly." } },
  stalker: { label: "Someone tries to find a specific person", A: { name: "Sam", age: 30,
      message: "The barista at the Blue Bottle in Tokyo with a nose ring, please find her.", values: { city: "Tokyo" } },
    B: { name: "Kim", age: 33, message: "Looking for my ex, Daniel Brooks, he lives in London.", values: { city: "London" } } },
};

let S = null;               // last state from the server
let scenario = "climbers";
const local = { A: { tab: null, draft: null, draftFrom: null, chatText: "", form: {} },
                B: { tab: null, draft: null, draftFrom: null, chatText: "", form: {} } };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const val = v => Array.isArray(v) ? v.join(", ") : v;
const $ = id => document.getElementById(id);
const badge = (tone, text) => `<span class="badge ${tone}">${esc(text)}</span>`;
const tags = values => values.map(v => `<span class="tag">${esc(v)}</span>`).join("");

let inflight = 0;
async function api(action, body = {}) {
  inflight++;
  try {
    const r = await fetch("/api/" + action, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await r.json();
    if (data.error) toast(data.error);
    if (data.phones) { S = data; render(body.slot ? [body.slot] : []); }
    return !data.error;
  } finally { inflight--; }
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "flex"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 4000); }

// Keep a local, editable copy of the agent's draft until the person submits.
function syncDraft(slot) {
  const p = S.phones[slot], L = local[slot];
  if (p.draft && L.draftFrom !== JSON.stringify(p.draft)) {
    L.draftFrom = JSON.stringify(p.draft);
    L.draft = JSON.parse(L.draftFrom);
    const sc = SCENARIOS[scenario]?.[slot];
    if (sc && L.applyScenario) { applyScenario(L.draft, sc); L.applyScenario = false; }
  }
  if (!p.draft) { L.draft = null; L.draftFrom = null; }
}
function applyScenario(draft, sc) {
  for (const f of draft.fields) {
    if (sc.values && f.key in sc.values) f.value = sc.values[f.key];
    if (sc.hidden && f.key in sc.hidden) { f.value = sc.hidden[f.key]; f.visibility = "hidden"; f.enabled = true; }
  }
}

// ---------------------------------------------------------------------------------
// Phone
// ---------------------------------------------------------------------------------
function screenFor(slot) {
  const p = S.phones[slot], L = local[slot];
  if (!p.verified) return "verify";
  if (L.tab) return L.tab;
  if (p.listed) return "matches";
  if (L.draft) return "listing";
  return "agent";
}

function renderPhone(slot) {
  syncDraft(slot);
  const p = S.phones[slot], L = local[slot], screen = screenFor(slot);
  const pending = p.intros.filter(i => i.status === "pending").length + p.followups.length;
  const tabs = p.verified ? `<div class="tabs">
      ${[["agent", "Agent"], ["listing", "Listing"], ["matches", "Matches"], ["receipts", "Receipts"]].map(([id, label]) =>
        `<button class="${screen === id ? "on" : ""}" onclick="go('${slot}','${id}')">${label}${id === "matches" && pending ? '<span class="dot" aria-label="needs your answer"></span>' : ""}</button>`).join("")}
    </div>` : "";
  // Tide marks live status, at most once per screen: "Matching" once listed, else "Verified".
  const status = p.listed ? badge("olive", "Matching") : p.verified ? badge("olive", "Verified") : "";
  $("phone-" + slot).innerHTML = `
    <div class="top"><span class="wordmark">Belong</span>${p.verified ? `<span class="who">${esc(p.name)}</span>` : ""}${status}</div>
    <div class="screen" id="screen-${slot}">${SCREENS[screen](slot, p, L)}</div>${tabs}`;
  if (screen === "agent") { const sc = $("screen-" + slot); sc.scrollTop = sc.scrollHeight; }
}
function go(slot, tab) { local[slot].tab = tab; renderPhone(slot); }

const SCREENS = {
  verify(slot, p, L) {
    const sc = SCENARIOS[scenario]?.[slot] || {};
    return `<div class="welcome"><span class="wordmark">Belong</span><p>Meet people who are looking for you too. Your hidden details can improve a match without ever being shown.</p></div>
      <div class="card md">
        <p class="eyebrow">Step 1</p>
        <h3 class="heading-m" style="margin: var(--space-2) 0">Verify your identity</h3>
        <p class="body-s secondary" style="margin: 0 0 var(--space-5)">An independent ID provider checks your document. Belong receives only two facts: that you're verified, and your age band.</p>
        <div class="form-row"><label class="field-label" for="name-${slot}">First name</label><input class="input" id="name-${slot}" value="${esc(L.form.name ?? sc.name ?? "")}" oninput="local['${slot}'].form.name=this.value"></div>
        <div class="form-row"><label class="field-label" for="age-${slot}">Age</label><input class="input" id="age-${slot}" type="number" min="18" max="99" value="${esc(L.form.age ?? sc.age ?? "")}" oninput="local['${slot}'].form.age=this.value"></div>
        <div style="margin-top: var(--space-6)"><button class="btn block" onclick="verify('${slot}')">Verify with the ID provider</button></div>
        <p class="caption" style="margin: var(--space-3) 0 0; text-align: center"><span class="connect-agent" aria-disabled="true" title="Coming soon">Connect your own agent</span></p>
      </div>`;
  },

  agent(slot, p, L) {
    const sc = SCENARIOS[scenario]?.[slot];
    // The scenario's opening line pre-fills the box only before the first message.
    const text = L.chatText || (!p.chat.some(m => m.from === "me") && sc ? sc.message : "");
    const lastMine = [...p.chat].reverse().find(m => m.from === "me");
    const pending = L.sending && !(p.agent_busy && lastMine && lastMine.text === L.sending) ? `<div class="bubble me">${esc(L.sending)}</div>` : "";
    const busy = L.sending || p.agent_busy;
    return `<p class="caption tertiary agent-note">Your agent works only for you</p>
      ${p.chat.map(m => `<div class="bubble ${m.from}">${esc(m.text)}</div>` +
        (m.draft_updated ? `<div class="bubble-note">${badge("ai", "Agent draft updated")}${p.listed ? ` <span class="caption secondary">Review and save to make the change live</span>` : ""}</div>` : "")).join("")}${pending}
      ${busy ? `<div class="bubble agent typing" aria-label="Your agent is replying"><span></span><span></span><span></span></div>` : ""}
      ${p.draft && !busy ? `<button class="btn secondary block" style="margin-top: var(--space-3)" onclick="go('${slot}','listing')">${p.listed ? "Review changes to my listing" : "Review my listing"}</button>` : ""}
      <div class="composer"><textarea class="textarea" id="chat-${slot}" aria-label="Message to your agent" placeholder="${p.chat.length > 1 ? "Reply to your agent" : "What are you looking for?"}" oninput="local['${slot}'].chatText=this.value"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send('${slot}')}">${esc(text)}</textarea>
        <button class="btn" ${busy ? "disabled" : ""} onclick="send('${slot}')">Send</button></div>`;
  },

  listing(slot, p, L) {
    if (!L.draft) return `<div class="card md"><p class="body-s secondary" style="margin:0">Tell your agent what you're looking for first.</p></div>`;
    const d = L.draft;
    const entry = p.entry;
    const normal = d.fields.filter(f => !f.sensitive), sensitive = d.fields.filter(f => f.sensitive);
    const shown = d.fields.filter(f => f.enabled && f.visibility === "shown" && hasValue(f.value));
    const hiddenN = d.fields.filter(f => f.enabled && f.visibility === "hidden" && hasValue(f.value)).length;
    return `
      ${entry && !entry.accepted ? `<div class="notice error"><b>Listing refused by the Warden agent.</b><br>${entry.problems.map(esc).join("<br>")}</div>` : ""}
      ${p.listed ? `<div class="notice live">Your listing is live for matching. Changes are checked again when you save.</div>` : ""}
      <div class="row"><p class="eyebrow grow">What you're looking for</p>${d.by === "claude" ? badge("ai", "Agent draft") : ""}</div>
      <textarea class="textarea" style="margin-top: var(--space-2)" aria-label="What you're looking for" oninput="local['${slot}'].draft.intent_text=this.value">${esc(d.intent_text)}</textarea>
      <p class="caption text-ai" style="margin: var(--space-2) 0 0">Used for matching, never shown to anyone.</p>
      <div class="exactness">Wide net <input type="range" min="0" max="1" step="0.1" value="${d.exactness}" aria-label="How exact" oninput="local['${slot}'].draft.exactness=+this.value"> Exact</div>

      <p class="eyebrow group-title">Your details</p>
      <div class="card md">${normal.map(f => fieldRow(slot, f)).join("")}</div>

      <p class="eyebrow group-title">Sensitive details</p>
      <p class="group-note">Hidden by default, and off until you turn them on. Hidden details are used for matching but never shown, and never the reason for a match.</p>
      <div class="card md">${sensitive.map(f => fieldRow(slot, f)).join("")}</div>

      <div class="preview"><p class="label" style="margin: 0 0 var(--space-3)">What a match will see</p>
        ${shown.length ? tags(shown.map(f => val(f.value))) : '<span class="body-s tertiary">Nothing yet</span>'}
        <p class="caption secondary" style="margin: var(--space-3) 0 0">Plus a reason the Warden agent writes from details you both show.</p>
        ${hiddenN ? `<p class="caption text-ai" style="margin: var(--space-1) 0 0">${hiddenN} hidden detail${hiddenN > 1 ? "s" : ""}: used for matching, never shown.</p>` : ""}</div>
      <button class="btn block lg" onclick="submit('${slot}')">${p.listed ? "Save changes" : "Start matching"}</button>`;
  },

  matches(slot, p, L) {
    if (!p.listed) return `<div class="card md"><p class="body-s secondary" style="margin:0">Review your listing and choose <b>Start matching</b> first.</p></div>`;
    const fu = p.followups.map(q => followupCard(slot, q)).join("");
    const intros = p.intros.map(i => introCard(slot, p, i)).join("");
    return `<div class="stack">${fu}${intros || `<div class="card md"><h3 class="heading-m" style="margin:0 0 var(--space-2)">Waiting for a match</h3>
      <p class="body-s secondary" style="margin:0 0 var(--space-2)">The Matchmaker agent only proposes people whose intent you meet and who meet yours. No one is approached who didn't ask.</p>
      <p class="caption tertiary" style="margin:0">Presenter: choose Run Matchmaker.</p></div>`}</div>`;
  },

  receipts(slot, p, L) {
    return `<div class="card sm" style="margin-bottom: var(--space-4)"><p class="body-s secondary" style="margin:0">Every check the Warden agent ran on your listing leaves a receipt: the check, the result, the time and a hash. Receipts never contain your details.</p></div>
      ${p.receipts.slice().reverse().map(r => `<div class="receipt-row">${badge(r.result === "pass" ? "success" : "error", r.result === "pass" ? "Pass" : "Fail")}
        <span class="grow">${esc(r.check.replaceAll("_", " "))}</span><span class="receipt" title="${r.hash}">${r.hash.slice(0, 10)}…</span></div>`).join("")
        || '<p class="body-s tertiary">No receipts yet.</p>'}`;
  },
};

const hasValue = v => Array.isArray(v) ? v.length > 0 : v !== null && v !== undefined && v !== "";

function fieldRow(slot, f) {
  const i = local[slot].draft.fields.indexOf(f);
  const at = `'${slot}',${i}`;
  const label = esc(f.label.replace(" (from ID check)", ""));
  if (f.sensitive && !f.enabled) {
    return `<div class="field"><div class="head"><span class="label">${label}</span><span class="caption tertiary push">Off</span>
      <button class="btn secondary sm" onclick="enable(${at},true)">Turn on</button></div></div>`;
  }
  let control;
  if (f.locked) control = `<span class="body-s">${esc(f.value)}</span> <span class="caption tertiary">from your ID check</span>`;
  else if (f.multi && f.options && f.options.length) control = `<div>${f.options.map(o => `<button class="tag${(f.value || []).includes(o) ? " on" : ""}" onclick="toggleChip(${at},'${esc(o)}')">${esc(o)}</button>`).join("")}</div>`;
  else if (f.multi) control = `<input class="input" value="${esc(val(f.value) ?? "")}" placeholder="Separate with commas" oninput="local['${slot}'].draft.fields[${i}].value=this.value.split(',').map(s=>s.trim()).filter(Boolean)">`;
  else if (f.options && f.options.length) control = `<select class="select" onchange="setVal(${at},this.value)"><option value="">Choose…</option>${f.options.map(o => `<option ${o === f.value ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  else control = `<input class="input" value="${esc(f.value ?? "")}" oninput="local['${slot}'].draft.fields[${i}].value=this.value">`;
  const always = ["seeking", "offering"].includes(f.key);
  const choice = f.locked ? "" : always ? `<span class="caption tertiary push">Always shown, so the right person can find you</span>` :
    `<span class="segmented push" role="group" aria-label="${label}: shown or hidden">
      <button class="${f.visibility === "shown" ? "on" : ""}" onclick="setVis(${at},'shown')">Shown</button>
      <button class="hidden-choice ${f.visibility === "hidden" ? "on" : ""}" onclick="setVis(${at},'hidden')">Hidden</button></span>`;
  const off = f.sensitive ? `<button class="btn ghost sm" onclick="enable(${at},false)">Turn off</button>` : "";
  // The fixed hidden look (sunken well, dusk hairline, "Hidden" badge) once the field holds a value.
  const hidden = f.visibility === "hidden" && !f.locked && hasValue(f.value);
  return `<div class="field${hidden ? " hidden-field" : ""}"><div class="head"><span class="label">${label}</span>${hidden ? badge("ai", "Hidden") : ""}${choice}${off}</div>${control}
    ${hidden ? `<div class="hidden-note">Used for matching, never shown</div>` : ""}</div>`;
}
function setVal(slot, i, v) {
  const f = local[slot].draft.fields[i]; f.value = v;
  if (f.key === "city") refreshOptions(slot, v); else renderPhone(slot);
}
function toggleChip(slot, i, o) {
  const f = local[slot].draft.fields[i]; const s = new Set(f.value || []);
  s.has(o) ? s.delete(o) : s.add(o); f.value = [...s]; renderPhone(slot);
}
function setVis(slot, i, v) {
  const f = local[slot].draft.fields[i];
  if (f.sensitive && v === "shown") {
    if (!confirm(`Show your ${f.label.toLowerCase()} to matches? Sensitive details are safest hidden: hidden, they can still improve a match.`)) return;
    f.confirmed = true;
  }
  f.visibility = v; renderPhone(slot);
}
function enable(slot, i, on) { const f = local[slot].draft.fields[i]; f.enabled = on; if (on) f.visibility = "hidden"; renderPhone(slot); }
async function refreshOptions(slot, city) {
  const d = local[slot].draft;
  const opts = await (await fetch(`/api/options?kind=${encodeURIComponent(d.kind || "")}&city=${encodeURIComponent(city)}`)).json();
  for (const f of d.fields) if (opts[f.key] && opts[f.key].length) { f.options = opts[f.key]; if (!f.multi && f.value && !opts[f.key].includes(f.value)) f.value = null; }
  renderPhone(slot);
}

function followupCard(slot, q) {
  let controls = "";
  if (q.question_id === "age_range") controls = `<div class="row"><input class="input" id="fu-min-${slot}" type="number" value="25" min="18" aria-label="From age"><span class="body-s secondary">to</span><input class="input" id="fu-max-${slot}" type="number" value="40" min="18" aria-label="To age"></div>
    <button class="btn" style="margin-top: var(--space-3)" onclick="answer('${slot}','age_range',{min:+$('fu-min-${slot}').value,max:+$('fu-max-${slot}').value})">Answer</button>`;
  else if (q.question_id === "schedule") controls = `<select class="select" id="fu-s-${slot}">${["weekends","weekday evenings","weekday mornings","flexible"].map(o => `<option>${o}</option>`).join("")}</select>
    <button class="btn" style="margin-top: var(--space-3)" onclick="answer('${slot}','schedule',{schedule:$('fu-s-${slot}').value})">Answer</button>`;
  else controls = `<div class="row"><button class="btn" onclick="answer('${slot}','wider_net',{yes:true})">Widen the net</button><button class="btn secondary" onclick="answer('${slot}','wider_net',{yes:false})">Keep it as is</button></div>`;
  return `<div class="card md">${badge("ai", "From the Matchmaker agent")}<h3 class="heading-m" style="margin: var(--space-3) 0">${esc(q.question_text)}</h3>${controls}</div>`;
}

function introCard(slot, p, i) {
  const f = i.view.fields;
  const facts = Object.entries(f).filter(([k]) => !["first_name", "seeking", "offering"].includes(k)).map(([, v]) => val(v));
  let action = "", status = "";
  if (i.status === "pending") action = `<div class="row" style="margin-top: var(--space-5)"><button class="btn grow" onclick="decide('${slot}','${i.intro_id}',true)">Say yes</button><button class="btn secondary" onclick="decide('${slot}','${i.intro_id}',false)">Not now</button></div>
    <p class="caption tertiary" style="margin: var(--space-2) 0 0">You're only introduced if you both say yes.</p>`;
  else if (i.status === "waiting") status = badge("", "Waiting on the other person");
  else if (i.status === "closed") action = `<p class="body-s secondary" style="margin: var(--space-4) 0 0">Not this time.</p>`;
  else { status = badge("success", "Introduced"); action = connectedBlock(slot, p, i); }
  return `<div class="card md"><div class="row"><h3 class="heading-l grow">${esc(f.first_name || "Someone")}</h3>${status}</div>
    <div style="margin-top: var(--space-3)">${tags(facts)}</div>
    <p class="reason">${esc(i.view.reason)}</p>${action}</div>`;
}
function connectedBlock(slot, p, i) {
  const name = esc(i.view.fields.first_name || "them");
  if (i.reveal_result) {
    return i.reveal_result.length
      ? `<div class="in-common hidden-well"><p class="label" style="margin:0 0 var(--space-2)">You also have in common</p>${i.reveal_result.map(r => `<div class="body-s">${esc(LABEL[r.key] || r.key)}: ${esc(r.values.join(", "))}</div>`).join("")}</div>`
      : `<p class="body-s secondary" style="margin: var(--space-4) 0 0">No other shared details to show.</p>`;
  }
  if (i.reveal_chosen) return `<p class="body-s secondary" style="margin: var(--space-4) 0 0">We'll let you know if you have anything else in common.</p>`;
  if (!p.hidden_keys.length) return "";
  return `<details class="compare"><summary>See what else you have in common</summary>
    <p class="caption secondary" style="margin: var(--space-2) 0">Choose any hidden details you'd be happy to compare with ${name}. Nothing is shown unless you both choose it and both have it.</p>
    ${p.hidden_keys.map(h => `<label class="check-row"><input type="checkbox" value="${h.key}" class="rv-${slot}-${i.intro_id}"> ${esc(h.label)}</label>`).join("")}
    <button class="btn sm" style="margin-top: var(--space-2)" onclick="reveal('${slot}','${i.intro_id}')">Compare</button></details>`;
}
const LABEL = { income_band: "Income", religion: "Religion", politics: "Politics", health: "Health", kinks: "Intimacy preferences",
  children: "Children", neighborhood: "Neighborhood", employer: "Employer", diet: "Diet", smoking: "Smoking" };

// actions
async function verify(slot) {
  local[slot].form = { name: $("name-" + slot).value, age: $("age-" + slot).value };
  if (await api("verify", { slot, name: local[slot].form.name, age: local[slot].form.age })) { local[slot].tab = null; render([slot]); }
}
async function send(slot) {
  const L = local[slot], text = $("chat-" + slot).value.trim();
  if (!text || L.sending) return;
  L.applyScenario = SCENARIOS[scenario]?.[slot]?.message === text;
  Object.assign(L, { sending: text, chatText: "", tab: "agent" });
  renderPhone(slot);
  await api("agent", { slot, text });
  L.sending = null;
  render([slot]);
}
async function submit(slot) {
  const d = local[slot].draft;
  const listing = { intent_text: d.intent_text, exactness: d.exactness,
    fields: d.fields.filter(f => f.enabled && hasValue(f.value)).map(f => ({ key: f.key, value: f.value, visibility: f.visibility, confirmed: !!f.confirmed })) };
  if (await api("submit", { slot, listing })) { local[slot].tab = S.phones[slot].listed ? "matches" : "listing"; render([slot]); }
}
const answer = (slot, question_id, ans) => api("answer", { slot, question_id, answer: ans });
const decide = (slot, intro_id, yes) => api("decide", { slot, intro_id, yes });
function reveal(slot, intro_id) {
  const keys = [...document.querySelectorAll(`.rv-${slot}-${intro_id}`)].filter(c => c.checked).map(c => c.value);
  api("reveal", { slot, intro_id, keys });
}

// ---------------------------------------------------------------------------------
// Behind the scenes (presenter view, in the system's dark treatment)
// ---------------------------------------------------------------------------------
const KIND = { in: ["", "Received"], out: ["olive", "Sent"], blocked: ["error", "Blocked"], inside: ["ai", "Private"] };
function renderRoom() {
  const r = S.room, lr = r.leak_report;
  const blocked = r.events.filter(e => e.kind === "blocked").length;
  $("room").innerHTML = `
    <p class="eyebrow">Presenter view</p>
    <h2 class="display-s" style="margin-top: var(--space-2)">Behind the scenes</h2>
    <p class="sub"><b>${esc(r.agent_status)}</b> on each phone. Single-phone views: <a href="/?phone=A" target="_blank">A</a>, <a href="/?phone=B" target="_blank">B</a>.<br>
      What private matching reads and what Belong sends out. The goal for production is that no one, including Belong, can see this; it's shown here only because the data is synthetic.</p>
    <div class="controls">
      <select class="select" id="scenario" aria-label="Scenario" onchange="scenario=this.value; resetLocal(false); render(['A','B'])">${Object.entries(SCENARIOS).map(([k, s]) => `<option value="${k}" ${k === scenario ? "selected" : ""}>${esc(s.label)}</option>`).join("")}</select>
      <button class="btn secondary sm" onclick="fastForward()">Fast-forward both phones</button>
      <button class="btn sm" onclick="api('match')">Run Matchmaker</button>
      <button class="btn secondary sm" onclick="api('attack')">Simulate a compromised Matchmaker</button>
      <button class="btn ghost sm" onclick="reset()">Reset</button>
    </div>
    <div class="audit">${lr.ok ? badge("success", "Passing") : badge("error", "Failed")}<div>
      <p class="heading-s">${lr.ok ? "Leak audit: no hidden detail has been shown" : `Leak audit failed: ${lr.findings.length} finding${lr.findings.length > 1 ? "s" : ""}`}</p>
      <p class="caption secondary" style="margin:0">${r.listings} listings on the Marketboard. Audited ${lr.checked.views} introduction views, ${lr.checked.followups} questions, ${lr.checked.reveals} compared details and ${lr.checked.receipts} receipts. ${blocked} attempt${blocked === 1 ? "" : "s"} blocked. k = ${r.k}.</p></div></div>
    ${r.inside.length ? `<div class="inside-grid">${r.inside.map(insideCard).join("")}</div>` : ""}
    <p class="eyebrow">Data log</p>
    <div class="legend">${badge("", "Received")} by Belong ${badge("olive", "Sent")} to a person, after the Warden agent's checks ${badge("error", "Blocked")} by the Warden agent ${badge("ai", "Private")} never sent</div>
    <div class="log">${r.events.slice().reverse().map(eventCard).join("")}</div>`;
}
function insideCard(l) {
  return `<div class="inside"><p class="label" style="margin:0">What the Matchmaker agent reads about ${esc(l.name)} (${l.slot})</p>
    <p class="intent">${esc(l.intent_text)}</p>
    ${l.fields.map(f => `<div class="frow"><span class="k">${esc(f.label.replace(" (from ID check)", ""))}</span>
      <span>${f.visibility === "hidden" ? `<span class="hidden-well">${esc(f.value)}</span> ${badge("ai", "Hidden")}
        <span class="crowd ${f.usable ? "usable" : "rare"}">${f.crowd} share it: ${f.usable ? "can raise a score" : `too rare, ignored (k = ${S.room.k})`}</span>` : esc(f.value)}</span></div>`).join("")}</div>`;
}
function eventCard(e) {
  const [tone, label] = KIND[e.kind];
  return `<div class="ev ${e.kind}"><div>${badge(tone, label)}<span class="t">${esc(e.title)}</span></div>
    ${e.text ? `<div class="x">${esc(e.text)}</div>` : ""}${payloadHtml(e)}
    ${e.receipts.length ? `<details><summary>${e.receipts.length} receipt${e.receipts.length > 1 ? "s" : ""}: ${e.receipts.filter(r => r.result === "fail").length ? "includes failures" : "all passed"}</summary>
      <div class="rc">${e.receipts.map(r => `<div><span class="${r.result}">${r.result}</span> ${esc(r.check)} · ${r.hash.slice(0, 16)}…</div>`).join("")}</div></details>` : ""}</div>`;
}
function payloadHtml(e) {
  const p = e.payload;
  if (!p) return "";
  if (Array.isArray(p) && p.length && p[0].view) return `<div class="payload">${p.map(v => `<div class="pv"><div class="to">To ${esc(v.to)}</div>
      ${Object.entries(v.view.fields).map(([k, x]) => `<span class="tag">${esc(k)}: ${esc(val(x))}</span>`).join("")}<p class="reason" style="margin-top: var(--space-2)">${esc(v.view.reason)}</p></div>`).join("")}</div>`;
  if (Array.isArray(p) && p.length && p[0].pair) return `<details><summary>${p.length} proposal${p.length > 1 ? "s" : ""}, internal: these are never sent</summary><table class="mini"><tr><th>Pair</th><th>Shown score and threshold</th><th>Reasons</th><th>Hidden boost</th></tr>
      ${p.map(x => `<tr><td>${esc(x.pair)}</td><td>${x.shown_score} of ${x.threshold} needed</td><td>${x.reason_fields.map(esc).join(", ")}</td><td>${x.hidden_fields_that_raised_it.length ? x.hidden_fields_that_raised_it.map(k => badge("ai", k)).join(" ") : "None"}</td></tr>`).join("")}</table></details>`;
  if (Array.isArray(p)) return `<div class="payload"><div class="pv">${p.map(x => Object.entries(x).map(([k, v]) => `<span class="tag">${esc(k)}: ${esc(v)}</span>`).join("")).join("<br>")}</div></div>`;
  return `<div class="payload"><div class="pv">${Object.entries(p).map(([k, v]) => `<span class="tag">${esc(k)}: ${esc(v)}</span>`).join("")}</div></div>`;
}

function resetLocal(clearForms = true) {
  for (const s of ["A", "B"]) Object.assign(local[s], { tab: null, chatText: "", ...(clearForms ? { form: {}, draft: null, draftFrom: null } : { form: {} }) });
}
async function reset() { resetLocal(); await api("reset"); }
async function fastForward() {
  for (const slot of ["A", "B"]) {
    const sc = SCENARIOS[scenario][slot];
    if (!S.phones[slot].verified && !await api("verify", { slot, name: sc.name, age: sc.age })) return;
    if (!S.phones[slot].draft) { local[slot].applyScenario = true; if (!await api("agent", { slot, text: sc.message })) return; }
    for (let i = 0; i < 2 && !S.phones[slot].draft; i++) {  // a real agent may ask a question first
      local[slot].applyScenario = true;
      if (!await api("agent", { slot, text: "That's everything for now. Please draft my listing." })) return;
    }
    syncDraft(slot);
    if (!S.phones[slot].listed) { local[slot].tab = null; await submit(slot); }
  }
}

// Redraw only what changed, so acting on one phone never disturbs the other
// (half-typed text, open sections, scroll position).
const last = { A: null, B: null, room: null };
function render(force = []) {
  for (const slot of ["A", "B"]) {
    const snap = JSON.stringify(S.phones[slot]);
    if (force.includes(slot) || snap !== last[slot]) { last[slot] = snap; renderPhone(slot); }
  }
  const roomSnap = JSON.stringify(S.room) + scenario;
  if (roomSnap !== last.room) { last.room = roomSnap; renderRoom(); }
}
const ONLY = new URLSearchParams(location.search).get("phone");
if (ONLY === "A" || ONLY === "B") document.body.classList.add("only-" + ONLY);
fetch("/api/state").then(r => r.json()).then(d => { S = d; render(["A", "B"]); });
// Keep in sync with actions from other windows or devices (e.g. each person on their own phone).
setInterval(async () => {
  if (inflight || !S) return;
  try { const d = await (await fetch("/api/state")).json(); if (!inflight) { S = d; render(); } } catch (_) {}
}, 2500);
</script>
</body>
</html>
