<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belong. demo</title>
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/belong.css">
<link rel="stylesheet" href="/ds/theme-dark.css">
<style>
  .stage { display: grid; grid-template-columns: 380px minmax(400px, 1fr) 380px; gap: var(--space-6);
           padding: var(--space-8) var(--space-6) var(--space-16); max-width: 1600px; margin: 0 auto; align-items: start; }
  @media (max-width: 1240px) { .stage { grid-template-columns: 1fr; max-width: 540px; } .panel { order: 3; } }
  .phone-wrap > .eyebrow { margin: 0 0 var(--space-3) var(--space-2); color: var(--text-tertiary); }

  /* ---------- phone ---------- */
  .phone { background: var(--surface-app); border: 10px solid var(--surface-inverse); border-radius: 44px; height: 800px;
           display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-lg); }
  .phone .top { padding: var(--space-4) var(--space-5) var(--space-3); border-bottom: 1px solid var(--border-subtle);
                display: flex; align-items: center; gap: var(--space-2); background: var(--surface-card); }
  .phone .top .wordmark { font-size: 19px; }
  .phone .top .who { font: var(--text-body-s); color: var(--text-secondary); }
  .phone .top .badge { margin-left: auto; }
  .screen { flex: 1; overflow-y: auto; padding: var(--space-5); }
  .phone .top { position: relative; }
  .menu-btn { all: unset; box-sizing: border-box; width: 36px; height: 36px; display: inline-flex; flex-direction: column; justify-content: center;
              align-items: center; gap: 4px; cursor: pointer; border-radius: var(--radius-md); margin-left: auto; }
  .menu-btn span { display: block; width: 16px; height: 2px; background: var(--text-primary); border-radius: 1px;
                   transition: transform var(--duration-base) var(--ease-standard), opacity var(--duration-base); }
  .menu-btn:hover { background: var(--surface-raised); }
  .menu-btn:focus-visible { outline: 2px solid var(--focus-ring); }
  .menu-btn[aria-expanded="true"] span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .menu-btn[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
  .menu-btn[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .menu { position: absolute; top: calc(100% + 4px); right: var(--space-3); z-index: 5; min-width: 180px; background: var(--surface-card);
          border: 1px solid var(--border-default); border-radius: var(--radius-md); box-shadow: var(--shadow-md); padding: var(--space-1) 0; }
  .menu button { all: unset; box-sizing: border-box; display: block; width: 100%; padding: var(--space-3) var(--space-4); cursor: pointer; font: var(--text-body-s); }
  .menu button:hover, .menu button:focus-visible { background: var(--surface-raised); }
  .menu button.sep { border-top: 1px solid var(--border-subtle); margin-top: var(--space-1); color: var(--text-secondary); }
  .tabbar { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-card); border-top: 1px solid var(--border-subtle); flex-shrink: 0; }
  .tabbar button { all: unset; box-sizing: border-box; position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
                   padding: var(--space-4) 0 var(--space-5); cursor: pointer; color: var(--text-tertiary);
                   transition: color var(--duration-fast) var(--ease-standard); }
  .tabbar button + button { border-left: 1px solid var(--border-subtle); }
  .tabbar button::before { content: ""; position: absolute; top: -1px; left: 28%; right: 28%; height: 2px; background: transparent; border-radius: 0 0 2px 2px; }
  .tabbar button.on { color: var(--text-primary); background: linear-gradient(var(--accent-muted), transparent 70%); }
  .tabbar button.on::before { background: var(--border-accent); }
  .tabbar button:hover { color: var(--text-primary); }
  .tabbar button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
  .tab-label { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: -0.01em; position: relative; }
  /* Notification dots are pure red by the user's choice, outside the token palette. */
  .phone { --notify: #ff0000; }
  .tabbar .dot { position: absolute; top: 2px; right: -11px; width: 8px; height: 8px; border-radius: 50%; background: var(--notify); }
  .setting-row { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) 0; border-bottom: 1px solid var(--border-subtle); }
  .setting-row:first-child { padding-top: 0; } .setting-row:last-child { border-bottom: 0; padding-bottom: 0; }
  .toggle-row { cursor: pointer; gap: var(--space-4); }
  /* A switch, from the system's Switch: coral when on. */
  .switch { appearance: none; flex-shrink: 0; width: 40px; height: 24px; border-radius: var(--radius-pill); background: var(--border-strong);
            position: relative; cursor: pointer; transition: background var(--duration-base) var(--ease-standard); margin: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--surface-card);
                   box-shadow: var(--shadow-sm); transition: transform var(--duration-base) var(--ease-standard); }
  .switch:checked { background: var(--accent-default); }
  .switch:checked::after { transform: translateX(16px); }
  .switch:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  .phone .tabs { background: var(--surface-card); padding: 0 var(--space-4); border-top: 1px solid var(--border-subtle); border-bottom: 0; justify-content: space-between; }
  .phone .tabs button { margin: 0; padding: var(--space-3) 2px var(--space-4); position: relative; font: var(--text-label); font-weight: 600; }
  .phone .tabs .dot { position: absolute; top: 9px; right: -8px; width: 6px; height: 6px; border-radius: 50%; background: var(--notify); }
  .stack > * + * { margin-top: var(--space-4); }
  .screen.split { padding: 0; position: relative; overflow: hidden; }
  /* Base layer: the profile, full screen. Bottom padding keeps it scrollable clear of the sheet. */
  .profile-pane { position: absolute; inset: 0; overflow-y: auto; padding: var(--space-4) var(--space-4) calc(62% + var(--space-4)); }
  .profile-pane.chat-min { padding-bottom: calc(56px + var(--space-4)); }
  /* Top layer: the agent chat as a sheet. Its header minimises it to a bar. */
  .chat-sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 62%; display: flex; flex-direction: column;
                background: var(--surface-card); border-top: 1px solid var(--border-default);
                border-radius: var(--radius-lg) var(--radius-lg) 0 0; box-shadow: var(--shadow-lg);
                transition: height var(--duration-slow) var(--ease-standard); }
  .chat-sheet.min { height: 52px; }
  .sheet-head { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: var(--space-2); width: 100%;
                padding: var(--space-3) var(--space-4); cursor: pointer; flex-shrink: 0; border-bottom: 1px solid var(--border-subtle); }
  .sheet-head:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: -2px; }
  .sheet-head .eyebrow { flex: 1; }
  .sheet-head .handle { width: 32px; height: 4px; border-radius: var(--radius-pill); background: var(--border-strong);
                        position: absolute; top: 6px; left: 50%; transform: translateX(-50%); }
  .chevron { width: 8px; height: 8px; border-right: 2px solid var(--text-tertiary); border-bottom: 2px solid var(--text-tertiary);
             transform: rotate(45deg); margin: -4px 4px 0; transition: transform var(--duration-base) var(--ease-standard); }
  .chat-sheet.min .chevron { transform: rotate(-135deg); margin-top: 4px; }
  .chat-sheet.min .chat-pane, .chat-sheet.min .composer-bar { display: none; }
  .chat-sheet.min .sheet-head { border-bottom: 0; }
  .sheet-head .unread { width: 8px; height: 8px; border-radius: 50%; background: var(--notify); }
  .profile-card { background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-md);
                  padding: var(--space-4); box-shadow: var(--shadow-sm); }
  .monogram { width: 40px; height: 40px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
              border-radius: var(--radius-md); background: var(--surface-sunken); color: var(--text-secondary);
              font-family: var(--font-display); font-weight: 700; font-size: 18px; }
  .profile-line { display: grid; grid-template-columns: 84px 1fr; gap: var(--space-2); margin-top: var(--space-3); align-items: baseline; }
  .progress-row { margin-top: var(--space-4); }
  .progress { height: 4px; background: var(--surface-raised); border-radius: var(--radius-pill); overflow: hidden; margin-top: var(--space-2); }
  .progress span { display: block; height: 100%; background: var(--accent-default); transition: width var(--duration-slow) var(--ease-standard); }
  .suggest { margin-top: var(--space-3); }
  .back-bar { display: flex; align-items: center; gap: var(--space-2); margin: calc(-1 * var(--space-2)) 0 var(--space-3) calc(-1 * var(--space-3)); }
  .back-chev { width: 7px; height: 7px; border-left: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); margin-right: 6px; }
  .list-head { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-4); }
  .list-head .heading-m { margin: 0; }
  .empty { text-align: center; margin-top: var(--space-10); }
  .empty .heading-l { margin: 0 0 var(--space-2); }
  .empty .btn { margin-top: var(--space-5); }
  .listing-card { position: relative; }
  .listing-card .listing-open > .row:first-child { padding-right: 34px; }
  .gear { all: unset; position: absolute; top: var(--space-3); right: var(--space-3); width: 32px; height: 32px; border-radius: 50%;
          display: inline-flex; align-items: center; justify-content: center; color: var(--text-tertiary); cursor: pointer; z-index: 1; }
  .gear:hover { background: var(--surface-raised); color: var(--text-primary); }
  .gear-pop { position: absolute; top: 48px; right: var(--space-3); z-index: 4; width: 250px; background: var(--surface-card);
              border: 1px solid var(--border-default); border-radius: var(--radius-md); box-shadow: var(--shadow-md); padding: var(--space-3) var(--space-4); }
  .gear-pop .setting-row { padding: var(--space-3) 0; }
  .toggle-row.disabled { opacity: .5; cursor: default; }
  /* A paused listing is greyed out; its settings stay usable. */
  .listing-card.paused > :not(.gear):not(.gear-pop) { opacity: .45; filter: grayscale(1); }
  .gear:focus-visible { outline: 2px solid var(--focus-ring); }
  .listing-open { all: unset; box-sizing: border-box; display: block; width: 100%; cursor: pointer; }
  .listing-open > .row { display: flex; }
  .listing-open:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 4px; }
  .listing-open:hover .text-accent { text-decoration: underline; }
  .linkish { all: unset; cursor: pointer; color: var(--text-accent); text-decoration: underline; text-underline-offset: 2px; }
  .found-card { all: unset; box-sizing: border-box; display: flex; gap: var(--space-3); align-items: center; width: 100%; cursor: pointer;
                background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); }
  .found-card:hover { border-color: var(--border-strong); }
  .found-card:focus-visible { outline: 2px solid var(--focus-ring); }
  .found-card .grow > span { display: block; }
  .found-card .msg-preview { margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--notify); flex-shrink: 0; }
  .thread { display: flex; flex-direction: column; height: 100%; background: var(--surface-app); }
  .thread-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-5) var(--space-4) var(--space-3);
                 background: var(--surface-card); border-bottom: 1px solid var(--border-subtle); }
  .thread-head .back { padding: var(--space-2); }
  .thread-head .back .back-chev { margin: 0 0 0 4px; }
  .thread-head .heading-s { margin: 0; }
  .why { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 2px; font: var(--text-caption); color: var(--text-accent); }
  .why .chevron { width: 6px; height: 6px; margin: -3px 0 0 4px; border-color: var(--text-accent); }
  .why[aria-expanded="true"] .chevron { transform: rotate(-135deg); margin-top: 3px; }
  .why-panel { background: var(--surface-card); border-bottom: 1px solid var(--border-subtle); padding: var(--space-3) var(--space-4) var(--space-4); }
  .thread-pane { flex: 1; overflow-y: auto; padding: var(--space-4); }
  .thread-note { text-align: center; margin: var(--space-2) 0 var(--space-4); }
  /* Chat bubbles are rounder than the system's radii, by the user's choice. */
  .thread { --bubble: 18px; --bubble-tail: 5px; }
  .msg-row { display: flex; align-items: flex-end; gap: 6px; margin: 1px 0; }
  .msg-row.first { margin-top: var(--space-2); }
  .msg-row.me { justify-content: flex-end; }
  .msg-col { display: flex; flex-direction: column; max-width: 74%; }
  .msg-row.me .msg-col { align-items: flex-end; }
  .bubble-wrap { position: relative; display: flex; align-items: center; gap: 4px; }
  .msg-row .bubble { margin: 0; max-width: 100%; padding: 7px 12px; font-size: 14px; line-height: 1.35; border-radius: var(--bubble); }
  .msg-row .bubble.them { background: var(--surface-raised); border: 0; }
  /* In a run, the bubbles hug each other on the speaker's side; the latest keeps a small tail. */
  .msg-row.them:not(.first) .bubble { border-top-left-radius: var(--bubble-tail); }
  .msg-row.them:not(.last) .bubble { border-bottom-left-radius: var(--bubble-tail); }
  .msg-row.me:not(.first) .bubble { border-top-right-radius: var(--bubble-tail); }
  .msg-row.me:not(.last) .bubble { border-bottom-right-radius: var(--bubble-tail); }
  .avatar-space { width: 26px; flex-shrink: 0; }
  .msg-time { font: var(--text-caption); font-size: 10.5px; color: var(--text-tertiary); margin-top: 3px; padding: 0 6px; }
  .react-btn { all: unset; cursor: pointer; width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%; display: inline-flex; align-items: center;
               justify-content: center; color: var(--text-tertiary); opacity: .45; transition: opacity var(--duration-fast); }
  .bubble-wrap:hover .react-btn, .react-btn:focus-visible { opacity: 1; }
  .react-btn:hover { background: var(--surface-raised); color: var(--text-primary); }
  .react-btn:focus-visible { outline: 2px solid var(--focus-ring); }
  .react-picker { position: absolute; bottom: calc(100% + 4px); z-index: 3; display: flex; gap: 2px; padding: 4px;
                  background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-pill); box-shadow: var(--shadow-md); }
  .msg-row.them .react-picker { left: 0; } .msg-row.me .react-picker { right: 0; }
  .react-picker button { all: unset; cursor: pointer; font-size: 20px; width: 34px; height: 34px; display: inline-flex; align-items: center;
                         justify-content: center; border-radius: 50%; transition: transform var(--duration-fast) var(--ease-standard); }
  .react-picker button:hover { background: var(--surface-raised); transform: scale(1.15); }
  .reaction { all: unset; flex-shrink: 0; font-size: 15px; width: 24px; height: 24px; display: inline-flex; align-items: center;
              justify-content: center; border-radius: 50%; }
  button.reaction { cursor: pointer; }
  button.reaction:hover { background: var(--surface-raised); }
  button.reaction:focus-visible { outline: 2px solid var(--focus-ring); }
  .react-picker button.on { background: var(--accent-muted); }
  .avatar { width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
            background: var(--accent-muted); color: var(--text-accent); font-family: var(--font-display); font-weight: 700; font-size: 12px; }
  .thread-head .avatar { width: 40px; height: 40px; font-size: 16px; }
  .thread .chat-pane .msg-row + .msg-time { display: none; }
  /* Composer: a rounded field with a round send button. */
  .thread .composer-bar { padding: var(--space-2) var(--space-3) var(--space-3); gap: var(--space-2); align-items: center; }
  .thread .composer-bar .textarea { min-height: 40px; max-height: 100px; border-radius: 20px; padding: 9px 16px; resize: none; }
  .thread .composer-bar .btn { border-radius: 20px; padding: 0 var(--space-4); height: 40px; }
  .thread-pane { padding: var(--space-3) var(--space-3) var(--space-4); }
  .thread-note { margin: var(--space-1) 0 var(--space-3); }
  .about-match summary { cursor: pointer; font: var(--text-label); font-weight: 600; color: var(--text-accent); }
  .chat-sheet.match-chat { height: 64%; }
  .sheet-head.static { cursor: default; flex-direction: column; align-items: flex-start; gap: 2px; }
  .bubble.them { background: var(--surface-card); border: 1px solid var(--border-default); border-bottom-left-radius: var(--radius-sm); }
  .prefs-row { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-4); }
  /* The privacy questions before a new listing: the whole phone screen. */
  .privacy { display: flex; flex-direction: column; min-height: 100%; }
  .privacy > .progress { margin: var(--space-2) 0 var(--space-6); }
  .privacy-body { flex: 1; }
  .privacy-body .heading-l { margin: 0 0 var(--space-4); }
  .privacy-foot { padding-top: var(--space-6); }
  .facts { margin: 0 0 var(--space-4); padding-left: var(--space-5); font: var(--text-body-s); }
  .facts li + li { margin-top: var(--space-3); }
  .facts b { font-weight: 600; }
  .check-row.ack { margin-top: var(--space-4); padding: var(--space-3); border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--surface-card); }
  .one-way { background: var(--surface-raised); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); margin: var(--space-4) 0; }
  .one-way .label { margin: 0 0 var(--space-1); color: var(--text-secondary); }
  .one-way .body-s { margin: 0; } .one-way .body-s + .body-s { margin-top: var(--space-2); }
  .choices { display: grid; gap: var(--space-2); }
  .choice { display: flex; gap: var(--space-3); align-items: center; padding: var(--space-3) var(--space-4); border: 1px solid var(--border-default);
            border-radius: var(--radius-md); background: var(--surface-card); font: var(--text-body-s); cursor: pointer; }
  .choice.on { border-color: var(--border-accent); }
  .choice input { accent-color: var(--accent-default); }
  .listing-nav { margin-bottom: var(--space-2); }
  .listing-card .heading-m { margin: 0; }
  details.matches { margin-top: var(--space-4); border-top: 1px solid var(--border-subtle); padding-top: var(--space-3); }
  details.matches > summary { cursor: pointer; font: var(--text-label); font-weight: 600; color: var(--text-accent); }
  /* The listings page in shades of paper: off-white screen, white listing cards, cream matches,
     deeper cream questions, with coral for status and the matches heading. */
  .screen:has(> .list-head) { background: var(--sf-paper-100); }
  .card.intro.question { background: var(--sf-paper-400) !important; }
  .card.intro { box-shadow: none; background: var(--surface-raised); border-color: transparent; }
  .profile-card .posted { margin-top: var(--space-4); padding-top: var(--space-4); border-top: 1px solid var(--border-subtle); }
  .profile-card .posted .monogram { width: 32px; height: 32px; font-size: 15px; }
  .profile-card .posted .heading-m { font: var(--text-body-s); font-weight: 600; }
  .suggest .tag { cursor: pointer; }
  .suggest .tag:hover { border-color: var(--border-accent); color: var(--text-primary); }
  .editor { margin-top: var(--space-5); }
  .chat-pane { flex: 1; overflow-y: auto; padding: var(--space-3) var(--space-4); }
  .composer-bar { display: flex; gap: var(--space-2); align-items: flex-end; padding: var(--space-3) var(--space-4);
                  border-top: 1px solid var(--border-subtle); background: var(--surface-card); flex-shrink: 0; }
  .composer-bar .textarea { min-height: 44px; max-height: 120px; }

  /* The phone's first screen: the name in the middle, on a very slight off-white. */
  .screen:has(> .start), .screen:has(> .signin) { background: var(--sf-paper-100); }
  .signin { display: flex; flex-direction: column; min-height: 100%; }
  .signin .back-bar { margin-bottom: var(--space-6); }
  .signin-body { flex: 1; }
  .signin-body .heading-l { margin: 0 0 var(--space-2); }
  .signin-body > .body-s { margin: 0 0 var(--space-6); }
  .signin-foot { padding-top: var(--space-6); }
  .start { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; }
  .start .wordmark { font-size: 56px; }
  .start .btn { position: absolute; left: 0; right: 0; bottom: var(--space-2); width: 100%; }
  .welcome { text-align: center; padding: var(--space-10) var(--space-2) var(--space-8); }
  .welcome .wordmark { font-size: 44px; display: block; margin-bottom: var(--space-4); }
  .welcome p { color: var(--text-secondary); margin: 0; font: var(--text-body-s); }
  .form-row + .form-row { margin-top: var(--space-4); }
  /* Looks like a link; not clickable yet (bring-your-own-agent isn't built). */
  .connect-agent { color: var(--text-secondary); text-decoration: underline; text-underline-offset: 2px; cursor: default; }

  .bubble { max-width: 86%; padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); margin: var(--space-2) 0;
            white-space: pre-wrap; font: var(--text-body-s); }
  .bubble.agent { background: var(--accent-ai-muted); color: var(--text-primary); border-bottom-left-radius: var(--radius-sm); }
  .bubble.me { background: var(--surface-inverse); color: var(--text-inverse); margin-left: auto; border-bottom-right-radius: var(--radius-sm); }
  .bubble-note { margin: -2px 0 var(--space-2); }
  .typing { display: inline-flex; gap: 4px; padding: 13px 15px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--text-ai); animation: blink 1.2s infinite var(--ease-standard); }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .composer { display: flex; gap: var(--space-2); margin-top: var(--space-4); align-items: flex-end; }
  .composer .textarea { min-height: 56px; }

<body>
<script src="/nav.js"></script>
<div class="stage">
  <div class="phone-wrap"><p class="eyebrow">Person A's phone</p><div class="phone" id="phone-A"></div></div>
  <div class="panel" id="room" data-theme="dark"></div>
  <div class="phone-wrap"><p class="eyebrow">Person B's phone</p><div class="phone" id="phone-B"></div></div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
// ---------------------------------------------------------------------------------
// Scenarios: presets the presenter can load. They only fill in what a person would
// type and choose; everything still goes through the agent and the Warden agent.
// The demo starts blank: people type their own.
// ---------------------------------------------------------------------------------
const SCENARIOS = {
  blank: { label: "Blank (type your own)", A: {}, B: {} },
  climbers: { label: "Climbers in Osaka", A: { name: "Yuki", age: 27,
      message: "Looking for a climbing partner in Osaka on weekends. I'm an intermediate climber, into bouldering and ramen.",
      hidden: { religion: "Buddhist", smoking: "doesn't smoke" } },
    B: { name: "Ren", age: 29, message: "Need someone to belay with at Osaka gyms, weekends. Intermediate level, I also like jazz and ramen.",
      hidden: { religion: "Buddhist", health: "ADHD" } } },
  dating: { label: "Dating in Lisbon", A: { name: "Inês", age: 31,
      message: "Looking for a serious relationship with a man in Lisbon, aged 30 to 39. I'm a woman who loves hiking and film photography.",
      hidden: { religion: "Christian", children: "wants children" } },
    B: { name: "Tiago", age: 34, message: "I'd like to meet a woman in Lisbon for a long-term partner. Ideally aged 28 to 36. I'm a man into hiking and cooking.",
      hidden: { religion: "Christian", children: "wants children", income_band: "€30–50k" } } },
  language: { label: "Language exchange, Berlin and Tokyo", A: { name: "Lena", age: 26,
      message: "Language exchange, online is fine: I speak German natively and want to practice Japanese. I live in Berlin and love anime.",
      hidden: { politics: "politically progressive" }, values: { city: "Berlin" } },
    B: { name: "Haruto", age: 28, message: "Native Japanese speaker learning German, looking for a tandem partner. Online works too. Based in Tokyo, into anime.",
      hidden: { politics: "politically progressive" }, values: { city: "Tokyo" } } },
  band: { label: "Band in Tokyo (needs the AI agent)", A: { name: "Ren", age: 28,
      message: "i need to find someone in tokyo who plays guitar for my ska band" },
    B: { name: "Kai", age: 26, message: "I'm a guitarist in Tokyo, really into ska and punk, and I'd love to join a band. Weekends work best." } },
  fishing: { label: "Fishing in Ireland (needs the AI agent)", A: { name: "Aoife", age: 29,
      message: "Looking for a friend to teach me how to fish in ireland" },
    B: { name: "Seán", age: 41, message: "I've fished all my life around Galway and I'd love to teach a beginner, weekends mostly." } },
  stalker: { label: "Someone tries to find a specific person", A: { name: "Sam", age: 30,
      message: "The barista at the Blue Bottle in Tokyo with a nose ring, please find her.", values: { city: "Tokyo" } },
    B: { name: "Kim", age: 33, message: "Looking for my ex, Daniel Brooks, he lives in London.", values: { city: "London" } } },
};

let S = null;               // last state from the server
let scenario = "blank";
// Per phone: the open tab, the verify form, which listing is open, and per-listing local
// state (an editable copy of the draft, the half-typed message, chat sheet state).
const fresh = () => ({ tab: null, view: null, thread: null, q: null, form: {}, current: null, ls: {}, seen: {}, msg: {}, seenFound: {} });
const local = { A: fresh(), B: fresh() };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const val = v => Array.isArray(v) ? v.join(", ") : v;
const $ = id => document.getElementById(id);
const badge = (tone, text) => `<span class="badge ${tone}">${esc(text)}</span>`;
const tags = values => values.map(v => `<span class="tag">${esc(v)}</span>`).join("");
const cap = t => t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
const hasValue = v => Array.isArray(v) ? v.length > 0 : v !== null && v !== undefined && v !== "";

function curId(slot) { return local[slot].current || (S && S.phones[slot].current) || null; }
function curListing(slot) {
  const ls = S.phones[slot].listings;
  return ls.find(l => l.id === curId(slot)) || ls[ls.length - 1] || null;
}
function cur(slot) {
  const id = curId(slot) || "_";
  return local[slot].ls[id] ||= { draft: null, draftFrom: null, chatText: "", editing: false, chatMin: false,
                                  seenChat: 0, sending: null, applyScenario: false };
}

let inflight = 0;
async function api(action, body = {}) {
  inflight++;
  try {
    const r = await fetch("/api/" + action, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await r.json();
    if (data.error) toast(data.error);
    if (data.phones) { S = data; render(body.slot ? [body.slot] : []); }
    return !data.error;
  } finally { inflight--; }
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "flex"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 4000); }

// Keep a local, editable copy of the open listing's draft until the person saves it.
function syncDraft(slot) {
  const l = curListing(slot), c = cur(slot);
  if (l && l.draft && c.draftFrom !== JSON.stringify(l.draft)) {
    c.draftFrom = JSON.stringify(l.draft);
    c.draft = JSON.parse(c.draftFrom);
    const sc = SCENARIOS[scenario]?.[slot];
    if (sc && c.applyScenario) { applyScenario(c.draft, sc); c.applyScenario = false; }
  }
  if (!l || !l.draft) { c.draft = null; c.draftFrom = null; }
}
function applyScenario(draft, sc) {
  for (const f of draft.fields) {
    if (sc.values && f.key in sc.values) f.value = sc.values[f.key];
    if (sc.hidden && f.key in sc.hidden) { f.value = sc.hidden[f.key]; f.visibility = "hidden"; f.enabled = true; }
  }
}

// ---------------------------------------------------------------------------------
// Phone
// ---------------------------------------------------------------------------------
// Where a phone is: one of two tabs (Belong.: your listings; Found.: people you've both said yes
// to), or a screen opened from them (a listing's profile and chat, a chat with a match, the
// privacy questions before a new listing, receipts).
function screenFor(slot) {
  const p = S.phones[slot], L = local[slot];
  if (!p.verified) return "verify";
  if (L.signedOut) return "signedout";
  return L.view || L.tab || "belong";
}

function needsAnswer(l) { return l.intros.filter(i => i.status === "pending").length + l.followups.length; }
// A listing someone opened but never wrote anything in isn't shown in the list.
const untouched = l => !l.listed && !l.draft && !l.chat.some(m => m.from === "me");
const connected = p => p.listings.flatMap(l => l.intros.filter(i => i.status === "connected").map(i => ({ ...i, listing: l })));
function unread(slot, i) {
  const t = i.thread || [], seen = local[slot].seen[i.intro_id] || 0;
  return t.length > seen && !t[t.length - 1].mine;
}

function renderPhone(slot) {
  if (S.phones[slot].verified) syncDraft(slot);
  const p = S.phones[slot], L = local[slot], screen = screenFor(slot);
  if (screen === "thread") { const i = connected(p).find(x => x.intro_id === L.thread); if (i) L.seen[i.intro_id] = (i.thread || []).length; }
  const pending = p.listings.reduce((n, l) => n + needsAnswer(l), 0);
  if (screen === "found" || screen === "thread") for (const i of connected(p)) L.seenFound[i.intro_id] = true;
  const newMessages = connected(p).some(i => unread(slot, i) || !L.seenFound[i.intro_id]);
  const onTab = screen === "belong" || screen === "found";
  const tabs = onTab ? `<nav class="tabbar" aria-label="Main">
      ${[["belong", "Belong.", pending], ["found", "Found.", newMessages]].map(([id, label, dot]) =>
        `<button class="${id}${screen === id ? " on" : ""}" aria-current="${screen === id ? "page" : "false"}" onclick="go('${slot}','${id}')">
          <span class="tab-label">${label}${dot ? '<span class="dot" aria-label="needs you"></span>' : ""}</span></button>`).join("")}
    </nav>` : "";
  const menu = p.verified && !L.signedOut ? `<button class="menu-btn" aria-expanded="${!!L.menu}" aria-label="Menu" onclick="toggleMenu('${slot}')"><span></span><span></span><span></span></button>
    ${L.menu ? `<div class="menu" role="menu">${[["me", "Profile"], ["settings", "Settings"], ["receipts", "Receipts"]].map(([v, label]) =>
      `<button role="menuitem" onclick="menuGo('${slot}','${v}')">${label}</button>`).join("")}
      <button role="menuitem" class="sep" onclick="signOut('${slot}')">Log out</button></div>` : ""}` : "";
  // The top bar carries no status pill; each listing shows its own.
  const status = "";
  // Keep the profile pane's scroll position across redraws (editing, agent updates).
  const oldPane = document.querySelector(`#phone-${slot} .profile-pane`);
  const paneScroll = oldPane ? oldPane.scrollTop : 0;
  const split = screen === "profile";
  $("phone-" + slot).innerHTML = screen === "privacy"
    ? `<div class="screen" id="screen-${slot}">${SCREENS.privacy(slot, p, L)}</div>`
    : screen === "thread" ? SCREENS.thread(slot, p, L)
    : screen === "verify" ? `<div class="screen" id="screen-${slot}">${SCREENS.verify(slot, p, L)}</div>`
    : `<div class="top"><span class="wordmark">Belong.</span>${status}${menu}</div>
    <div class="screen${split ? " split" : ""}" id="screen-${slot}">${SCREENS[screen](slot, p, L)}</div>${tabs}`;
  if (screen === "thread") renderThreadScroll(slot);
  if (split) {
    const chat = document.querySelector(`#phone-${slot} .chat-pane`); if (chat) chat.scrollTop = chat.scrollHeight;
    const pane = document.querySelector(`#phone-${slot} .profile-pane`); if (pane) pane.scrollTop = paneScroll;
  }
}
// Like a chat app: messages in a row from the same person form a group; only the latest in a
// group shows the avatar and the time. Each message can get one of a few reactions.
const REACTIONS = ["👍", "❤️", "😂", "😮", "🙏"];
const GEAR = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>`;  // Lucide "settings"
const SMILE_PLUS = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11v1a10 10 0 1 1-9-10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/><path d="M16 5h6"/><path d="M19 2v6"/></svg>`;  // Lucide "smile-plus"
function msgTime(at) {
  if (!at) return "";
  const d = new Date(at), now = new Date();
  const time = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  return d.toDateString() === now.toDateString() ? time : `${d.toLocaleDateString([], { month: "short", day: "numeric" })}, ${time}`;
}
function messageRow(slot, i, m, n, t, theirName, myName) {
  const next = t[n + 1], last = !next || next.mine !== m.mine;
  const first = n === 0 || t[n - 1].mine !== m.mine;
  const who = m.mine ? "me" : "them";
  // Only the other person gets an avatar, on the latest message of each run.
  const avatar = m.mine ? "" : last ? `<span class="avatar" aria-hidden="true">${esc((theirName || "?").slice(0, 1).toUpperCase())}</span>`
                                    : `<span class="avatar-space"></span>`;
  const open = local[slot].reactOpen === `${i.intro_id}:${n}`;
  // A reaction sits beside the bubble, where the react button is. You react only to their
  // messages; on yours you see the reaction they left.
  const theirs = (m.reactions || []).find(r => !r.mine), mineR = (m.reactions || []).find(r => r.mine);
  let side;
  if (m.mine) {
    side = theirs ? `<span class="reaction" aria-label="${esc(theirName)} reacted ${theirs.emoji}">${theirs.emoji}</span>` : "";
  } else {
    side = `<button class="${mineR ? "reaction mine" : "react-btn"}" aria-label="${mineR ? `Your reaction ${mineR.emoji}, change it` : "React to this message"}"
      onclick="toggleReact('${slot}','${i.intro_id}:${n}')">${mineR ? mineR.emoji : SMILE_PLUS}</button>`;
  }
  const picker = open && !m.mine ? `<div class="react-picker" role="menu">${REACTIONS.map(e =>
    `<button role="menuitem" class="${mineR && mineR.emoji === e ? "on" : ""}" onclick="react('${slot}','${i.intro_id}',${n},'${e}')" aria-label="React ${e}">${e}</button>`).join("")}</div>` : "";
  return `<div class="msg-row ${who}${first ? " first" : ""}${last ? " last" : ""}">
    ${avatar}
    <div class="msg-col">
      <div class="bubble-wrap">${m.mine ? side : ""}<div class="bubble ${who}">${esc(m.text)}</div>${m.mine ? "" : side}${picker}</div>
      ${last ? `<span class="msg-time">${esc(msgTime(m.at))}</span>` : ""}
    </div></div>`;
}
// Tapping anywhere else closes an open reaction picker.
document.addEventListener("click", e => {
  if (!document.contains(e.target)) return;  // the tap redrew the screen (e.g. it opened the picker)
  for (const slot of ["A", "B"]) {
    if (local[slot].gear && !e.target.closest(`#phone-${slot} .gear-pop, #phone-${slot} .gear`)) {
      local[slot].gear = null; renderPhone(slot);
    }
    if (local[slot].reactOpen && !e.target.closest(`#phone-${slot} .react-picker, #phone-${slot} .react-btn`)) {
      local[slot].reactOpen = null; renderPhone(slot);
    }
  }
});
function toggleReact(slot, key) { local[slot].reactOpen = local[slot].reactOpen === key ? null : key; renderPhone(slot); }
async function react(slot, intro_id, index, emoji) {
  local[slot].reactOpen = null;
  await api("react", { slot, intro_id, index, emoji });
  renderPhone(slot);
}
function renderThreadScroll(slot) {
  const pane = document.querySelector(`#phone-${slot} .thread-pane`); if (pane) pane.scrollTop = pane.scrollHeight;
}
function go(slot, tab) { Object.assign(local[slot], { tab, view: null, menu: false }); renderPhone(slot); }
function toggleMenu(slot) { local[slot].menu = !local[slot].menu; renderPhone(slot); }
function menuGo(slot, view) { Object.assign(local[slot], { view, menu: false }); renderPhone(slot); }
async function saveProfile(slot) {
  if (await api("update_profile", { slot, name: local[slot].pname })) { local[slot].pname = undefined; renderPhone(slot); toast("Profile saved"); }
}
// The demo has no accounts: logging out just leaves this phone; nothing is deleted.
function signOut(slot) { Object.assign(local[slot], { signedOut: true, menu: false, view: null }); renderPhone(slot); }
function openView(slot, view, extra = {}) { Object.assign(local[slot], { view, menu: false }, extra); renderPhone(slot); }
const backBar = (slot, to, label, title = "") => `<div class="back-bar"><button class="btn ghost sm" onclick="go('${slot}','${to}')"><span class="back-chev" aria-hidden="true"></span>${label}</button>${title ? `<span class="heading-s grow">${title}</span>` : ""}</div>`;

const SCREENS = {
  verify(slot, p, L) {
    const sc = SCENARIOS[scenario]?.[slot] || {};
    if (!L.signin) {

// ---------------------------------------------------------------------------------
// Listings: every listing, each with its matches in a collapsible section
// ---------------------------------------------------------------------------------
function listingCard(slot, p, l) {
  const c = local[slot].ls[l.id] ||= { draft: null, draftFrom: null, chatText: "", editing: false, chatMin: false, seenChat: 0, sending: null };
  const waiting = needsAnswer(l), total = l.intros.length + l.followups.length;
  if (c.open === undefined) c.open = waiting > 0;
  const paused = l.listed && l.active === false;
  const status = l.unsaved ? badge("warning", "Unsaved changes") : paused ? badge("", "Paused") : l.listed ? badge("accent", "Matching") : badge("", "Draft");
  const summary = !l.listed ? "Not matching yet" : total ? `${total} match${total === 1 ? "" : "es"}${waiting ? `, ${waiting} waiting on you` : ""}` : "No matches yet";
  const body = !l.listed
    ? ""
    : total
      ? `<details class="matches" ${c.open ? "open" : ""} ontoggle="local['${slot}'].ls['${l.id}'].open=this.open">
          <summary>${waiting ? "Matches and questions" : "Matches"} (${total})</summary>
          <div class="stack" style="margin-top: var(--space-3)">${l.followups.map(q => followupCard(slot, l, q)).join("")}${l.intros.map(i => introCard(slot, l, i)).join("")}</div></details>`
      : "";
  const pr = l.prefs || {}, open = local[slot].gear === l.id;
  const sw = (label, on, change, disabled) => `<label class="setting-row toggle-row${disabled ? " disabled" : ""}"><div class="grow">
      <div class="body-s">${label}</div></div>
      <input type="checkbox" class="switch" ${on ? "checked" : ""} ${disabled ? "disabled" : ""} onchange="${change}"></label>`;
  const pop = open ? `<div class="gear-pop" role="dialog" aria-label="Settings for ${esc(l.title)}">
      ${sw("Active", l.listed && l.active !== false, `setActive('${slot}','${l.id}',this.checked)`, !l.listed)}
      ${sw("Close matches", pr.notify_close, `setPref('${slot}','${l.id}','notify_close',this.checked)`)}
      ${sw("Follow-up questions", pr.notify_questions, `setPref('${slot}','${l.id}','notify_questions',this.checked)`)}
    </div>` : "";
  return `<div class="card md listing-card${paused ? " paused" : ""}">
    <button class="gear" onclick="toggleGear('${slot}','${l.id}')" aria-expanded="${open}" aria-label="Settings for ${esc(l.title)}" title="Settings">${GEAR}</button>${pop}
    <button class="listing-open" onclick="openListing('${slot}','${l.id}')" aria-label="Open ${esc(l.title)}">
      <span class="row"><span class="heading-m grow">${esc(cap(l.title))}</span>${status}</span>
      <span class="row" style="margin-top: var(--space-1)"><span class="caption secondary grow">${esc(summary)}</span><span class="caption text-accent">Edit</span></span></button>${body}</div>`;
}

// ---------------------------------------------------------------------------------
// Profile: the listing shown as a work-in-progress profile, filled in with the agent
// ---------------------------------------------------------------------------------
function draftValues(c) {
  const shown = {}, hidden = [];
  for (const f of (c.draft ? c.draft.fields : [])) {
    if (!f.enabled || !hasValue(f.value)) continue;
    if (f.visibility === "hidden") hidden.push(f); else shown[f.key] = f.value;
  }
  return { shown, hidden };
}

// The profile adapts to the request: a job-style post for paid help, a personal profile
// for dating, and an activity profile for everything else. Each has its own checklist.
function layoutFor(c) {
  const d = c.draft, { shown } = draftValues(c);
  if (d && d.kind === "dating") return "dating";
  if ((d && ["tutoring", "cofounder"].includes(d.kind)) || shown.pay) return "offer";
  return "activity";
}

// "Looking for" and "you are" are both needed for matching, but for a one-way request one is
// just the mirror of the other (a technician / a customer). Show the side that says something:
// what you need, or what you offer. Show both only when each adds something (a band / a guitarist).
const CLIENT_WORDS = new Set(["customer", "customers", "client", "clients", "student", "students", "learner", "learners",
  "beginner", "beginners", "pupil", "pupils", "patient", "patients", "buyer", "buyers", "tenant", "tenants", "renter",
  "apprentice", "mentee", "mentees", "novice", "homeowner", "homeowners", "household", "households", "people", "anyone"]);
const FILLER = new Set(["a", "an", "the", "or", "and", "of", "for", "to", "in", "on", "who", "with", "need", "needs", "needing",
  "looking", "someone", "person", "this"]);
const words = t => String(t || "").toLowerCase().split(/[^\p{L}\p{N}]+/u).filter(Boolean);
function sides(shown) {
  const seek = words(shown.seeking), off = words(shown.offering);
  const clientIn = ws => ws.some(w => CLIENT_WORDS.has(w) || ["need", "needs", "needing", "wants"].includes(w));
  const core = ws => ws.filter(w => !FILLER.has(w) && !CLIENT_WORDS.has(w));
  const a = new Set(core(seek)), b = new Set(core(off));
  const same = shown.seeking && shown.seeking === shown.offering;
  if (!shown.offering || same) return { side: "needs", main: shown.seeking, other: null };
  if (clientIn(off) && !clientIn(seek)) return { side: "needs", main: shown.seeking, other: null };
  if (clientIn(seek) && !clientIn(off)) return { side: "offers", main: shown.offering, other: null };
  // Mirror: one phrase's activity words are all inside the other's.
  const within = (x, y) => [...x].every(w => y.has(w));
  if (a.size && b.size && (within(a, b) || within(b, a)) && seek.at(-1) === off.at(-1))
    return { side: "needs", main: shown.seeking, other: null };
  return { side: "both", main: shown.seeking, other: shown.offering };
}

function checklist(c) {
  const d = c.draft, { shown, hidden } = draftValues(c);
  const missing = (d && d.missing) || [];
  const where = { done: !!(shown.city || shown.country), label: "Where", ask: "I'm based in " };
  const looking = { done: !!shown.seeking, label: "Who you're looking for", ask: "I'm looking for " };
  const hiddenItem = { done: hidden.length > 0, label: "A hidden detail", optional: true, ask: "Something private that could improve my matches: " };
  // What to add next is the agent's call, by common sense for this request (the problem for a
  // repair, interests for dating). Only who and where are always needed, for matching.
  const essentials = d && d.kind === "dating"
    ? [{ done: !!(d && d.intent_text), label: "Who you're looking for", ask: "I'm looking for " }, where]
    : [shown.offering && !shown.seeking ? { ...looking, done: true } : looking, where];
  if (d && Array.isArray(d.suggestions)) return [...essentials, ...d.suggestions.map(x => ({ done: false, label: x.label, ask: x.ask }))];
  if (d && d.by === "quick") return essentials;  // the agent's suggestions arrive with its reply
  switch (layoutFor(c)) {
    case "offer": {
      const offering = shown.role === "tutor" || sides(shown).side === "offers";
      return [looking, where,
        { done: !!shown.pay, label: offering ? "Your rate" : "What you'll pay", ask: offering ? "I charge " : "I can pay " },
        { done: !!shown.schedule, label: "When", ask: "I'm usually available " },
        { done: !!shown.format, label: "In person or online", ask: "I'd prefer to meet " },
        { done: !!(shown.subject || shown.offering), label: offering ? "What you teach" : "Your level or needs", ask: offering ? "I teach " : "My level: " }];
    }
    case "dating":
      return [{ done: !!(d && d.intent_text), label: "Who you're looking for", ask: "I'm looking for " }, where,
        { done: !!shown.gender, label: "Your gender", ask: "I'm a " },
        { done: !missing.some(m => m.includes("age range")), label: "An age range", ask: "Ideally aged " },
        { done: !!(shown.interests && shown.interests.length), label: "Your interests", ask: "I'm into " }, hiddenItem];
    default:
      return [looking, where,
        { done: !!shown.schedule, label: "When you're free", ask: "I'm usually free " },
        { done: !!(shown.interests && shown.interests.length), label: "Your interests", ask: "I'm into " }, hiddenItem];
  }
}

function profileCard(slot, p, l, c) {
  const d = c.draft, { shown, hidden } = draftValues(c);
  const layout = layoutFor(c), items = checklist(c);
  // With the agent's suggestions, progress counts details filled in against what's still suggested.
  const filled = d ? d.fields.filter(f => f.enabled && hasValue(f.value) && !["first_name", "age_band"].includes(f.key)).length : 0;
  const required = items.filter(i => !i.optional);
  let done = required.filter(i => i.done).length, total = required.length;
  if (d && Array.isArray(d.suggestions)) { total = filled + required.filter(i => !i.done).length; done = filled; }
  const ready = d && items[0].done && items[1].done;  // essentials: who and where
  const place = [shown.city, shown.country].filter(Boolean).join(", ");
  const missing = items.map((it, n) => ({ ...it, n })).filter(i => !i.done).slice(0, 4);
  const entry = l.entry;
  const fact = (label, value, empty) => `<div class="profile-line"><span class="label tertiary">${label}</span>${value
    ? `<span class="body-s">${esc(value)}</span>` : `<span class="body-s tertiary">${empty || "Not added yet"}</span>`}</div>`;
  const used = new Set(["first_name", "age_band", "city", "country", "seeking", "offering", "headline", "gender", "pay", "format", "schedule", "role", "subject"]);
  const extra = Object.entries(shown).filter(([k]) => !used.has(k)).map(([, v]) => val(v));
  const who = `<div class="row"><span class="monogram" aria-hidden="true">${esc((p.name || "?").slice(0, 1).toUpperCase())}</span>
      <div class="grow"><div class="heading-m">${esc(p.name || "")}</div>
        <div class="caption secondary">${esc([p.age_band, place].filter(Boolean).join(" · ") || "Add where you are")}</div></div>
      ${l.listed ? "" : badge("", "Draft")}</div>`;

  // Before anything is known, the profile is just who you are: name and age.
  const something = d && (d.intent_text || Object.keys(shown).some(k => !["first_name", "age_band"].includes(k)));
  if (!something) {
    return `<div class="profile-card minimal"><div class="row"><span class="monogram" aria-hidden="true">${esc((p.name || "?").slice(0, 1).toUpperCase())}</span>
      <div class="grow"><div class="heading-m">${esc(p.name || "")}</div><div class="caption secondary">${esc(p.age_band || "")}</div></div></div></div>`;
  }
  let body;
  if (layout === "offer") {
    const sd = sides(shown), offering = shown.role === "tutor" || sd.side === "offers";
    const headline = shown.headline || (offering ? shown.offering : shown.seeking) || (d && d.intent_text);
    body = `<p class="eyebrow">${offering ? "Offering" : "Wanted"}</p>
      ${headline
        ? `<h3 class="heading-l" style="margin: var(--space-1) 0 var(--space-3)">${esc(cap(headline))}</h3>`
        : `<p class="body-s tertiary" style="margin: var(--space-1) 0 var(--space-3)">Your agent will fill this in as you chat</p>`}
      ${fact(offering ? "Rate" : "Pay", shown.pay)}
      ${fact("Where", place)}
      ${fact("When", shown.schedule)}
      ${fact("Format", shown.format)}
      ${shown.subject ? fact("Subject", shown.subject) : ""}
      ${sd.other ? fact(offering ? "For" : "You are", offering ? shown.seeking : sd.other) : ""}
      <div class="posted">${who}</div>`;
  } else if (layout === "dating") {
    body = `${who}
      ${fact("Looking for", d && d.intent_text, "Your agent will fill this in as you chat")}
      ${shown.gender ? fact("Gender", shown.gender) : ""}`;
  } else {
    const sd = sides(shown);
    body = `${who}
      ${shown.headline ? `<h3 class="heading-l" style="margin: var(--space-4) 0 var(--space-1)">${esc(cap(shown.headline))}</h3>`
        : sd.side === "offers" ? fact("Offering", sd.main) : fact("Looking for", shown.seeking, "Your agent will fill this in as you chat")}
      ${sd.other && !shown.headline ? fact("You are", sd.other) : ""}
      ${shown.schedule ? fact("When", shown.schedule) : ""}
      ${shown.pay ? fact("Pay", shown.pay) : ""}${shown.format ? fact("Format", shown.format) : ""}`;
  }
  return `
    ${entry && !entry.accepted ? `<div class="notice error"><b>Listing refused by the Warden agent.</b><br>${entry.problems.map(esc).join("<br>")}</div>` : ""}
    <div class="profile-card ${layout}">
      ${body}
      ${extra.length ? `<div style="margin-top: var(--space-3)">${tags(extra)}</div>` : ""}
      ${hidden.length ? `<div class="hidden-well" style="margin-top: var(--space-4)"><div class="row"><span class="label grow">Only you can see this</span>${badge("ai", "Hidden")}</div>
        ${hidden.map(f => `<div class="body-s" style="margin-top: var(--space-1)">${esc(f.label)}: ${esc(val(f.value))}</div>`).join("")}
        <div class="hidden-note" style="margin-top: var(--space-2)">Used for matching, never shown</div></div>` : ""}
      <div class="progress-row"><span class="caption secondary">${done} of ${total} complete</span>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><span style="width:${total ? Math.round(100 * done / total) : 0}%"></span></div></div>
      ${missing.length ? `<div class="suggest">${missing.map(i => `<button class="tag" onclick="suggest('${slot}', ${i.n})">Add ${esc(i.label.toLowerCase())}</button>`).join("")}</div>` : ""}
      <div class="row" style="margin-top: var(--space-4)">
        ${d ? `<button class="btn secondary sm" onclick="toggleEdit('${slot}')">${c.editing ? "Done editing" : "Edit details"}</button>` : ""}
        <span class="grow"></span>
        ${d ? `<button class="btn sm" ${ready ? "" : "disabled"} onclick="submit('${slot}')">${l.listed ? "Save changes" : "Start matching"}</button>` : ""}</div>
      ${d && !ready ? `<p class="caption tertiary" style="margin: var(--space-2) 0 0; text-align: right">Add who you're looking for and where first</p>` : ""}
    </div>`;
}

function editorHtml(slot, c) {
  const d = c.draft;
  const normal = d.fields.filter(f => !f.sensitive), sensitive = d.fields.filter(f => f.sensitive);
  return `<div class="editor">
      <div class="row"><p class="eyebrow grow">What you're looking for</p>${d.by === "claude" ? badge("ai", "Agent draft") : ""}</div>
      <textarea class="textarea" style="margin-top: var(--space-2)" aria-label="What you're looking for" oninput="cur('${slot}').draft.intent_text=this.value">${esc(d.intent_text)}</textarea>
      <p class="caption text-ai" style="margin: var(--space-2) 0 0">Used for matching, never shown to anyone.</p>
      <div class="exactness">Wide net <input type="range" min="0" max="1" step="0.1" value="${d.exactness}" aria-label="How exact" oninput="cur('${slot}').draft.exactness=+this.value"> Exact</div>
      <p class="eyebrow group-title">Your details</p>
      <div class="card md">${normal.map(f => fieldRow(slot, f)).join("")}</div>
      <p class="eyebrow group-title">Sensitive details</p>

      <div class="card md">${sensitive.map(f => fieldRow(slot, f)).join("")}</div>
    </div>`;
}

function chatHtml(slot, l, c) {
  const sc = SCENARIOS[scenario]?.[slot];
  // The scenario's opening line pre-fills the first listing's box, only before its first message.
  const text = c.chatText || (l.n === 1 && !l.chat.some(m => m.from === "me") && sc && sc.message ? sc.message : "");
  const lastMine = [...l.chat].reverse().find(m => m.from === "me");
  const pending = c.sending && !(l.agent_busy && lastMine && lastMine.text === c.sending) ? `<div class="bubble me">${esc(c.sending)}</div>` : "";
  const busy = c.sending || l.agent_busy;
  const unread = c.chatMin && l.chat.length && l.chat[l.chat.length - 1].from === "agent" && l.chat.length !== c.seenChat;
  // "Save changes" only applies to updates made after the listing last went live.
  const liveAt = l.chat.map(m => !!m.live).lastIndexOf(true);
  const lastUpdate = l.chat.map(m => !!m.draft_updated).lastIndexOf(true);
  return `<div class="chat-sheet${c.chatMin ? " min" : ""}">
    <button class="sheet-head" aria-expanded="${!c.chatMin}" onclick="toggleChat('${slot}')"><span class="handle" aria-hidden="true"></span>
      <span class="eyebrow">Your agent</span>${unread ? '<span class="unread" aria-label="New message"></span>' : ""}
      <span class="caption tertiary">${c.chatMin ? "Open" : "Minimize"}</span><span class="chevron" aria-hidden="true"></span></button>
    <div class="chat-pane">
      ${l.chat.map((m, n) => `<div class="bubble ${m.from}">${esc(m.text)}</div>` +
        (m.draft_updated && l.unsaved && n === lastUpdate ? `<div class="bubble-note">${badge("ai", "Profile updated")} <button class="btn sm" onclick="submit('${slot}')">Save changes</button></div>` :
         m.draft_updated ? `<div class="bubble-note">${badge("ai", "Profile updated")}${l.listed && n > liveAt ? ` <span class="caption secondary">Save changes to make it live</span>` : ""}</div>` : "")).join("")}${pending}
      ${busy ? `<div class="bubble agent typing" aria-label="Your agent is replying"><span></span><span></span><span></span></div>` : ""}</div>
    <div class="composer-bar"><textarea class="textarea" id="chat-${slot}" aria-label="Message to your agent" placeholder="${l.chat.length > 1 ? "Reply to your agent" : "What are you looking for?"}" oninput="cur('${slot}').chatText=this.value"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send('${slot}')}">${esc(text)}</textarea>
      <button class="btn" ${busy ? "disabled" : ""} onclick="send('${slot}')">Send</button></div>
  </div>`;
}

function toggleChat(slot) {
  const c = cur(slot); c.chatMin = !c.chatMin;
  if (!c.chatMin) c.seenChat = curListing(slot).chat.length;
  renderPhone(slot);
}
function toggleEdit(slot) {
  const c = cur(slot); c.editing = !c.editing;
  if (c.editing) c.chatMin = true;  // editing needs the whole screen
  renderPhone(slot);
}
function suggest(slot, n) {
  const c = cur(slot), ask = checklist(c)[n].ask;
  c.chatText = ask; c.chatMin = false; c.seenChat = curListing(slot).chat.length; renderPhone(slot);
  const box = $("chat-" + slot); box.focus(); box.setSelectionRange(ask.length, ask.length);
}

function fieldRow(slot, f) {
  const i = cur(slot).draft.fields.indexOf(f);
  const at = `'${slot}',${i}`;
  const label = esc(f.label.replace(" (from ID check)", ""));
  if (f.sensitive && !f.enabled) {
    return `<div class="field"><div class="head"><span class="label">${label}</span><span class="caption tertiary push">Off</span>
      <button class="btn secondary sm" onclick="enable(${at},true)">Turn on</button></div></div>`;
  }
  let control;
  if (f.locked) control = `<span class="body-s">${esc(f.value)}</span> <span class="caption tertiary">from your ID check</span>`;
  else if (f.multi && f.options && f.options.length) control = `<div>${f.options.map(o => `<button class="tag${(f.value || []).includes(o) ? " on" : ""}" onclick="toggleChip(${at},'${esc(o)}')">${esc(o)}</button>`).join("")}</div>`;
  else if (f.multi) control = `<input class="input" value="${esc(val(f.value) ?? "")}" placeholder="Separate with commas" oninput="cur('${slot}').draft.fields[${i}].value=this.value.split(',').map(s=>s.trim()).filter(Boolean)">`;
  else if (f.options && f.options.length) control = `<select class="select" onchange="setVal(${at},this.value)"><option value="">Choose…</option>${f.options.map(o => `<option ${o === f.value ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  else control = `<input class="input" value="${esc(f.value ?? "")}" oninput="cur('${slot}').draft.fields[${i}].value=this.value">`;
  const always = ["seeking", "offering"].includes(f.key);
  const choice = f.locked ? "" : always ? `<span class="caption tertiary push">Always shown, so the right person can find you</span>` :
    `<span class="segmented push" role="group" aria-label="${label}: shown or hidden">
      <button class="${f.visibility === "shown" ? "on" : ""}" onclick="setVis(${at},'shown')">Shown</button>
      <button class="hidden-choice ${f.visibility === "hidden" ? "on" : ""}" onclick="setVis(${at},'hidden')">Hidden</button></span>`;
  const off = f.sensitive ? `<button class="btn ghost sm" onclick="enable(${at},false)">Turn off</button>` : "";
  // The fixed hidden look (sunken well, periwinkle hairline, "Hidden" badge) once the field holds a value.
  const hidden = f.visibility === "hidden" && !f.locked && hasValue(f.value);
  return `<div class="field${hidden ? " hidden-field" : ""}"><div class="head"><span class="label">${label}</span>${hidden ? badge("ai", "Hidden") : ""}${choice}${off}</div>${control}
    ${hidden ? `<div class="hidden-note">Used for matching, never shown</div>` : ""}</div>`;
}
function setVal(slot, i, v) {
  const f = cur(slot).draft.fields[i]; f.value = v;
  if (f.key === "city") refreshOptions(slot, v); else renderPhone(slot);
}
function toggleChip(slot, i, o) {
  const f = cur(slot).draft.fields[i]; const s = new Set(f.value || []);
  s.has(o) ? s.delete(o) : s.add(o); f.value = [...s]; renderPhone(slot);
}
function setVis(slot, i, v) {
  const f = cur(slot).draft.fields[i];
  if (f.sensitive && v === "shown") {
    if (!confirm(`Show your ${f.label.toLowerCase()} to matches? Sensitive details are safest hidden: hidden, they can still improve a match.`)) return;
    f.confirmed = true;
  }
  f.visibility = v; renderPhone(slot);
}
function enable(slot, i, on) { const f = cur(slot).draft.fields[i]; f.enabled = on; if (on) f.visibility = "hidden"; renderPhone(slot); }
async function refreshOptions(slot, city) {
  const d = cur(slot).draft;
  const opts = await (await fetch(`/api/options?kind=${encodeURIComponent(d.kind || "")}&city=${encodeURIComponent(city)}`)).json();
  for (const f of d.fields) if (opts[f.key] && opts[f.key].length) { f.options = opts[f.key]; if (!f.multi && f.value && !opts[f.key].includes(f.value)) f.value = null; }
  renderPhone(slot);
}

function followupCard(slot, l, q) {
  const k = `${slot}-${l.id}`;
  let controls = "";
  if (q.question_id === "age_range") controls = `<div class="row"><input class="input" id="fu-min-${k}" type="number" value="25" min="18" aria-label="From age"><span class="body-s secondary">to</span><input class="input" id="fu-max-${k}" type="number" value="40" min="18" aria-label="To age"></div>
    <button class="btn" style="margin-top: var(--space-3)" onclick="answer('${slot}','${l.id}','age_range',{min:+$('fu-min-${k}').value,max:+$('fu-max-${k}').value})">Answer</button>`;
  else if (q.question_id === "schedule") controls = `<select class="select" id="fu-s-${k}">${["weekends","weekday evenings","weekday mornings","flexible"].map(o => `<option>${o}</option>`).join("")}</select>
    <button class="btn" style="margin-top: var(--space-3)" onclick="answer('${slot}','${l.id}','schedule',{schedule:$('fu-s-${k}').value})">Answer</button>`;
  else if (q.question_id === "also_offer") controls = `<div class="row"><button class="btn" onclick="answer('${slot}','${l.id}','also_offer',{yes:true})">Yes, I can</button><button class="btn secondary" onclick="answer('${slot}','${l.id}','also_offer',{yes:false})">No</button></div>
    <p class="caption tertiary" style="margin: var(--space-2) 0 0">If you say yes, it's added to what you offer. Nobody is told you were asked.</p>`;
  else controls = `<div class="row"><button class="btn" onclick="answer('${slot}','${l.id}','wider_net',{yes:true})">Widen the net</button><button class="btn secondary" onclick="answer('${slot}','${l.id}','wider_net',{yes:false})">Keep it as is</button></div>`;
  return `<div class="card sm intro question">${badge("accent", "Question from Belong.")}<h3 class="heading-m" style="margin: var(--space-3) 0">${esc(q.question_text)}</h3>${controls}</div>`;
}

function introCard(slot, l, i) {
  const f = i.view.fields;
  const facts = Object.entries(f).filter(([k]) => !["first_name", "seeking", "offering", "headline"].includes(k)).map(([, v]) => val(v));
  let action = "", status = "";
  if (i.status === "pending") action = `<div class="row" style="margin-top: var(--space-5)"><button class="btn grow" onclick="decide('${slot}','${i.intro_id}',true)">Say yes</button><button class="btn secondary" onclick="decide('${slot}','${i.intro_id}',false)">Not now</button></div>
    <p class="caption tertiary" style="margin: var(--space-2) 0 0">${i.close ? "They haven't been told about you. If you say yes, they're asked too." : "You're only introduced if you both say yes."}</p>`;
  else if (i.status === "waiting") status = badge("", "Waiting on the other person");
  else if (i.status === "closed") action = `<p class="body-s secondary" style="margin: var(--space-4) 0 0">Not this time.</p>`;
  else { status = badge("success", "Introduced"); action = `<button class="btn secondary sm" style="margin-top: var(--space-4)" onclick="openView('${slot}','thread',{thread:'${i.intro_id}'})">Open chat in Found.</button>`; }
  return `<div class="card sm intro">${i.close ? `<p class="caption text-ai" style="margin:0 0 var(--space-2)">Close match: not exactly what you asked for</p>` : ""}
    <div class="row"><h3 class="heading-l grow">${esc(f.first_name || "Someone")}</h3>${status}</div>
    <div style="margin-top: var(--space-3)">${tags(facts)}</div>
    <p class="reason">${esc(i.view.reason)}</p>${action}</div>`;

function connectedBlock(slot, l, i) {
  const name = esc(i.view.fields.first_name || "them");
  if (i.reveal_result) {
    return i.reveal_result.length
      ? `<div class="in-common hidden-well"><p class="label" style="margin:0 0 var(--space-2)">You also have in common</p>${i.reveal_result.map(r => `<div class="body-s">${esc(LABEL[r.key] || r.key)}: ${esc(r.values.join(", "))}</div>`).join("")}</div>`
      : `<p class="body-s secondary" style="margin: var(--space-4) 0 0">No other shared details to show.</p>`;
  }
  if (i.reveal_chosen) return `<p class="body-s secondary" style="margin: var(--space-4) 0 0">We'll let you know if you have anything else in common.</p>`;
  if (!l.hidden_keys.length) return "";
  return `<details class="compare"><summary>See what else you have in common</summary>
    <p class="caption secondary" style="margin: var(--space-2) 0">Choose any hidden details you'd be happy to compare with ${name}. Nothing is shown unless you both choose it and both have it.</p>
    ${l.hidden_keys.map(h => `<label class="check-row"><input type="checkbox" value="${h.key}" class="rv-${slot}-${i.intro_id}"> ${esc(h.label)}</label>`).join("")}
    <button class="btn sm" style="margin-top: var(--space-2)" onclick="reveal('${slot}','${i.intro_id}')">Compare</button></details>`;
}
const LABEL = { income_band: "Income", religion: "Religion", politics: "Politics", health: "Health", kinks: "Intimacy preferences",
  children: "Children", neighborhood: "Neighborhood", employer: "Employer", diet: "Diet", smoking: "Smoking" };

// actions
async function verify(slot) {
  local[slot].form = { name: $("name-" + slot).value, age: $("age-" + slot).value };
  if (await api("verify", { slot, name: local[slot].form.name, age: local[slot].form.age })) go(slot, "belong");
}
async function send(slot) {
  const c = cur(slot), listing_id = curId(slot), text = $("chat-" + slot).value.trim();
  if (!text || c.sending) return;
  c.applyScenario = SCENARIOS[scenario]?.[slot]?.message === text;
  Object.assign(c, { sending: text, chatText: "" });
  renderPhone(slot);
  await api("prefill", { slot, listing_id, text });  // instant: facts we're sure of go on the profile now
  await api("agent", { slot, listing_id, text });    // the agent fills in the rest and asks what's missing
  c.sending = null;
  render([slot]);
}
async function submit(slot) {
  const c = cur(slot), listing_id = curId(slot), d = c.draft;
  const listing = { intent_text: d.intent_text, exactness: d.exactness,
    fields: d.fields.filter(f => f.enabled && hasValue(f.value)).map(f => ({ key: f.key, value: f.value, visibility: f.visibility, confirmed: !!f.confirmed })) };
  // Start matching and Save changes both save, go live and take you back to your listings.
  if (await api("submit", { slot, listing_id, listing }) && curListing(slot).listed) {
    Object.assign(c, { editing: false, open: true, chatMin: false });
    go(slot, "belong");
    toast("Your listing is live.");
  }
}
// A new listing starts with the privacy questions; the listing is made when they're answered.
async function toggleGear(slot, id) { local[slot].gear = local[slot].gear === id ? null : id; renderPhone(slot); }
async function setActive(slot, listing_id, active) { await api("set_active", { slot, listing_id, active }); renderPhone(slot); }
async function setPref(slot, listing_id, key, value) {
  const pr = S.phones[slot].listings.find(l => l.id === listing_id).prefs || {};
  await api("set_prefs", { slot, listing_id, prefs: { ...pr, [key]: value } }); renderPhone(slot);
}
async function newListing(slot) {
  const d = { ask_each_time: true, ...(S.phones[slot].defaults || {}) };
  if (!d.ask_each_time && d.acknowledged) {  // not asked: the defaults from Settings apply
    if (await api("new_listing", { slot })) { local[slot].current = S.phones[slot].current; openView(slot, "profile"); }
    return;
  }
  local[slot].q = { step: 0, ack: !!d.acknowledged, close: !!d.notify_close, questions: !!d.notify_questions, editing: null };
  openView(slot, "privacy");
}
const setDefault = (slot, key, value) => api("set_defaults", { slot, defaults: { [key]: value } });
function editPrivacy(slot, listing_id) {
  const pr = S.phones[slot].listings.find(l => l.id === listing_id).prefs || {};
  local[slot].q = { step: 1, ack: true, close: !!pr.notify_close, questions: !!pr.notify_questions, editing: listing_id };
  openView(slot, "privacy");
}
function closePrivacy(slot) { local[slot].view = local[slot].q && local[slot].q.editing ? "profile" : null; renderPhone(slot); }
async function finishPrivacy(slot) {
  const q = local[slot].q, prefs = { acknowledged: true, notify_close: q.close, notify_questions: q.questions };
  if (q.editing) {
    if (await api("set_prefs", { slot, listing_id: q.editing, prefs })) openView(slot, "profile");
  } else if (await api("new_listing", { slot, prefs })) {
    local[slot].current = S.phones[slot].current;
    openView(slot, "profile");
  }
}
async function openListing(slot, listing_id) {
  local[slot].current = listing_id;
  openView(slot, "profile");
  api("open_listing", { slot, listing_id });
}
async function sendMessage(slot, intro_id) {
  const box = $("msg-" + slot), text = box.value.trim();
  if (!text) return;
  local[slot].msg[intro_id] = "";
  if (!await api("message", { slot, intro_id, text })) local[slot].msg[intro_id] = text;
  renderPhone(slot);
  $("msg-" + slot)?.focus();
}
const answer = (slot, listing_id, question_id, ans) => api("answer", { slot, listing_id, question_id, answer: ans });
const decide = (slot, intro_id, yes) => api("decide", { slot, intro_id, yes });
function reveal(slot, intro_id) {
  const keys = [...document.querySelectorAll(`.rv-${slot}-${intro_id}`)].filter(c => c.checked).map(c => c.value);
  api("reveal", { slot, intro_id, keys });
}

const KIND = { in: ["", "Received"], out: ["olive", "Sent"], blocked: ["error", "Blocked"], inside: ["ai", "Private"] };

  const r = S.room, lr = r.leak_report;

      What private matching reads and what Belong. sends out. The goal for production is that no one can see this, not even the people who run Belong. It's shown here only because the data is synthetic.</p>

      <button class="btn sm" onclick="api('match')">Run Matchmaker</button>

      <button class="btn ghost sm" onclick="reset()">Reset</button>
    </div>
    <div class="audit">${lr.ok ? badge("success", "Passing") : badge("error", "Failed")}<div>
      <p class="heading-s">${lr.ok ? "Leak audit: no hidden detail has been shown" : `Leak audit failed: ${lr.findings.length} finding${lr.findings.length > 1 ? "s" : ""}`}</p>
      <p class="caption secondary" style="margin:0">${r.listings} listings on the Marketboard. Audited ${lr.checked.views} introduction views, ${lr.checked.followups} questions, ${lr.checked.reveals} compared details and ${lr.checked.receipts} receipts. ${blocked} attempt${blocked === 1 ? "" : "s"} blocked. k = ${r.k}.</p></div></div>
    ${r.inside.length ? `<div class="inside-grid">${r.inside.map(insideCard).join("")}</div>` : ""}
    <p class="eyebrow">Data log</p>
    <div class="legend">${badge("", "Received")} by us ${badge("olive", "Sent")} to a person, after the Warden agent's checks ${badge("error", "Blocked")} by the Warden agent ${badge("ai", "Private")} never sent</div>
    <div class="log">${r.events.slice().reverse().map(eventCard).join("")}</div>`;
}
function insideCard(l) {
  return `<div class="inside"><p class="label" style="margin:0">What the Matchmaker agent reads about ${esc(l.name)} (${l.slot}): ${esc(l.title)}</p>
    <p class="intent">${esc(l.intent_text)}</p>
    ${l.fields.map(f => `<div class="frow"><span class="k">${esc(f.label.replace(" (from ID check)", ""))}</span>
      <span>${f.visibility === "hidden" ? `<span class="hidden-well">${esc(f.value)}</span> ${badge("ai", "Hidden")}
        <span class="crowd ${f.usable ? "usable" : "rare"}">${f.crowd} share it: ${f.usable ? "can raise a score" : `too rare, ignored (k = ${S.room.k})`}</span>` : esc(f.value)}</span></div>`).join("")}</div>`;
}
function eventCard(e) {
  const [tone, label] = KIND[e.kind];
  return `<div class="ev ${e.kind}"><div>${badge(tone, label)}<span class="t">${esc(e.title)}</span></div>
    ${e.text ? `<div class="x">${esc(e.text)}</div>` : ""}${payloadHtml(e)}
    ${e.receipts.length ? `<details><summary>${e.receipts.length} receipt${e.receipts.length > 1 ? "s" : ""}: ${e.receipts.filter(r => r.result === "fail").length ? "includes failures" : "all passed"}</summary>
      <div class="rc">${e.receipts.map(r => `<div><span class="${r.result}">${r.result}</span> ${esc(r.check)} · ${r.hash.slice(0, 16)}…</div>`).join("")}</div></details>` : ""}</div>`;
}
function payloadHtml(e) {
  const p = e.payload;
  if (!p) return "";
  if (Array.isArray(p) && p.length && p[0].view) return `<div class="payload">${p.map(v => `<div class="pv"><div class="to">To ${esc(v.to)}</div>
      ${Object.entries(v.view.fields).map(([k, x]) => `<span class="tag">${esc(k)}: ${esc(val(x))}</span>`).join("")}<p class="reason" style="margin-top: var(--space-2)">${esc(v.view.reason)}</p></div>`).join("")}</div>`;
  if (Array.isArray(p) && p.length && p[0].pair) return `<details><summary>${p.length} proposal${p.length > 1 ? "s" : ""}, internal: these are never sent</summary><table class="mini"><tr><th>Pair</th><th>Shown score and threshold</th><th>Reasons</th><th>Hidden boost</th></tr>
      ${p.map(x => `<tr><td>${esc(x.pair)}</td><td>${x.shown_score} of ${x.threshold} needed</td><td>${x.reason_fields.map(esc).join(", ")}</td><td>${x.hidden_fields_that_raised_it.length ? x.hidden_fields_that_raised_it.map(k => badge("ai", k)).join(" ") : "None"}</td></tr>`).join("")}</table></details>`;
  if (Array.isArray(p)) return `<div class="payload"><div class="pv">${p.map(x => Object.entries(x).map(([k, v]) => `<span class="tag">${esc(k)}: ${esc(v)}</span>`).join("")).join("<br>")}</div></div>`;
  return `<div class="payload"><div class="pv">${Object.entries(p).map(([k, v]) => `<span class="tag">${esc(k)}: ${esc(v)}</span>`).join("")}</div></div>`;
}

function resetLocal(clearForms = true) {
  for (const s of ["A", "B"]) {
    if (clearForms) local[s] = fresh();
    else { Object.assign(local[s], { tab: null, view: null, form: {} }); for (const c of Object.values(local[s].ls)) c.chatText = ""; }
  }
}
async function reset() { resetLocal(); await api("reset"); }
// Fast-forward: each phone gets the scenario's listing, written with its agent and made live,
// then the Matchmaker runs. Phones that are already set up keep everything and gain a listing.
let ffBusy = false;
async function fastForward() {
  if (ffBusy) return;
  if (scenario === "blank") { toast("Pick a scenario first, or type on each phone."); return; }
  ffBusy = true; renderRoom();
  try {
    for (const slot of ["A", "B"]) {
      const sc = SCENARIOS[scenario][slot];
      toast(`Setting up phone ${slot}…`);
      if (!S.phones[slot].verified && !await api("verify", { slot, name: sc.name, age: sc.age })) return;
      let l = S.phones[slot].listings.find(x => x.chat.some(m => m.from === "me" && m.text === sc.message));
      if (!l) {
        if (!await api("new_listing", { slot, prefs: { acknowledged: true, notify_close: true, notify_questions: true } })) return;
        l = S.phones[slot].listings.find(x => x.id === S.phones[slot].current);
      }
      local[slot].current = l.id;
      const listing_id = l.id, c = cur(slot);
      if (!curListing(slot).draft) { c.applyScenario = true; if (!await api("agent", { slot, listing_id, text: sc.message })) return; }
      for (let i = 0; i < 2 && !curListing(slot).draft; i++) {  // a real agent may ask a question first
        c.applyScenario = true;
        if (!await api("agent", { slot, listing_id, text: "That's everything for now. Please draft my listing." })) return;
      }
      syncDraft(slot);
      if (!curListing(slot).listed) { openView(slot, "profile"); await submit(slot); }
      go(slot, "belong");
    }
    if (await api("match")) toast("Both phones are set up, and the Matchmaker ran.");
  } finally {
    ffBusy = false; renderRoom();
  }
}

// Redraw only what changed, so acting on one phone never disturbs the other
// (half-typed text, open sections, scroll position).
const last = { A: null, B: null, room: null };
function render(force = []) {
  for (const slot of ["A", "B"]) {
    const snap = JSON.stringify(S.phones[slot]);
    if (force.includes(slot) || snap !== last[slot]) { last[slot] = snap; renderPhone(slot); }
  }
  const roomSnap = JSON.stringify(S.room) + scenario + ffBusy;
  if (roomSnap !== last.room) { last.room = roomSnap; renderRoom(); }
}
const ONLY = new URLSearchParams(location.search).get("phone");
if (ONLY === "A" || ONLY === "B") document.body.classList.add("only-" + ONLY);
fetch("/api/state").then(r => r.json()).then(d => { S = d; render(["A", "B"]); });
// Keep in sync with actions from other windows or devices (e.g. each person on their own phone).
setInterval(async () => {
  if (inflight || !S) return;
  try { const d = await (await fetch("/api/state")).json(); if (!inflight) { S = d; render(); } } catch (_) {}
}, 2500);
</script>
</body>
