<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belong. inspector</title>
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/belong.css">
<style>
  /* Internal tool: the page's own names, mapped onto the Belong. design tokens. */
  :root {
    --bg: var(--surface-app); --surface: var(--surface-card); --text: var(--text-primary); --muted: var(--text-secondary);
    --line: var(--border-subtle); --accent: var(--accent-default); --ok: var(--text-success); --ok-bg: var(--accent-success-muted);
    --bad: var(--text-error); --bad-bg: var(--accent-error-muted); --hidden-bg: var(--accent-ai-muted); --hidden: var(--text-ai);
    --mono: var(--font-mono);
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); font: var(--text-body-s); }
  header { padding: 20px 16px 0; max-width: 1200px; margin: 0 auto; }
  h1 { font: var(--text-display-s); margin: 0 0 2px; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  nav button { background: none; border: 0; padding: 8px 12px; font: inherit; color: var(--muted);
               cursor: pointer; border-bottom: 2px solid transparent; }
  nav button.on { color: var(--text); border-bottom-color: var(--accent); }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  section { display: none; } section.on { display: block; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px; margin-bottom: 14px; }
  .banner { border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 14px; font-weight: 600; }
  .banner.ok { background: var(--ok-bg); color: var(--ok); } .banner.bad { background: var(--bad-bg); color: var(--bad); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .stat .n { font-size: 24px; font-weight: 650; } .stat .l { color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  .scroll { overflow-x: auto; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; margin: 1px 2px 1px 0;
          border: 1px solid var(--line); }
  .pill.hidden { background: var(--hidden-bg); color: var(--hidden); border-color: transparent; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
  .pill.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
  .muted { color: var(--muted); } .mono { font-family: var(--mono); font-size: 12px; }
  input[type=search] { width: 100%; max-width: 360px; padding: 8px 10px; border: 1px solid var(--line);
                       border-radius: 8px; background: var(--surface); color: var(--text); font: inherit; margin-bottom: 10px; }
  .views { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 700px) { .views { grid-template-columns: 1fr; } }
  .view { border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .view h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .note { font-size: 13px; color: var(--muted); }
  h2 { font-size: 16px; margin: 0 0 10px; }
  /* "Take over": a small link-style button under each admitted person's name. */
  button.take { all: unset; cursor: pointer; font-size: 13px; color: var(--text-accent); text-decoration: underline;
                text-underline-offset: 2px; margin-top: 2px; }
  button.take:hover { color: var(--accent-hover); }
  button.take:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; border-radius: 2px; }
</style>
</head>
<body>
<script src="/nav.js"></script>
<header>
  <h1>Belong. prototype inspector</h1>
  <p class="sub" id="meta">Loading run…</p>
  <nav id="tabs"></nav>
</header>
<main>
  <section id="overview"></section>
  <section id="people"></section>
  <section id="intros"></section>
  <section id="room"></section>
  <section id="followups"></section>
  <section id="receipts"></section>
</main>
<script>
const TABS = [
  ["overview", "Trust report"], ["people", "People"], ["intros", "Introductions (what left)"],
  ["room", "Internal proposals"], ["followups", "Follow-ups & reveals"], ["receipts", "Receipts"],
];
const AUDITS = {
  A1: "Introductions show only fields their owner marked shown",
  A2: "No hidden value appears in any introduction",
  A3: "Follow-up questions are fixed-menu only",
  A4: "Reveals only between connected people who both opted in",
  A5: "Receipts carry no content",
  R1: "Every match is justified by shown fields alone",
  R2: "Hidden values count only when at least k people share them",
  R3: "Nobody exceeds the weekly approach limit",
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const val = v => Array.isArray(v) ? v.join(", ") : v;
const $ = id => document.getElementById(id);

function tabs() {
  $("tabs").innerHTML = TABS.map(([id, label]) => `<button data-t="${id}">${label}</button>`).join("");
  $("tabs").onclick = e => { if (e.target.dataset.t) show(e.target.dataset.t); };
  let start = "overview";
  try { start = localStorage.getItem("belong-tab") || start; } catch (_) {}
  show(start);
}
function show(id) {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === id));
  document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === id));
  try { localStorage.setItem("belong-tab", id); } catch (_) {}
}
// A listing's details: built-in ones by key, open ones (about:name) with how they compare in the title.
function fieldPills(fields) {
  const how = f => f.about ? `, ${f.compare}${f.steps && f.steps.length ? ` on ${f.steps.join(" / ")}` : ""}${f.required === false ? ", ideally" : ""}` : "";
  return fields.map(f => `<span class="pill ${f.visibility === "hidden" ? "hidden" : ""}" title="${esc(f.visibility + (f.sensitive ? ", sensitive" : "") + how(f))}">${f.visibility === "hidden" ? "Hidden · " : ""}${esc(f.key)}: ${esc(val(f.value))}</span>`).join("");
}
// A value in an introduction's view: an open detail comes as { values, compare, steps, required }.
const viewValue = x => x && typeof x === "object" && !Array.isArray(x) ? (x.values || []).join(", ") : val(x);
// A description as it went live (as in the live demo), with anything this run's follow-up answers added marked.
function intentCell(p) {
  const entered = p.intent_as_entered ?? p.intent_text, answered = p.answered_in_run || "";
  if (answered) return `${esc(entered)} <span class="pill" title="Added in this batch run, after a follow-up question">Batch-run answer</span> ${esc(answered)}`;
  if (entered !== p.intent_text) return `${esc(p.intent_text)}<div class="note">Changed in this run. In the live demo: ${esc(entered)}</div>`;
  return esc(entered);
}
function filterable(sectionId, rowsHtml, headHtml, placeholder) {
  const s = $(sectionId);
  s.insertAdjacentHTML("beforeend", `<input type="search" placeholder="${placeholder}"><div class="card scroll"><table><thead>${headHtml}</thead><tbody>${rowsHtml}</tbody></table></div>`);
  const input = s.querySelector("input[type=search]");
  input.oninput = () => {
    const q = input.value.toLowerCase();
    s.querySelectorAll("tbody tr").forEach(tr => tr.style.display = tr.textContent.toLowerCase().includes(q) ? "" : "none");
  };
}
// The shared list of details in use, as the Warden built it for the run: entries only, no counts.
function listHtml(v) {
  if (!v) return "";
  const named = e => `${e.about}:${e.name}`;
  const rows = [["Details", (v.details || []).map(e => `${named(e)} (${e.compare})`)], ["Scales", (v.scales || []).map(e => `${named(e)}: ${e.steps.join(" / ")}`)],
                ["Values", (v.values || []).map(e => `${named(e)} = ${e.value}`)], ["Phrases", (v.phrases || []).map(e => `${e.key}: ${e.value}`)],
                ["Places", (v.places || []).map(e => `${e.city}, ${e.country}`)]];
  return `<div class="card"><h2>Details in use (the shared list)</h2>
    <p class="note">Built by the Warden from shown details on listings unchanged for a week, each used by at least ${RUN.meta.k_crowd} different people. Every agent gets it as data, so the same thing is written the same way. Nothing hidden is ever on it.</p>
    <table><tbody>${rows.map(([k, x]) => `<tr><td>${k}</td><td>${x.length ? x.map(e => `<span class="pill">${esc(e)}</span>`).join(" ") : '<span class="muted">none yet</span>'}</td></tr>`).join("")}</tbody></table></div>`;
}

let RUN = null;
function render(d) {
  RUN = d;
  const m = d.metrics, lr = d.leak_report, canTake = sameAsDemo(d);
  $("meta").textContent = `${d.meta.n} synthetic people · seed ${d.meta.seed} · ${d.meta.matcher} · k = ${d.meta.k_crowd} · approach limit ${d.meta.approach_limit}/day`;
  const people = Object.fromEntries(d.people.map(p => [p.id, p]));
  const name = id => { const f = (people[id]?.fields || []).find(f => f.key === "first_name"); return `${f ? esc(f.value) + " " : ""}<span class="muted mono">${id}</span>`; };

  // Trust report
  const byAudit = {};
  lr.findings.forEach(f => (byAudit[f.audit] = byAudit[f.audit] || []).push(f.detail));
  $("overview").innerHTML = `
    <div class="banner ${lr.ok ? "ok" : "bad"}">${lr.ok ? "Leak report passed: no hidden detail was shown." : `Leak report failed: ${lr.findings.length} finding(s).`}</div>
    <div class="card"><h2>What was checked</h2>
      <p class="note">An independent audit (belong/leaks.py) re-reads every output that was sent out. It does not reuse the Warden's code.</p>
      <table><thead><tr><th>Audit</th><th>Promise</th><th>Result</th></tr></thead><tbody>
      ${Object.entries(AUDITS).map(([k, t]) => `<tr><td class="mono">${k}</td><td>${t}</td><td>${byAudit[k] ? `<span class="pill bad">${byAudit[k].length} finding(s)</span><div class="note">${byAudit[k].slice(0,5).map(esc).join("<br>")}</div>` : `<span class="pill ok">pass</span>`}</td></tr>`).join("")}
      </tbody></table>
      <p class="note">Scanned ${lr.checked.views} introduction views, ${lr.checked.followups} follow-ups, ${lr.checked.reveals} reveals, ${lr.checked.receipts} receipts, and ${lr.checked.proposals} internal proposals, watching ${lr.checked.hidden_values_watched} distinct hidden values.</p>
    </div>
    <div class="card"><h2>Match quality (graded against ground truth the Matchmaker never sees)</h2>
      <div class="grid">
        ${[["Admitted", m.admitted], ["Proposals", m.proposals], ["Precision", m.precision], ["Coverage", m.coverage],
           ["Introductions", m.introductions], ["Connections", m.connections], ["Mutual reveals", m.reveals],
           ["Used a hidden field", m.proposals_using_hidden_fields]].map(([l, n]) => `<div class="stat"><div class="n">${n ?? "–"}</div><div class="l">${l}</div></div>`).join("")}
      </div>
      <p class="note">Precision: share of proposals where both people's real intents are met. Coverage: share of people who had at least one truly compatible partner and got a proposal. Rejected at entry: ${esc(JSON.stringify(m.entry_rejections))}.</p>
      <p class="note">By ground-truth story: what each synthetic person really wants. Listings themselves are only dating or something else, written in phrases and the details each person's agent chose.</p>
      <div class="scroll"><table><thead><tr><th>Ground-truth story</th><th>People</th><th>Matchable</th><th>Proposals</th><th>Precision</th><th>Coverage</th></tr></thead><tbody>
      ${Object.entries(m.by_kind).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v.people}</td><td>${v.matchable}</td><td>${v.proposals}</td><td>${v.precision ?? "–"}</td><td>${v.coverage ?? "–"}</td></tr>`).join("")}
      </tbody></table></div>
      ${Object.keys(m.by_dialect || {}).length ? `<p class="note">By agent dialect: people whose agent named, scaled or left out a detail differently.</p>
      <div class="scroll"><table><thead><tr><th>Dialect</th><th>People</th><th>Matchable</th><th>Proposals</th><th>Precision</th><th>Coverage</th></tr></thead><tbody>
      ${Object.entries(m.by_dialect).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v.people}</td><td>${v.matchable}</td><td>${v.proposals}</td><td>${v.precision ?? "–"}</td><td>${v.coverage ?? "–"}</td></tr>`).join("")}
      </tbody></table></div>` : ""}
    </div>
    ${listHtml(d.details_in_use)}`;

  // People
  $("people").innerHTML = `<p class="note">Everything each person put in their listing. Details marked Hidden are used for matching, never shown.</p>
    <p class="note">Descriptions are as they went live, as in the live demo. A part marked Batch-run answer was added in this run, when the person answered a follow-up question; the live demo's listing doesn't have it.</p>
    <p class="note">${canTake ? "These are synthetic people. Take over opens a person's phone in the live demo, so you can answer as them."
      : DEMO ? `Take over is off: this run (seed ${d.meta.seed}, ${d.meta.n} people) doesn't show the live demo's people (seed ${DEMO.seed}, ${DEMO.people}).` : "These are synthetic people."}</p>
    <p class="note" id="take-msg" role="status"></p>`;
  filterable("people", d.people.map(p => `<tr>
      <td>${name(p.id)}${p.admitted && canTake ? `<div><button class="take" data-take="${esc(p.id)}" aria-label="Take over ${esc((p.fields.find(f => f.key === "first_name") || {}).value || p.id)} in the live demo">Take over</button></div>` : ""}</td><td>${esc(p.kind || "")}${p.story ? `<div class="note">story: ${esc(p.story)}</div>` : ""}${p.dialect ? `<div class="note">dialect: ${esc(p.dialect)}</div>` : ""}</td>
      <td>${p.admitted ? '<span class="pill ok">admitted</span>' : `<span class="pill bad">rejected</span><div class="note">${p.entry_problems.map(esc).join("<br>")}</div>`}</td>
      <td>${intentCell(p)}<div class="note">exactness ${p.exactness}</div></td>
      <td>${fieldPills(p.fields)}</td></tr>`).join(""),
    "<tr><th>Person</th><th>Kind</th><th>Entry</th><th>Intent</th><th>Listing</th></tr>", "Filter people…");

  // Introductions
  const yn = v => v === true ? '<span class="pill ok">yes</span>' : v === false ? '<span class="pill">no</span>' : "–";
  const viewHtml = (v, who) => `<div class="view"><h4>What ${who} sees</h4>${Object.entries(v.fields).map(([k, x]) => `<span class="pill">${esc(k)}: ${esc(viewValue(x))}</span>`).join("")}${v.reason ? `<p>${esc(v.reason)}</p>` : ""}</div>`;
  $("intros").innerHTML = `<p class="note">These are the only match outputs that were sent out. Each view shows the other person's shown fields and a reason built only from fields both of them show.</p>
    ${d.introductions.map(i => `<div class="card"><div><b>${i.intro_id}</b> · ${name(i.person_a)} ↔ ${name(i.person_b)} · A said ${yn(i.a_said_yes)} B said ${yn(i.b_said_yes)}</div>
      <div class="views">${viewHtml(i.a_view, "A")}${viewHtml(i.b_view, "B")}</div></div>`).join("")}`;

  // Internal proposals
  $("room").innerHTML = `<p class="note">Internal proposals: in production these are never sent to anyone. Shown here only because the data is synthetic.</p>`;
  filterable("room", d.proposals_internal.map(p => `<tr><td>${name(p.person_a)}</td><td>${name(p.person_b)}</td>
      <td>${p.score}</td><td>${p.shown_score} ≥ ${p.shown_threshold}</td>
      <td>${p.reason_fields.map(k => `<span class="pill">${k}</span>`).join("")}</td>
      <td>${p.used_hidden_fields.map(k => `<span class="pill hidden">${k}</span>`).join("") || '<span class="muted">none</span>'}</td>
      <td>${p.truly_compatible ? '<span class="pill ok">yes</span>' : '<span class="pill bad">no</span>'}</td></tr>`).join(""),
    "<tr><th>A</th><th>B</th><th>Score</th><th>Shown-only score ≥ threshold</th><th>Reason fields</th><th>Hidden fields that raised it</th><th>Truly compatible</th></tr>", "Filter proposals…");

  // Follow-ups and reveals
  $("followups").innerHTML = `<div class="card"><h2>Follow-up questions (${d.followups.length})</h2><p class="note">The Matchmaker can only pick from a fixed menu; the Warden attaches the wording.</p>
    <div class="scroll"><table><thead><tr><th>To</th><th>Question</th></tr></thead><tbody>${d.followups.map(f => `<tr><td>${name(f.person_id)}</td><td>${esc(f.question_text)}</td></tr>`).join("")}</tbody></table></div></div>
    <div class="card"><h2>Mutual reveals (${d.reveals.length})</h2><p class="note">A hidden detail two connected people share, revealed only because both opted in.</p>
    <div class="scroll"><table><thead><tr><th>Between</th><th>Detail</th></tr></thead><tbody>${d.reveals.map(r => `<tr><td>${name(r.person_a)} ↔ ${name(r.person_b)}</td><td><span class="pill hidden">${esc(r.key)}: ${esc(r.values.join(", "))}</span></td></tr>`).join("")}</tbody></table></div></div>`;

  // Receipts
  const tally = d.receipt_tally || {};
  if (!d.receipt_tally) d.receipts.forEach(r => { const t = tally[r.check] = tally[r.check] || {pass: 0, fail: 0}; t[r.result]++; });
  $("receipts").innerHTML = `<div class="card"><h2>Warden receipts (${(d.receipts_total || d.receipts.length).toLocaleString()})</h2>
    <p class="note">Every check writes {check, result, timestamp, hash}. The hash is a keyed HMAC of what was checked, so auditors can verify it without the receipt containing any content.</p>
    <table><thead><tr><th>Check</th><th>Pass</th><th>Fail</th></tr></thead><tbody>${Object.entries(tally).map(([k, t]) => `<tr><td class="mono">${k}</td><td>${t.pass}</td><td>${t.fail}</td></tr>`).join("")}</tbody></table></div>
    <div class="card scroll"><h2>Latest 100</h2><table><thead><tr><th>Check</th><th>Result</th><th>Time</th><th>Hash</th></tr></thead><tbody>
    ${d.receipts.slice(-100).reverse().map(r => `<tr><td class="mono">${r.check}</td><td>${r.result}</td><td class="mono">${r.timestamp}</td><td class="mono">${r.hash.slice(0, 24)}…</td></tr>`).join("")}</tbody></table></div>`;
}

// Take over: the batch run's people are the live demo's first synthetic people (same ids), so the
// demo gives that person a phone, which opens in a small window of its own.
// Take over only works when this run shows the live demo's own people (same seed, and within its size).
let DEMO = null;
fetch("/api/demo").then(r => r.json()).then(d => { DEMO = d; if (RUN) render(RUN); }).catch(() => {});
const sameAsDemo = d => DEMO && d.meta.seed === DEMO.seed && d.meta.n <= DEMO.people;
async function takeOver(id) {
  const msg = $("take-msg");
  // Open the window straight away (one opened after waiting for the server can be blocked).
  const w = window.open("", "belong-" + id, "width=420,height=860");
  try {
    const r = await fetch("/api/take_over", { method: "POST", headers: { "Content-Type": "application/json" },
                                               body: JSON.stringify({ persona_id: id }) });
    const d = await r.json();
    if (!r.ok || !d.slot) throw new Error(d.error || "The live demo didn't answer.");
    const url = "/demo?phone=" + encodeURIComponent(d.slot);
    if (!w) location.href = url;  // no new windows allowed: open it here
    else if (!w.location.href.endsWith(url)) w.location.href = url;  // already open: keep what's half typed
    if (w) w.focus();
    msg.textContent = "";
  } catch (e) {
    if (w && w.location.href === "about:blank") w.close();  // only the window just opened for it
    msg.textContent = `Couldn't take over ${id}: ${e.message}`;
  }
}
$("people").addEventListener("click", e => { const b = e.target.closest("[data-take]"); if (b) takeOver(b.dataset.take); });

tabs();
// The server builds this run (the same people as the demo) when it starts; until then, wait and retry.
function load() {
  fetch("run.json").then(r => {
    if (r.status === 503) { $("meta").textContent = "Preparing the batch run with the demo's people. This takes a minute or two after a restart…"; setTimeout(load, 5000); return null; }
    return r.json();
  }).then(d => d && render(d)).catch(e => { $("meta").textContent = "Couldn't load run.json. Run: python3 -m belong run"; });
}
load();
</script>
</body>
</html>
