<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belong connector</title>
<meta name="description" content="Mockup of the Belong connector: Belong inside your AI assistant, following the Apps SDK UI guidelines.">
<link rel="stylesheet" href="/ds/tokens.css">
<style>
  /* A mockup of Belong as an app inside ChatGPT, built to OpenAI's Apps SDK UI guidelines
     (developers.openai.com/apps-sdk/concepts/ui-guidelines):
     - the system font and system colours for text, icons, dividers and backgrounds;
     - our colour only on primary buttons and small badges, never on backgrounds or text;
     - inline cards appear before the model's reply, with at most two actions at the bottom,
       no tabs or drill-ins, no nested scrolling, and no logo inside (ChatGPT adds the app's
       name and icon above the card);
     - the model's follow-up is short and doesn't repeat the card.
     The chat app itself is plain dark greys with no logos: it isn't the real ChatGPT.
     The sign-in popup is our own website, so it uses the Belong design system. */
  :root {
    --sys-bg: #212121; --sys-side: #181818; --sys-raise: #2f2f2f; --sys-card: #272727;
    --sys-line: rgba(255, 255, 255, 0.10); --sys-line-2: rgba(255, 255, 255, 0.16);
    --sys-text: #ececec; --sys-text-2: #b4b4b4; --sys-text-3: #8f8f8f;
    --sys-font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
    --brand: var(--sf-ember-400); --brand-ink: var(--sf-ink-900);
  }
  * { box-sizing: border-box; }
  /* The demo site's menu sits above the mockup (it isn't part of the chat app). */
  .site-nav .wordmark { font-family: var(--font-display); font-weight: 700; letter-spacing: var(--tracking-tight);
                        color: var(--text-primary); text-decoration: none; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--sys-bg); color: var(--sys-text); font: 16px/1.5 var(--sys-font); }
  button { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: 100%; height: calc(100vh - 61px); overflow: hidden; }
  .app.with-phone { grid-template-columns: 260px 1fr 440px; }
  /* Demo control, outside the mocked app: a phone for person B, to match yourself across chat and phone. */
  .phone-toggle { all: unset; cursor: pointer; margin-left: auto; font-size: 13px; color: var(--sys-text-2); padding: 6px 12px;
                  border: 1px solid var(--sys-line-2); border-radius: 999px; }
  .phone-toggle:hover, .phone-toggle[aria-expanded="true"] { color: var(--sys-text); border-color: var(--sys-text-3); }
  /* The test phone stays in place while the chat scrolls. */
  .tester { display: flex; flex-direction: column; background: var(--sf-paper-300); border-left: 1px solid var(--sys-line); min-width: 0;
            position: fixed; top: 61px; right: 0; bottom: 0; width: 440px; z-index: 5; }
  html:has(.app.with-phone), html:has(.app.with-phone) body { overflow: hidden; }
  .tester[hidden] { display: none; }
  .tester-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; font-size: 13px; color: #555;
                 font-family: var(--sys-font); }
  .tester-head button { all: unset; cursor: pointer; color: #333; font-weight: 600; }
  .tester iframe { flex: 1; border: 0; width: 100%; }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; } .side { display: none; } }

  .side { background: var(--sys-side); padding: 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; font-size: 14px; }
  .side .item { all: unset; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--sys-text);
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .side .item:hover { background: var(--sys-raise); }
  .side .item.on { background: var(--sys-raise); }
  .side .muted { color: var(--sys-text-2); }
  .side-label { font-size: 12px; color: var(--sys-text-3); margin: 18px 10px 6px; }
  .side-note { margin-top: auto; padding: 12px 10px 4px; font-size: 12px; color: var(--sys-text-3); line-height: 1.45; }
  .side-note a { color: var(--sys-text-2); }
  .reset { all: unset; cursor: pointer; margin: 8px 10px 4px; padding: 7px 12px; border: 1px solid var(--sys-line-2); border-radius: 999px;
           font-size: 13px; color: var(--sys-text-2); text-align: center; }
  .reset:hover { color: var(--sys-text); border-color: var(--sys-text-3); }

  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; overflow: hidden; }
  .top { display: flex; align-items: center; gap: 8px; padding: 12px 20px; }
  .model { font-size: 18px; font-weight: 600; }
  .pane { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 20px 12px; }  /* the chat scrolls inside the window */
  .col { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .me { align-self: flex-end; max-width: 75%; background: var(--sys-raise); padding: 10px 16px; border-radius: 22px; white-space: pre-wrap; }
  .bot { white-space: pre-wrap; }
  .typing { display: inline-flex; gap: 5px; padding: 6px 0; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--sys-text-3); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* The app's label, drawn by ChatGPT above the app's content: icon and name. */
  .app-label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--sys-text-2); margin-bottom: -4px; }
  .app-icon { width: 20px; height: 20px; border-radius: 6px; background: var(--sys-raise); border: 1px solid var(--sys-line-2);
              display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--sys-text); }

  /* An inline card: system surface and type; headline, supporting text, then up to two actions. */
  .card { border: 1px solid var(--sys-line); border-radius: 16px; padding: 16px; background: var(--sys-card); }
  .card .title { font-weight: 600; margin: 0 0 4px; }
  .card .sub { color: var(--sys-text-2); font-size: 14px; margin: 0; }
  .card .meta { display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; font-size: 14px; margin: 12px 0 0; }
  .card .meta dt { color: var(--sys-text-3); } .card .meta dd { margin: 0; }
  .card .quote { margin: 12px 0 0; padding: 0 0 0 12px; border-left: 2px solid var(--sys-line-2); color: var(--sys-text-2); font-size: 14px; }
  .card .actions { display: flex; gap: 8px; margin-top: 16px; }
  .thread-body { flex: 1; overflow-y: auto; width: min(720px, 100%); margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
  .thread-body .notice { font-size: 12px; color: var(--sys-text-3); text-align: center; margin: 0 0 8px; }
  .msg { align-self: flex-start; max-width: 75%; background: var(--sys-raise); padding: 8px 14px; border-radius: 18px; white-space: pre-wrap; }
  .msg.mine { align-self: flex-end; background: var(--sys-text); color: var(--sys-bg); }
  .thread-compose { padding: 0 20px 16px; }
  .card .for { font-size: 12px; color: var(--sys-text-3); margin: 0 0 6px; }
  .card .status { border-top: 1px solid var(--sys-line); margin-top: 14px; padding-top: 14px; }
  /* Fullscreen display mode, for the listing's settings */
  .app.with-phone ~ #layer .full { right: 440px; }  /* full screen covers the chat app, not the test phone */
  .full { position: fixed; inset: 61px 0 0 0; z-index: 9; background: var(--sys-bg); display: flex; flex-direction: column; }
  .full-head { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--sys-line); }
  .full-body { width: min(560px, 100%); margin: 24px auto; padding: 0 20px; }
  .srow { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--sys-line); cursor: pointer; }
  .sw { appearance: none; width: 42px; height: 24px; border-radius: 999px; background: var(--sys-line-2); position: relative; cursor: pointer; margin: 0;
        transition: background .15s; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--sys-text); transition: transform .15s; }
  .sw:checked { background: var(--sys-text); } .sw:checked::after { transform: translateX(18px); background: var(--sys-bg); }
  .btn.danger { margin-top: 24px; color: #ff8a80; border-color: rgba(255, 138, 128, .4); }
  .card .status .actions { margin-top: 12px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-left: 8px; vertical-align: 2px;
           background: var(--brand); color: var(--brand-ink); }
  .badge.plain { background: var(--sys-raise); color: var(--sys-text-2); }
  .btn { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; text-align: center; }
  .btn.primary { background: var(--brand); color: var(--brand-ink); }   /* brand accent on the primary button only */
  .btn.secondary { border: 1px solid var(--sys-line-2); color: var(--sys-text); }
  .btn.system { background: var(--sys-text); color: var(--sys-bg); }
  .btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--sys-text); outline-offset: 2px; }

  .compose { padding: 0 20px 14px; }
  .box { max-width: 720px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; background: var(--sys-raise); border-radius: 28px; padding: 8px 8px 8px 20px; }
  .box textarea { all: unset; flex: 1; padding: 9px 0; max-height: 160px; overflow-y: auto; white-space: pre-wrap; }
  .box textarea::placeholder { color: var(--sys-text-3); }
  .send { all: unset; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; background: var(--sys-text); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .send span { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 9px solid var(--sys-bg); }
  .send:disabled { opacity: .3; cursor: not-allowed; }
  .foot { text-align: center; font-size: 12px; color: var(--sys-text-3); margin: 8px 0 0; }

  /* ChatGPT's own confirmation, before an app changes anything. */
  .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .sheet { width: min(440px, 92vw); background: var(--sys-raise); border-radius: 18px; padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
  .sheet h2 { font-size: 17px; margin: 0 0 6px; }
  .sheet p { margin: 0 0 12px; color: var(--sys-text-2); font-size: 14px; }
  .sheet pre { background: var(--sys-bg); border-radius: 10px; padding: 10px 12px; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--sys-text-2); white-space: pre-wrap; margin: 0 0 14px; }
  .sheet label { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--sys-text-2); }
  .sheet .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  /* The sign-in popup is our own website (OAuth), so it uses the Belong design system. */
  .popup { width: min(420px, 94vw); background: var(--surface-card); color: var(--text-primary); border-radius: 14px; overflow: hidden;
           box-shadow: 0 12px 40px rgba(0,0,0,.5); font: var(--text-body-s); }
  .popup .chrome { background: #ececec; color: #555; font: 12px var(--sys-font); padding: 8px 12px; display: flex; gap: 8px; align-items: center; }
  .popup .chrome .url { background: #fff; border-radius: 6px; padding: 3px 10px; flex: 1; }
  .popup .body { padding: 24px; background: var(--sf-paper-100); }
  .popup .wordmark { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: var(--tracking-tight); }
  .popup h3 { font: var(--text-heading-m); margin: 16px 0 6px; }
  .popup p { color: var(--text-secondary); margin: 0 0 14px; }
  .popup label.f { display: block; font: var(--text-label); color: var(--text-secondary); margin: 10px 0 4px; }
  .popup input.i { width: 100%; font: var(--text-body-s); padding: 9px 12px; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--surface-card); }
  .popup .facts { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 6px; }
  .popup .facts li { padding: 8px 10px; border-radius: var(--radius-md); background: var(--surface-raised); }
  .popup .go { all: unset; cursor: pointer; display: block; text-align: center; margin-top: 16px; padding: 11px; border-radius: var(--radius-md);
               background: var(--accent-default); color: var(--text-on-accent); font-weight: 600; }
  .popup .fine { font: var(--text-caption); color: var(--text-tertiary); margin: 12px 0 0; }
  #toast { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); display: none; z-index: 20;
           background: var(--sys-text); color: var(--sys-bg); padding: 8px 14px; border-radius: 10px; font-size: 14px; }
</style>
</head>
<body>
<script src="/nav.js"></script>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="top"><span class="model">ChatGPT</span>
      <button class="phone-toggle" id="phone-toggle" onclick="togglePhone()" aria-expanded="false">Test with a phone</button></div>
    <div class="pane" id="pane"><div class="col" id="col"></div></div>
    <div class="compose">
      <div class="box"><textarea id="box" rows="1" placeholder="Ask anything"></textarea>
        <button class="send" id="send" aria-label="Send"><span aria-hidden="true"></span></button></div>
      <p class="foot">Mockup of Belong as a ChatGPT app. Not the real ChatGPT, not affiliated with OpenAI; replies come from the Belong demo agent.</p>
    </div>
  </main>
  <aside class="tester" id="tester" hidden>
    <div class="tester-head"><span>Person B on a phone, in this same demo</span><button onclick="togglePhone()">Close</button></div>
    <iframe id="tester-frame" title="Test phone: person B" src="about:blank"></iframe>
  </aside>
</div>
<div id="layer"></div>
<div id="toast" role="status"></div>
<script>
// The transcript is kept here, turn by turn, the way ChatGPT shows it: your message, the app's
// label, at most one card per app result, then the model's short reply. Cards show live state
// (an introduction you've already answered updates in place). Anything that changes data asks
// for confirmation first; saying yes only ever comes from your own tap on the card.
let ME = null;
const L = { log: [], sending: false, confirm: null, popup: null, form: {}, remember: {}, seen: {}, read: {} };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap = t => t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
const val = v => Array.isArray(v) ? v.join(", ") : v;
// A list of choices in a sentence, as on the phone: "a, b or c".
const orList = v => { const a = [].concat(v).map(String); return a.length > 1 ? `${a.slice(0, -1).join(", ")} or ${a.at(-1)}` : a[0] || ""; };
// An open detail's key is about:name (me: about the person, them: what they'd like the other person's to be,
// both: something both share), as on the phone; null for a built-in detail.
const detailParts = key => { const m = /^(me|them|both):(.+)$/.exec(key || ""); return m ? { about: m[1], name: m[2] } : null; };
const isDetail = v => !!v && typeof v === "object" && !Array.isArray(v);
// An open detail's values, read by whom it is about, as on the phone: the person's own are all theirs ("a, b"),
// a wish or what both share is met by any one of them ("a, b or c").
const detailValues = (about, values) => about === "me" ? [].concat(values).map(String).join(", ") : orList(values);
function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 3000); }

async function api(action, body = {}) {
  const r = await fetch("/api/chat/" + action, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json();
  if (data.error) toast(data.error);
  if (data.me) ME = data.me;
  return !data.error;
}
const listing = () => ME.listings.find(l => l.id === ME.current) || ME.listings[ME.listings.length - 1] || null;
const shownOf = l => Object.fromEntries(((l && l.draft) ? l.draft.fields : []).filter(f => f.enabled && f.visibility !== "hidden" &&
  f.value !== null && f.value !== "" && !(Array.isArray(f.value) && !f.value.length)).map(f => [f.key, f.value]));
const label = () => `<div class="app-label"><span class="app-icon" aria-hidden="true">B.</span>Belong</div>`;

// ---- cards (live: they read the current state) ----
// Questions shown as their own cards: all but "Want to include close matches?", which sits on the
// listing card itself.
const asksOf = l => l.followups.filter(q => q.question_id !== "broaden");
// Introductions and questions you've been shown but haven't answered yet.
function openActions() {
  const out = [];
  for (const l of liveListings()) {
    for (const q of asksOf(l)) if (L.seen[`q:${l.id}:${q.question_id}`]) out.push({ kind: "question", id: q.question_id, lid: l.id });
    for (const i of l.intros) if (i.status === "pending" && L.seen[i.intro_id]) out.push({ kind: "intro", id: i.intro_id });
  }
  return out;
}
// People you're introduced to (you both said yes), across your listings.
function connectedMatches() {
  return liveListings().flatMap(l => l.intros.filter(i => i.status === "connected").map(i => ({ ...i, listing: l })));
}
function matchCard(i) {
  const name = i.view.fields.first_name || "Someone", t = i.thread || [];
  const unread = t.length - (L.read[i.intro_id] || 0), last = t[t.length - 1];
  return `<div class="card"><p class="for">For “${esc(cap(i.listing.title))}”</p>
    <p class="title">${esc(name)}<span class="badge plain">Introduced</span>${unread > 0 && !last.mine ? `<span class="badge">${unread} new</span>` : ""}</p>
    <p class="sub">${last ? `${last.mine ? "You: " : ""}${esc(last.text.slice(0, 90))}` : "You both said yes. Say hello."}</p>
    <div class="actions"><button class="btn primary" onclick="openThread('${i.intro_id}')">Open chat</button></div></div>`;
}
const isOpen = c => openActions().some(o => o.kind === c.kind && o.id === c.id);
const liveListings = () => ME.verified ? ME.listings.filter(l => l.listed) : [];
function listingCard(l = listing()) {
  if (!l || !l.draft || !(l.draft.intent_text || Object.keys(shownOf(l)).some(k => !["first_name", "age_band"].includes(k)))) return "";
  const s = shownOf(l), live = l.listed && !l.unsaved, paused = l.listed && l.active === false;
  // Whether it can go live is the server's (the phone's rule), not a copy kept here.
  const ready = !!l.ready;
  // Every shown detail, with the server's label: where first, then the rest, minus what the title and the
  // matching phrases already say (as on the phone). What you'd like in the other person is a group of its own.
  const skip = ["first_name", "age_band", "city", "country", "seeking", "offering", "headline", "kind", "wants_gender", "wants_age"];
  const wish = f => (detailParts(f.key) || {}).about === "them";
  const shownRows = l.draft.fields.filter(f => !skip.includes(f.key) && f.key in s);
  const shownText = f => { const d = detailParts(f.key); return d ? detailValues(d.about, s[f.key]) : val(s[f.key]); };
  const meta = [["Where", [s.city, s.country].filter(Boolean).join(", ")],
    ...shownRows.filter(f => !wish(f)).map(f => [f.label, shownText(f)])].filter(([, v]) => v);
  const wishes = shownRows.filter(wish).map(f => [f.label, shownText(f) + (f.required === false ? " (ideally)" : "")]);
  const badge = paused ? '<span class="badge plain">Paused</span>' : live ? '<span class="badge">Live</span>' : '<span class="badge plain">Draft</span>';
  return `<div class="card"><p class="title">${esc(cap(s.headline || l.title))}${badge}</p>
    <p class="sub">Shown to people you're introduced to. Hidden details are never shown.</p>
    ${meta.length ? `<dl class="meta">${meta.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(val(v))}</dd>`).join("")}</dl>` : ""}
    ${wishes.length ? `<p class="sub" style="margin-top: 12px">What you'd like</p><dl class="meta">${wishes.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}
    ${live ? matchingStatus(l) : ready ? `<div class="actions"><button class="btn primary" onclick="ask('start_matching','${l.id}')">${l.listed ? "Save changes" : "Start matching"}</button>
        ${l.listed ? `<button class="btn secondary" onclick="openSettings('${l.id}')">Settings</button>` : ""}</div>`
      : `<p class="sub" style="margin-top: 12px">Tell me who you're looking for and where, and you can start matching.</p>`}</div>`;
}
function introCard(id) {
  const owner = ME.listings.find(l => l.intros.some(x => x.intro_id === id));
  const i = owner && owner.intros.find(x => x.intro_id === id);
  if (!i) return "";
  const name = i.view.fields.first_name || "Someone";
  // What their agent understood (the kind of match, who and what ages they'd like to meet) isn't a fact about them.
  // Their open details read with their names; what they'd like in the other person is a group of its own.
  const shown = Object.entries(i.view.fields).filter(([k]) => !["first_name", "seeking", "offering", "headline", "topics",
    "kind", "wants_gender", "wants_age"].includes(k));
  const facts = [], wishes = [];
  for (const [k, v] of shown) {
    const d = detailParts(k);
    if (!d || !isDetail(v)) facts.push(val(v));
    else if (d.about === "them") wishes.push(`${cap(d.name)}: ${detailValues(d.about, v.values || [])}${v.required === false ? " (ideally)" : ""}`);
    else facts.push(`${cap(d.name)}: ${detailValues(d.about, v.values || [])}`);
  }
  const status = { pending: "", waiting: '<span class="badge plain">You said yes</span>', connected: '<span class="badge">Introduced</span>', closed: '<span class="badge plain">Not this time</span>' }[i.status] || "";
  return `<div class="card"><p class="for">For “${esc(cap(owner.title))}”</p><p class="title">${esc(name)}${status}</p><p class="sub">${esc(facts.slice(0, 5).join(" · "))}</p>
    ${wishes.length ? `<p class="sub">What they'd like: ${esc(wishes.join(" · "))}</p>` : ""}
    ${i.view.reason ? `<p class="quote">${esc(i.view.reason)}</p>` : ""}
    ${i.status === "pending" ? `<div class="actions"><button class="btn primary" onclick="ask('say_yes','${id}')">Say yes</button>
      <button class="btn secondary" onclick="ask('not_now','${id}')">Not now</button></div>` : ""}</div>`;
}
function questionCard(qid, lid) {
  const l = ME.listings.find(x => x.id === lid), q = l && l.followups.find(x => x.question_id === qid);
  if (!q) return `<div class="card"><p class="title">Question from Belong<span class="badge plain">Answered</span></p></div>`;
  // Each question takes the answer its type says (from the server): a yes or no never stands in for a value.
  const a = q.answer || { type: "yes_no" }, k = `${lid}-${qid}`, [lo, hi] = (l.wants && l.wants.default) || ["", ""];
  const controls = a.type === "age_range"
    ? `<input class="i" id="qa-min-${k}" type="number" min="18" max="99" value="${lo}" aria-label="From age"> to
       <input class="i" id="qa-max-${k}" type="number" min="18" max="99" value="${hi}" aria-label="To age">
       <button class="btn primary" onclick="answerAges('${lid}','${qid}')">Answer</button>`
    : `<button class="btn primary" onclick="ask('answer_yes','${lid}:${qid}')">Yes</button>
       <button class="btn secondary" onclick="ask('answer_no','${lid}:${qid}')">No</button>`;
  return `<div class="card"><p class="for">For “${esc(cap(l.title))}”</p><p class="title">Question from Belong</p><p class="sub">${esc(q.question_text)}</p>
    <div class="actions">${controls}</div></div>`;
}
function answerAges(lid, qid) {
  const k = `${lid}-${qid}`, min = parseInt($(`qa-min-${k}`).value, 10), max = parseInt($(`qa-max-${k}`).value, 10);
  if (!(min >= 18 && max >= min && max <= 99)) return toast("Pick an age range from 18 up.");
  ask("answer_value", { lid, qid, answer: { min, max }, said: max >= 99 ? `${min} or older` : `${min} to ${max}` });
}
// Once live, the listing card is also the live matching card: while the chat is open it keeps
// checking with Belong (a widget can call the app's tools itself) and offers to show what's new.
function matchingStatus(l) {
  const fresh = l.intros.filter(i => i.status === "pending" && !L.seen[i.intro_id]);
  const exact = fresh.filter(i => !i.close).length, close = fresh.length - exact;
  const questions = asksOf(l).filter(q => !L.seen[`q:${l.id}:${q.question_id}`]).length;
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const parts = [exact && plural(exact, "new introduction", "new introductions"), close && plural(close, "close match", "close matches"),
                 questions && plural(questions, "follow-up question", "follow-up questions")].filter(Boolean);
  const settings = `<button class="btn secondary" onclick="openSettings('${l.id}')">Settings</button>`;
  if (l.active === false) {
    return `<div class="status"><p class="sub" style="margin:0">Paused: not matching until you switch it back on.</p><div class="actions">${settings}</div></div>`;
  }
  if (parts.length) {
    return `<div class="status"><p class="title" style="margin:0">${parts.join(" · ")}<span class="badge">New</span></p>
      <div class="actions"><button class="btn primary" onclick="showNew('${l.id}')">Show them</button>${settings}</div></div>`;
  }
  const broaden = l.followups.find(q => q.question_id === "broaden");
  if (broaden) {
    return `<div class="status"><p class="title" style="margin:0">${esc(broaden.question_text)}</p>
      <p class="sub" style="margin-top: 4px">People who are almost what you asked for. It's one-way: they aren't told about you.</p>
      <div class="actions"><button class="btn primary" onclick="ask('answer_yes','${l.id}:broaden')">Yes, include them</button>
        <button class="btn secondary" onclick="ask('answer_no','${l.id}:broaden')">No thanks</button></div></div>`;
  }
  return `<div class="status"><p class="sub" style="margin:0">Matching: Belong is looking for people who are also looking for you.</p>
    <p class="sub" style="margin-top: 8px; font-size: 12px">Mockup: updates while this chat is open. Real ChatGPT may only allow this while the chat is on screen.</p>
    <div class="actions">${settings}</div></div>`;
}
function emptyCard() { return `<div class="card"><p class="title">No introductions yet</p><p class="sub">This chat never sees other people's listings: only introductions the Warden checked reach you here.</p></div>`; }

// ---- rendering ----
function render() {
  if (!ME) return;
  const out = [], live = liveListings();
  // Live listing cards always sit in the latest reply (one per live listing), above its text.
  let lastReply = -1; L.log.forEach((t, n) => { if (t.bot || t.app) lastReply = n; });
  L.log.forEach((t, n) => {
    if (t.me) out.push(`<div class="me">${esc(t.me)}</div>`);
    const here = n === lastReply && live.length;
    if (t.app || here) {
      out.push(label());
      for (const c of t.cards || []) {
        if (c.kind === "listing" || c.kind === "status") {  // a draft's preview (live ones are shown below)
          const l = listing();
          if (c.latest && l && !l.listed) out.push(listingCard(l));
        } else if (c.kind === "intro") { if (!isOpen(c)) out.push(introCard(c.id)); }       // still open: shown below the live card
        else if (c.kind === "question") { if (!isOpen(c)) out.push(questionCard(c.id, c.lid)); }
        else out.push(emptyCard());
      }
      if (here) {
        for (const l of live) out.push(listingCard(l));
        for (const c of connectedMatches()) out.push(matchCard(c));
        // Anything waiting on you stays here, under the live cards, until you answer it.
        for (const c of openActions()) out.push(c.kind === "intro" ? introCard(c.id) : questionCard(c.id, c.lid));
      }
    }
    if (t.bot) out.push(`<div class="bot">${esc(t.bot)}</div>`);
    if (t.connect && !ME.verified) out.push(`<div><button class="btn system" onclick="openPopup()">Connect Belong</button></div>`);
  });
  if (!L.log.length) out.push(`<div class="bot">What can I help with?</div>`);
  if (L.sending) out.push(`<div class="typing" aria-label="Thinking"><span></span><span></span><span></span></div>`);
  const pane = $("pane"), atEnd = pane.scrollHeight - pane.scrollTop - pane.clientHeight < 120;
  $("col").innerHTML = out.join("");
  if (atEnd || L.jump) { pane.scrollTop = pane.scrollHeight; L.jump = false; }
  $("send").disabled = L.sending;
  const mine = ME.verified ? ME.listings.filter(l => l.listed || l.chat.some(m => m.from === "me")) : [];
  $("side").innerHTML = `<button class="item" onclick="newChat()">New chat</button>
    <p class="side-label">Apps</p><div class="item">${ME.verified ? "Belong · connected" : '<span class="muted">Belong · not connected</span>'}</div>
    <p class="side-label">Chats</p>${mine.map(l => `<div class="item${l.id === (listing() || {}).id ? " on" : ""}">${esc(cap(l.title))}</div>`).join("")}
    <div class="item muted">Weekend trip ideas</div><div class="item muted">Fix my CV</div>
    <p class="side-note">A mockup of Belong as an app in ChatGPT, following OpenAI's Apps SDK UI guidelines. <a href="/demo">Phone demo</a> · <a href="/trust">Trust</a></p>
    <button class="reset" onclick="resetDemo()">Reset this demo</button>`;
  renderLayer();
}

// ---- the conversation ----
const CHECK = /\b(match|matches|matched|anyone|anybody|someone|found|introduc\w*|news|update|who)\b/i;
async function sendMsg() {
  const text = $("box").value.trim();
  if (!text || L.sending) return;
  $("box").value = ""; $("box").style.height = "auto";
  L.log.push({ me: text }); L.sending = true; L.jump = true; render();
  try {
    if (!ME.verified) {
      L.log.push({ bot: "I can do that with the Belong app. Connect it first: you'll sign in on the Belong website, where your ID check and privacy choices live.", connect: true });
      L.pendingText = text;
      return;
    }
    const l = listing();
    if (liveListings().length && (!l || l.listed) && CHECK.test(text)) return await checkMatches();
    await draftWith(text);
  } finally { L.sending = false; L.jump = true; render(); }
}
async function draftWith(text) {
  if (!listing()) await api("new_listing", {});  // uses the choices made when connecting
  const l = listing(), before = l.chat.length;
  // Instant fill only while drafting: once a listing is live, a message may be a new search, and the
  // agent decides whether it updates this listing or starts a separate one.
  if (!l.listed) await api("prefill", { listing_id: l.id, text });
  await api("agent", { listing_id: l.id, text });
  const now = listing();  // a new listing if the agent started one
  const fresh = now.id === l.id ? now.chat.slice(before).filter(m => m.from === "agent") : now.chat.filter(m => m.from === "agent");
  const updated = fresh.some(m => m.draft_updated);
  if (updated) for (const t of L.log) for (const c of t.cards || []) if (c.kind === "listing") c.latest = false;  // only the latest preview stays
  // ChatGPT writes its own short follow-up from what the app returns, and it doesn't repeat the card:
  // with a card shown, keep only the agent's last paragraph (its next question or step).
  const reply = fresh.map(m => m.text).join("\n\n").trim();
  const followUp = updated ? (reply.split(/\n\s*\n/).filter(Boolean).pop() || "") : reply;
  L.log.push({ app: updated, cards: updated ? [{ kind: "listing", latest: true }] : [], bot: followUp || "Done." });
}
async function checkMatches(onlyId) {
  const d = await (await fetch("/api/chat/state")).json(); ME = d.me;  // read what Belong has found
  const ls = liveListings().filter(l => !onlyId || l.id === onlyId);
  const cards = [], pending = [];
  for (const l of ls) {
    cards.push(...asksOf(l).map(q => ({ kind: "question", id: q.question_id, lid: l.id })));
    pending.push(...l.intros.filter(i => i.status === "pending"));
    for (const i of l.intros) L.seen[i.intro_id] = true;
    for (const q of asksOf(l)) L.seen[`q:${l.id}:${q.question_id}`] = true;
  }
  cards.push(...pending.slice(0, 3).map(i => ({ kind: "intro", id: i.intro_id })));
  const n = pending.length;
  L.log.push({ app: true, cards: cards.length ? cards : [{ kind: "empty" }],
    bot: n ? `${n === 1 ? "One person" : `${n} people`} ${n === 1 ? "is" : "are"} also looking for you. Only you can say yes, and you're introduced only if they say yes too.`
           : cards.length ? "Answering could find you more matches." : "Nothing yet. Ask me again later." });
}

// "Show them" on the live card posts a message from the card (sendFollowUpMessage), then the
// introductions appear as a normal turn.
async function showNew(id) {
  if (L.sending) return;
  L.log.push({ me: "Show me what's new from Belong." }); L.sending = true; L.jump = true; render();
  try { await checkMatches(id); } finally { L.sending = false; L.jump = true; render(); }
}
// The Matchmaker runs on its own (every few seconds in the demo); the page's state check
// (every 3 seconds, below) is how the live cards notice something new.

// ---- changing anything goes through ChatGPT's confirmation ----
const ACTIONS = {
  start_matching: { tool: "start_matching", ask: () => `Make your listing live for matching?`, args: id => ({ listing: byId(id).title }) },
  send_message: { tool: "send_message", ask: a => `Send this to ${nameOf(a.id)}?`, args: a => ({ to: nameOf(a.id), message: a.text }) },
  delete_listing: { tool: "delete_listing", ask: id => `Delete “${cap(byId(id).title)}”?`, args: id => ({ listing: byId(id).title }) },
  say_yes: { tool: "say_yes", ask: id => `Say yes to ${nameOf(id)}?`, args: id => ({ introduction: nameOf(id) }) },
  not_now: { tool: "not_now", ask: id => `Pass on ${nameOf(id)} for now?`, args: id => ({ introduction: nameOf(id) }) },
  answer_yes: { tool: "answer_question", ask: a => a.endsWith(":broaden") ? "Include close matches for this listing?" : `Answer “Yes” to this question?`, args: () => ({ answer: "yes" }) },
  answer_no: { tool: "answer_question", ask: a => a.endsWith(":broaden") ? "Keep to exact matches for this listing?" : `Answer “No” to this question?`, args: () => ({ answer: "no" }) },
  answer_value: { tool: "answer_question", ask: a => `Answer “${a.said}” to this question?`, args: a => ({ answer: a.said }) },
};
const byId = id => ME.listings.find(l => l.id === id) || listing();
const nameOf = id => (ME.listings.flatMap(l => l.intros).find(x => x.intro_id === id) || { view: { fields: {} } }).view.fields.first_name || "this person";
function ask(kind, arg) {
  const a = ACTIONS[kind];
  // "Say yes" and deleting are never remembered: they always need this tap and this confirmation.
  if (L.remember[a.tool] && !["say_yes", "delete_listing"].includes(kind)) return run(kind, arg);
  L.confirm = { kind, arg }; renderLayer();
}
async function run(kind, arg) {
  L.confirm = null;
  if (kind === "send_message") {
    if (await api("message", { intro_id: arg.id, text: arg.text })) L.msg = "";
    renderLayer(); render();
    return;
  }
  renderLayer();
  const l = kind === "start_matching" || kind === "delete_listing" ? byId(arg) : listing();
  if (kind === "delete_listing") {
    const title = cap(l.title);
    if (await api("delete_listing", { listing_id: l.id })) {
      L.settings = null;
      L.log.push({ app: true, cards: [], bot: `Deleted “${title}”. It's off Belong and won't be matched again.` });
    }
  } else if (kind === "start_matching") {
    const d = l.draft, body = { intent_text: d.intent_text, exactness: d.exactness,
      fields: d.fields.filter(f => f.enabled && f.value !== null && f.value !== "" && !(Array.isArray(f.value) && !f.value.length))
        .map(f => ({ key: f.key, value: f.value, visibility: f.visibility, confirmed: !!f.confirmed,
                     ...(detailParts(f.key) ? { about: f.about, name: f.name, compare: f.compare, steps: f.steps, required: f.required } : {}) })) };
    if (await api("submit", { listing_id: l.id, listing: body })) {
      for (const t of L.log) for (const c of t.cards || []) if (c.kind === "listing" || c.kind === "status") c.latest = false;
      L.log.push({ app: true, cards: [], bot: "Your listing is live. I'll update its card when Belong finds someone, or ask me any time." });
    }
  } else if (kind === "say_yes" || kind === "not_now") {
    await api("decide", { intro_id: arg, yes: kind === "say_yes" });
    const i = ME.listings.flatMap(x => x.intros).find(x => x.intro_id === arg);
    if (kind === "say_yes") L.log.push({ bot: i && i.status === "connected"
      ? `${nameOf(arg)} said yes too, so you're introduced. Message them in the Belong app.`
      : `Done. I'll let you know if ${nameOf(arg)} says yes too; ask me any time.` });
  } else if (kind === "answer_value") {
    if (await api("answer", { listing_id: arg.lid, question_id: arg.qid, answer: arg.answer }))
      L.log.push({ bot: "Thanks, I've updated your listing. Ask me for matches again in a bit." });
  } else {
    const [lid, qid] = arg.split(":");
    await api("answer", { listing_id: lid, question_id: qid, answer: { yes: kind === "answer_yes" } });
    L.log.push({ bot: qid === "broaden"
      ? (kind === "answer_yes" ? "Done: you'll hear about close matches too. You can turn this off in the listing's settings." : "No problem: exact matches only.")
      : kind === "answer_yes" ? "Thanks, I've updated your listing. Ask me for matches again in a bit." : "No problem." });
  }
  L.jump = true; render();
}

// ---- overlays: the confirmation sheet, and the sign-in popup on our own site ----
function renderLayer() {
  const c = L.confirm, layer = $("layer");
  if (!c && L.thread) {
    const i = connectedMatches().find(x => x.intro_id === L.thread);
    if (!i) { L.thread = null; layer.innerHTML = ""; return; }
    const name = i.view.fields.first_name || "Someone", t = i.thread || [];
    L.read[i.intro_id] = t.length;
    const draft = L.msg || "";
    layer.innerHTML = `<div class="full" role="dialog" aria-modal="true" aria-label="Chat with ${esc(name)}">
      <div class="full-head"><button class="btn secondary" onclick="closeThread()">Close</button>
        <span class="app-label" style="margin:0"><span class="app-icon" aria-hidden="true">B.</span>Belong · ${esc(name)}</span></div>
      <div class="thread-body" id="thread-body">
        <p class="notice">You and ${esc(name)} both said yes. This chat is shown in your AI assistant, so it passes through your assistant's provider; ${esc(name)} has been told.</p>
        ${t.map(m => `<div class="msg ${m.mine ? "mine" : ""}">${esc(m.text)}</div>`).join("") || `<p class="sub" style="text-align:center">Say hello to ${esc(name)}.</p>`}
        ${i.typing ? `<div class="typing" aria-label="${esc(name)} is typing"><span></span><span></span><span></span></div>` : ""}
        ${i.simulated ? `<p class="sub" style="text-align:center">${esc(name)} is a simulated person in this demo: an AI model writes their replies from what they were shown about you, never your hidden details.</p>` : ""}
      </div>
      <div class="thread-compose"><div class="box"><textarea id="msg" rows="1" placeholder="Message ${esc(name)}" oninput="L.msg=this.value"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendToMatch('${i.intro_id}')}">${esc(draft)}</textarea>
        <button class="send" aria-label="Send" onclick="sendToMatch('${i.intro_id}')"><span aria-hidden="true"></span></button></div></div></div>`;
    const body = $("thread-body"); body.scrollTop = body.scrollHeight;
    return;
  }
  if (!c && L.settings) {
    const l = byId(L.settings), pr = (pendingPrefs[l.id] || {}).values || l.prefs || {};
    const row = (label, on, change) => `<label class="srow"><span>${label}</span><input type="checkbox" class="sw" ${on ? "checked" : ""} onchange="${change}"></label>`;
    layer.innerHTML = `<div class="full" role="dialog" aria-modal="true" aria-label="Listing settings">
      <div class="full-head"><button class="btn secondary" onclick="L.settings=null; renderLayer(); render()">Close</button>
        <span class="app-label" style="margin:0"><span class="app-icon" aria-hidden="true">B.</span>Belong</span></div>
      <div class="full-body"><p class="title" style="font-weight:600; margin:0 0 4px">${esc(cap(l.title))}</p><p class="sub" style="margin:0 0 16px">Listing settings</p>
        ${row("Active", l.active !== false, `setActive('${l.id}', this.checked)`)}
        ${row("Close matches", pr.notify_close, `setPref('${l.id}', 'notify_close', this.checked)`)}
        ${row("Questions", pr.notify_questions, `setPref('${l.id}', 'notify_questions', this.checked)`)}
        <button class="btn secondary danger" onclick="ask('delete_listing','${l.id}')">Delete listing</button></div></div>`;
    return;
  }
  if (c) {
    const a = ACTIONS[c.kind];
    layer.innerHTML = `<div class="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cf-t">
      <h2 id="cf-t">${esc(a.ask(c.arg))}</h2><p>Belong wants to use the <b>${a.tool}</b> action.</p>
      <pre>${esc(JSON.stringify(a.args(c.arg), null, 2))}</pre>
      ${["say_yes", "delete_listing"].includes(c.kind) ? "" : `<label><input type="checkbox" id="cf-r"> Remember for this conversation</label>`}
      <div class="actions"><button class="btn secondary" onclick="L.confirm=null; renderLayer()">Cancel</button>
        <button class="btn system" onclick="confirmIt()">Confirm</button></div></div></div>`;
  } else if (L.popup) {
    const step = L.popup.step;
    layer.innerHTML = `<div class="scrim"><div class="popup" role="dialog" aria-modal="true" aria-label="Sign in to Belong">
      <div class="chrome"><span>●●●</span><span class="url">belong.example/connect</span></div>
      <div class="body"><span class="wordmark">Belong.</span>
      ${step === 0 ? `<h3>Connect to ChatGPT</h3><p>Sign in with your verified Belong account. An independent ID provider checks your document; we receive only that you're verified and your age band.</p>
        <label class="f" for="pn">First name</label><input class="i" id="pn" value="${esc(L.form.name || "")}" oninput="L.form.name=this.value">
        <label class="f" for="pa">Age</label><input class="i" id="pa" type="number" value="${esc(L.form.age || "")}" oninput="L.form.age=this.value">
        <button class="go" onclick="popupNext()">Continue</button>`
      : `<h3>What ChatGPT can do</h3>
        <ul class="facts"><li>Draft and update your listings, with you.</li><li>Show you introductions and questions when you ask.</li>
          <li>Ask before it changes anything. Saying yes is always your tap.</li></ul>
        <p>Your hidden details are never shown to matches. What you tell ChatGPT goes to OpenAI under their terms.</p>
        <button class="go" onclick="popupDone()">Allow and connect</button>`}
      <p class="fine">Mockup of the sign-in a real connector would open (OAuth) on our own site.</p></div></div></div>`;
  } else layer.innerHTML = "";
}
function openThread(id) { L.thread = id; L.msg = ""; renderLayer(); setTimeout(() => $("msg") && $("msg").focus(), 0); }
function closeThread() { L.thread = null; renderLayer(); render(); }
function sendToMatch(id) {
  const text = ($("msg").value || "").trim();
  if (!text) return;
  ask("send_message", { id, text });
}
function openSettings(id) { L.settings = id; renderLayer(); }
async function setActive(id, active) { await api("set_active", { listing_id: id, active }); renderLayer(); render(); }
// One switch each: close matches, and questions that could find a match. The other choice stays as the screen shows it:
// until the server has answered every switch tapped since, a tap's choice is kept here, so a second switch tapped
// before the first is answered never sends the first one's older value.
const pendingPrefs = {};
async function setPref(id, key, on) {
  const p = pendingPrefs[id] ||= { values: { ...(byId(id).prefs || {}) }, n: 0 };
  p.values = { ...p.values, [key]: on }; p.n++;
  try { await api("set_prefs", { listing_id: id, prefs: { ...p.values } }); } finally { if (--p.n === 0) delete pendingPrefs[id]; }
  renderLayer(); render();
}
// "New chat" is just a new conversation: your listings and their live cards carry on. To add a listing,
// ask in any chat ("I'm also looking for...") and the agent starts a separate one.
function newChat() {
  if (!ME.verified || L.sending) return;
  L.log = [{ bot: "New chat. Your Belong listings carry on; ask me anything about them, or tell me what else you're looking for." }];
  L.jump = true; render();
}
function confirmIt() {
  const c = L.confirm, r = $("cf-r");
  if (r && r.checked) L.remember[ACTIONS[c.kind].tool] = true;
  run(c.kind, c.arg);
}
function openPopup() { L.popup = { step: 0 }; renderLayer(); }
function popupNext() { if (!L.form.name || !L.form.age) return toast("Enter your first name and age."); L.popup.step = 1; renderLayer(); }
async function popupDone() {
  if (!await api("verify", { name: L.form.name, age: L.form.age })) { L.popup.step = 0; return renderLayer(); }
  await api("new_listing", {});
  L.popup = null;
  L.log.push({ app: true, cards: [], bot: `Belong is connected. ${L.pendingText ? "Let's start on that." : "Tell me who you'd like to meet, or what you need."}` });
  render();
  if (L.pendingText) { const t = L.pendingText; L.pendingText = null; L.sending = true; render(); try { await draftWith(t); } finally { L.sending = false; L.jump = true; render(); } }
}

// Demo control: start the connector demo over (its own session; the phones aren't touched).
async function resetDemo() {
  if (L.sending) return;
  await api("reset");
  Object.assign(L, { log: [], confirm: null, popup: null, form: {}, remember: {}, pendingText: null });
  if (!$("tester").hidden) $("tester-frame").src = "/demo?session=chat&phone=B";  // the test phone starts over too
  render(); toast("The connector demo has been reset.");
}
function togglePhone(force) {
  const open = force ?? $("tester").hidden;
  $("tester").hidden = !open;
  $("phone-toggle").setAttribute("aria-expanded", String(open));
  document.querySelector(".app").classList.toggle("with-phone", open);
  if (open && $("tester-frame").src === "about:blank") $("tester-frame").src = "/demo?session=chat&phone=B";
  try { localStorage.setItem("belong-chat-phone", open ? "1" : ""); } catch (_) {}
}
try { if (localStorage.getItem("belong-chat-phone")) togglePhone(true); } catch (_) {}
$("send").onclick = sendMsg;
$("box").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); } });
$("box").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(160, e.target.scrollHeight) + "px"; });
fetch("/api/chat/state").then(r => r.json()).then(d => {
  ME = d.me;
  // A fresh visit rebuilds the conversation from what Belong holds for this chat.
  const l = ME.verified ? listing() : null;
  if (l) for (const m of l.chat.slice(1)) L.log.push(m.from === "me" ? { me: m.text } : { app: !!m.draft_updated, cards: [], bot: m.text });
  if (l && l.draft) L.log.push({ app: true, cards: [{ kind: "listing", latest: true }] });
  render();
});
// Check in every few seconds (this also lets the Matchmaker run); hold the redraw while something is open.
setInterval(async () => { try { const d = await (await fetch("/api/chat/state")).json(); if (L.sending || L.confirm || L.popup) return; if (JSON.stringify(d.me) !== JSON.stringify(ME)) { ME = d.me; render(); if (L.thread) { const keep = $("msg") ? $("msg").value : ""; renderLayer(); if ($("msg")) $("msg").value = keep; } } } catch (_) {} }, 3000);
</script>
