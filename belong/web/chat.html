<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Belong. in chat</title>
<meta name="description" content="Mockup: Belong. as an app inside a ChatGPT-style chat, following the Apps SDK UI guidelines.">
<link rel="stylesheet" href="/ds/tokens.css">
<style>
  /* A mockup of Belong. as an app inside ChatGPT, built to OpenAI's Apps SDK UI guidelines
     (developers.openai.com/apps-sdk/concepts/ui-guidelines):
     - the system font and system colours for text, icons, dividers and backgrounds;
     - Belong.'s colour only on primary buttons and small badges, never on backgrounds or text;
     - inline cards appear before the model's reply, with at most two actions at the bottom,
       no tabs or drill-ins, no nested scrolling, and no logo inside (ChatGPT adds the app's
       name and icon above the card);
     - the model's follow-up is short and doesn't repeat the card.
     The chat app itself is plain dark greys with no logos: it isn't the real ChatGPT.
     The sign-in popup is Belong.'s own website, so it uses the Belong. design system. */
  :root {
    --sys-bg: #212121; --sys-side: #181818; --sys-raise: #2f2f2f; --sys-card: #272727;
    --sys-line: rgba(255, 255, 255, 0.10); --sys-line-2: rgba(255, 255, 255, 0.16);
    --sys-text: #ececec; --sys-text-2: #b4b4b4; --sys-text-3: #8f8f8f;
    --sys-font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
    --brand: var(--sf-ember-400); --brand-ink: var(--sf-ink-900);
  }
  * { box-sizing: border-box; }
  /* The demo site's menu sits above the mockup (it isn't part of the chat app). */
  .site-nav .wordmark { font-family: var(--font-display); font-weight: 700; letter-spacing: var(--tracking-tight);
                        color: var(--text-primary); text-decoration: none; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--sys-bg); color: var(--sys-text); font: 16px/1.5 var(--sys-font); }
  button { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 260px 1fr; height: calc(100vh - 61px); }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; } .side { display: none; } }

  .side { background: var(--sys-side); padding: 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; font-size: 14px; }
  .side .item { all: unset; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--sys-text);
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .side .item:hover { background: var(--sys-raise); }
  .side .item.on { background: var(--sys-raise); }
  .side .muted { color: var(--sys-text-2); }
  .side-label { font-size: 12px; color: var(--sys-text-3); margin: 18px 10px 6px; }
  .side-note { margin-top: auto; padding: 12px 10px 4px; font-size: 12px; color: var(--sys-text-3); line-height: 1.45; }
  .side-note a { color: var(--sys-text-2); }
  .reset { all: unset; cursor: pointer; margin: 8px 10px 4px; padding: 7px 12px; border: 1px solid var(--sys-line-2); border-radius: 999px;
           font-size: 13px; color: var(--sys-text-2); text-align: center; }
  .reset:hover { color: var(--sys-text); border-color: var(--sys-text-3); }

  .main { display: flex; flex-direction: column; min-width: 0; height: 100%; }
  .top { display: flex; align-items: center; gap: 8px; padding: 12px 20px; }
  .model { font-size: 18px; font-weight: 600; }
  .pane { flex: 1; overflow-y: auto; padding: 24px 20px 12px; }
  .col { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .me { align-self: flex-end; max-width: 75%; background: var(--sys-raise); padding: 10px 16px; border-radius: 22px; white-space: pre-wrap; }
  .bot { white-space: pre-wrap; }
  .typing { display: inline-flex; gap: 5px; padding: 6px 0; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--sys-text-3); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* The app's label, drawn by ChatGPT above the app's content: icon and name. */
  .app-label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--sys-text-2); margin-bottom: -4px; }
  .app-icon { width: 20px; height: 20px; border-radius: 6px; background: var(--sys-raise); border: 1px solid var(--sys-line-2);
              display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--sys-text); }

  /* An inline card: system surface and type; headline, supporting text, then up to two actions. */
  .card { border: 1px solid var(--sys-line); border-radius: 16px; padding: 16px; background: var(--sys-card); }
  .card .title { font-weight: 600; margin: 0 0 4px; }
  .card .sub { color: var(--sys-text-2); font-size: 14px; margin: 0; }
  .card .meta { display: grid; grid-template-columns: 96px 1fr; gap: 4px 12px; font-size: 14px; margin: 12px 0 0; }
  .card .meta dt { color: var(--sys-text-3); } .card .meta dd { margin: 0; }
  .card .quote { margin: 12px 0 0; padding: 0 0 0 12px; border-left: 2px solid var(--sys-line-2); color: var(--sys-text-2); font-size: 14px; }
  .card .actions { display: flex; gap: 8px; margin-top: 16px; }
  .card .status { border-top: 1px solid var(--sys-line); margin-top: 14px; padding-top: 14px; }
  .card .status .actions { margin-top: 12px; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; margin-left: 8px; vertical-align: 2px;
           background: var(--brand); color: var(--brand-ink); }
  .badge.plain { background: var(--sys-raise); color: var(--sys-text-2); }
  .btn { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; text-align: center; }
  .btn.primary { background: var(--brand); color: var(--brand-ink); }   /* brand accent on the primary button only */
  .btn.secondary { border: 1px solid var(--sys-line-2); color: var(--sys-text); }
  .btn.system { background: var(--sys-text); color: var(--sys-bg); }
  .btn:disabled, .btn[aria-disabled="true"] { opacity: .45; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--sys-text); outline-offset: 2px; }

  .compose { padding: 0 20px 14px; }
  .box { max-width: 720px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; background: var(--sys-raise); border-radius: 28px; padding: 8px 8px 8px 20px; }
  .box textarea { all: unset; flex: 1; padding: 9px 0; max-height: 160px; overflow-y: auto; white-space: pre-wrap; }
  .box textarea::placeholder { color: var(--sys-text-3); }
  .send { all: unset; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; background: var(--sys-text); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .send span { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 9px solid var(--sys-bg); }
  .send:disabled { opacity: .3; cursor: not-allowed; }
  .foot { text-align: center; font-size: 12px; color: var(--sys-text-3); margin: 8px 0 0; }

  /* ChatGPT's own confirmation, before an app changes anything. */
  .scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .sheet { width: min(440px, 92vw); background: var(--sys-raise); border-radius: 18px; padding: 20px; box-shadow: 0 12px 40px rgba(0,0,0,.45); }
  .sheet h2 { font-size: 17px; margin: 0 0 6px; }
  .sheet p { margin: 0 0 12px; color: var(--sys-text-2); font-size: 14px; }
  .sheet pre { background: var(--sys-bg); border-radius: 10px; padding: 10px 12px; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--sys-text-2); white-space: pre-wrap; margin: 0 0 14px; }
  .sheet label { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--sys-text-2); }
  .sheet .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  /* The sign-in popup is Belong.'s own website (OAuth), so it uses the Belong. design system. */
  .popup { width: min(420px, 94vw); background: var(--surface-card); color: var(--text-primary); border-radius: 14px; overflow: hidden;
           box-shadow: 0 12px 40px rgba(0,0,0,.5); font: var(--text-body-s); }
  .popup .chrome { background: #ececec; color: #555; font: 12px var(--sys-font); padding: 8px 12px; display: flex; gap: 8px; align-items: center; }
  .popup .chrome .url { background: #fff; border-radius: 6px; padding: 3px 10px; flex: 1; }
  .popup .body { padding: 24px; background: var(--sf-paper-100); }
  .popup .wordmark { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: var(--tracking-tight); }
  .popup h3 { font: var(--text-heading-m); margin: 16px 0 6px; }
  .popup p { color: var(--text-secondary); margin: 0 0 14px; }
  .popup label.f { display: block; font: var(--text-label); color: var(--text-secondary); margin: 10px 0 4px; }
  .popup input.i { width: 100%; font: var(--text-body-s); padding: 9px 12px; border: 1px solid var(--border-default); border-radius: var(--radius-md); background: var(--surface-card); }
  .popup .facts { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 6px; }
  .popup .facts li { padding: 8px 10px; border-radius: var(--radius-md); background: var(--surface-raised); }
  .popup .choice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--border-subtle); }
  .popup .choice input { margin-top: 3px; accent-color: var(--accent-default); }
  .popup .choice small { display: block; color: var(--text-secondary); }
  .popup .go { all: unset; cursor: pointer; display: block; text-align: center; margin-top: 16px; padding: 11px; border-radius: var(--radius-md);
               background: var(--accent-default); color: var(--text-on-accent); font-weight: 600; }
  .popup .fine { font: var(--text-caption); color: var(--text-tertiary); margin: 12px 0 0; }
  #toast { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); display: none; z-index: 20;
           background: var(--sys-text); color: var(--sys-bg); padding: 8px 14px; border-radius: 10px; font-size: 14px; }
</style>
</head>
<body>
<script src="/nav.js"></script>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main">
    <div class="top"><span class="model">ChatGPT</span></div>
    <div class="pane" id="pane"><div class="col" id="col"></div></div>
    <div class="compose">
      <div class="box"><textarea id="box" rows="1" placeholder="Ask anything"></textarea>
        <button class="send" id="send" aria-label="Send"><span aria-hidden="true"></span></button></div>
      <p class="foot">Mockup of Belong. as a ChatGPT app. Not the real ChatGPT, not affiliated with OpenAI; replies come from the Belong. demo agent.</p>
    </div>
  </main>
</div>
<div id="layer"></div>
<div id="toast" role="status"></div>
<script>
// The transcript is kept here, turn by turn, the way ChatGPT shows it: your message, the app's
// label, at most one card per app result, then the model's short reply. Cards show live state
// (an introduction you've already answered updates in place). Anything that changes data asks
// for confirmation first; saying yes only ever comes from your own tap on the card.
let ME = null;
const L = { log: [], sending: false, confirm: null, popup: null, form: {}, remember: {}, seen: {} };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap = t => t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
const val = v => Array.isArray(v) ? v.join(", ") : v;
function toast(msg) { const t = $("toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 3000); }

async function api(action, body = {}) {
  const r = await fetch("/api/chat/" + action, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await r.json();
  if (data.error) toast(data.error);
  if (data.me) ME = data.me;
  return !data.error;
}
const listing = () => ME.listings.find(l => l.id === ME.current) || ME.listings[ME.listings.length - 1] || null;
const shownOf = l => Object.fromEntries(((l && l.draft) ? l.draft.fields : []).filter(f => f.enabled && f.visibility !== "hidden" &&
  f.value !== null && f.value !== "" && !(Array.isArray(f.value) && !f.value.length)).map(f => [f.key, f.value]));
const label = () => `<div class="app-label"><span class="app-icon" aria-hidden="true">B.</span>Belong.</div>`;

// ---- cards (live: they read the current state) ----
function listingCard() {
  const l = listing();
  if (!l || !l.draft || !(l.draft.intent_text || Object.keys(shownOf(l)).some(k => !["first_name", "age_band"].includes(k)))) return "";
  const s = shownOf(l), live = l.listed && !l.unsaved;
  // The same rule as the phone: who you're looking for, and where, before it can go live.
  const ready = !!(s.seeking || (l.draft.kind === "dating" && l.draft.intent_text)) && !!(s.city || s.country);
  const meta = [["Where", [s.city, s.country].filter(Boolean).join(", ")], ["When", s.schedule], ["Pay", s.pay], ["Format", s.format], ["Level", s.level]]
    .filter(([, v]) => v);
  return `<div class="card"><p class="title">${esc(cap(s.headline || l.title))}${live ? '<span class="badge">Live</span>' : '<span class="badge plain">Draft</span>'}</p>
    <p class="sub">Shown to people you're introduced to. Hidden details are never shown.</p>
    ${meta.length ? `<dl class="meta">${meta.map(([k, v]) => `<dt>${k}</dt><dd>${esc(val(v))}</dd>`).join("")}</dl>` : ""}
    ${live ? matchingStatus(l) : ready ? `<div class="actions"><button class="btn primary" onclick="ask('start_matching')">${l.listed ? "Save changes" : "Start matching"}</button></div>`
      : `<p class="sub" style="margin-top: 12px">Tell me who you're looking for and where, and you can start matching.</p>`}</div>`;
}
function introCard(id) {
  const i = ME.listings.flatMap(l => l.intros).find(x => x.intro_id === id);
  if (!i) return "";
  const name = i.view.fields.first_name || "Someone";
  const facts = Object.entries(i.view.fields).filter(([k]) => !["first_name", "seeking", "offering", "headline", "topics"].includes(k)).map(([, v]) => val(v));
  const status = { pending: "", waiting: '<span class="badge plain">You said yes</span>', connected: '<span class="badge">Introduced</span>', closed: '<span class="badge plain">Not this time</span>' }[i.status] || "";
  return `<div class="card"><p class="title">${esc(name)}${status}</p><p class="sub">${esc(facts.slice(0, 5).join(" · "))}</p>
    <p class="quote">${esc(i.view.reason)}</p>
    ${i.status === "pending" ? `<div class="actions"><button class="btn primary" onclick="ask('say_yes','${id}')">Say yes</button>
      <button class="btn secondary" onclick="ask('not_now','${id}')">Not now</button></div>` : ""}</div>`;
}
function questionCard(qid, lid) {
  const l = ME.listings.find(x => x.id === lid), q = l && l.followups.find(x => x.question_id === qid);
  if (!q) return `<div class="card"><p class="title">Question from Belong.<span class="badge plain">Answered</span></p></div>`;
  return `<div class="card"><p class="title">Question from Belong.</p><p class="sub">${esc(q.question_text)}</p>
    <div class="actions"><button class="btn primary" onclick="ask('answer_yes','${lid}:${qid}')">Yes</button>
      <button class="btn secondary" onclick="ask('answer_no','${lid}:${qid}')">No</button></div></div>`;
}
// Once live, the listing card is also the live matching card: while the chat is open it keeps
// checking with Belong. (a widget can call the app's tools itself) and offers to show what's new.
function matchingStatus(l) {
  const fresh = l.intros.filter(i => i.status === "pending" && !L.seen[i.intro_id]);
  const exact = fresh.filter(i => !i.close).length, close = fresh.length - exact;
  const questions = l.followups.filter(q => !L.seen[`q:${l.id}:${q.question_id}`]).length;
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const parts = [exact && plural(exact, "new introduction", "new introductions"), close && plural(close, "close match", "close matches"),
                 questions && plural(questions, "follow-up question", "follow-up questions")].filter(Boolean);
  if (parts.length) {
    return `<div class="status"><p class="title" style="margin:0">${parts.join(" · ")}<span class="badge">New</span></p>
      <div class="actions"><button class="btn primary" onclick="showNew()">Show them</button></div></div>`;
  }
  return `<div class="status"><p class="sub" style="margin:0">Matching: Belong. is looking for people who are also looking for you.</p>
    <p class="sub" style="margin-top: 8px; font-size: 12px">Mockup: updates while this chat is open. Real ChatGPT may only allow this while the chat is on screen.</p></div>`;
}
function emptyCard() { return `<div class="card"><p class="title">No introductions yet</p><p class="sub">Belong. matches in private. Nobody, including ChatGPT, sees the other listings.</p></div>`; }

// ---- rendering ----
function render() {
  if (!ME) return;
  const out = [];
  for (const t of L.log) {
    if (t.me) out.push(`<div class="me">${esc(t.me)}</div>`);
    if (t.app) {
      out.push(label());
      for (const c of t.cards || []) out.push(c.kind === "listing" ? (c.latest ? listingCard() : "") : c.kind === "status" ? (c.latest ? listingCard() : "") :
        c.kind === "intro" ? introCard(c.id) : c.kind === "question" ? questionCard(c.id, c.lid) : emptyCard());
    }
    if (t.bot) out.push(`<div class="bot">${esc(t.bot)}</div>`);
    if (t.connect && !ME.verified) out.push(`<div><button class="btn system" onclick="openPopup()">Connect Belong.</button></div>`);
  }
  if (!L.log.length) out.push(`<div class="bot">What can I help with?</div>`);
  if (L.sending) out.push(`<div class="typing" aria-label="Thinking"><span></span><span></span><span></span></div>`);
  const pane = $("pane"), atEnd = pane.scrollHeight - pane.scrollTop - pane.clientHeight < 120;
  $("col").innerHTML = out.join("");
  if (atEnd || L.jump) { pane.scrollTop = pane.scrollHeight; L.jump = false; }
  $("send").disabled = L.sending;
  $("side").innerHTML = `<button class="item">New chat</button>
    <p class="side-label">Apps</p><div class="item">${ME.verified ? "Belong. · connected" : '<span class="muted">Belong. · not connected</span>'}</div>
    <p class="side-label">Chats</p><div class="item on">Belong. listing</div><div class="item muted">Weekend trip ideas</div><div class="item muted">Fix my CV</div>
    <p class="side-note">A mockup of Belong. as an app in ChatGPT, following OpenAI's Apps SDK UI guidelines. <a href="/demo">Phone demo</a> · <a href="/trust">Trust</a></p>
    <button class="reset" onclick="resetDemo()">Reset this demo</button>`;
  renderLayer();
}

// ---- the conversation ----
const CHECK = /\b(match|matches|matched|anyone|anybody|someone|found|introduc\w*|news|update|who)\b/i;
async function sendMsg() {
  const text = $("box").value.trim();
  if (!text || L.sending) return;
  $("box").value = ""; $("box").style.height = "auto";
  L.log.push({ me: text }); L.sending = true; L.jump = true; render();
  try {
    if (!ME.verified) {
      L.log.push({ bot: "I can do that with the Belong. app. Connect it first: you'll sign in on the Belong. website, where your ID check and privacy choices live.", connect: true });
      L.pendingText = text;
      return;
    }
    const l = listing();
    if (l && l.listed && CHECK.test(text)) return await checkMatches();
    await draftWith(text);
  } finally { L.sending = false; L.jump = true; render(); }
}
async function draftWith(text) {
  if (!listing()) await api("new_listing", {});  // uses the choices made when connecting
  const l = listing(), before = l.chat.length;
  await api("prefill", { listing_id: l.id, text });
  await api("agent", { listing_id: l.id, text });
  const now = listing(), fresh = now.chat.slice(before).filter(m => m.from === "agent");
  const updated = fresh.some(m => m.draft_updated);
  if (updated) for (const t of L.log) for (const c of t.cards || []) if (c.kind === "listing") c.latest = false;  // only the latest preview stays
  // ChatGPT writes its own short follow-up from what the app returns, and it doesn't repeat the card:
  // with a card shown, keep only the agent's last paragraph (its next question or step).
  const reply = fresh.map(m => m.text).join("\n\n").trim();
  const followUp = updated ? (reply.split(/\n\s*\n/).filter(Boolean).pop() || "") : reply;
  L.log.push({ app: updated, cards: updated ? [{ kind: "listing", latest: true }] : [], bot: followUp || "Done." });
}
async function checkMatches() {
  await api("match");
  const l = listing();
  const cards = [...l.followups.map(q => ({ kind: "question", id: q.question_id, lid: l.id })),
                 ...l.intros.filter(i => i.status === "pending").slice(0, 3).map(i => ({ kind: "intro", id: i.intro_id }))];
  const n = l.intros.filter(i => i.status === "pending").length;
  for (const i of l.intros) L.seen[i.intro_id] = true;
  for (const q of l.followups) L.seen[`q:${l.id}:${q.question_id}`] = true;
  L.log.push({ app: true, cards: cards.length ? cards : [{ kind: "empty" }],
    bot: n ? `${n === 1 ? "One person" : `${n} people`} ${n === 1 ? "is" : "are"} also looking for you. Only you can say yes, and you're introduced only if they say yes too.`
           : cards.length ? "Answering could find you more matches." : "Nothing yet. Ask me again later." });
}

// "Show them" on the live card posts a message from the card (sendFollowUpMessage), then the
// introductions appear as a normal turn.
async function showNew() {
  if (L.sending) return;
  L.log.push({ me: "Show me what's new from Belong." }); L.sending = true; L.jump = true; render();
  try { await checkMatches(); } finally { L.sending = false; L.jump = true; render(); }
}
// While the chat is open, the live card checks with Belong. now and then (in the demo, that runs matching).
setInterval(async () => {
  const live = L.log.some(t => (t.cards || []).some(c => c.kind === "listing" && c.latest));
  if (!ME || !live || L.sending || L.confirm || L.popup) return;
  const l = listing(); if (!l || !l.listed) return;
  const sig = x => JSON.stringify([x.intros.map(i => i.intro_id), x.followups.map(q => q.question_id)]);
  const before = sig(l);
  await api("match");
  if (sig(listing()) !== before) render();
}, 6000);

// ---- changing anything goes through ChatGPT's confirmation ----
const ACTIONS = {
  start_matching: { tool: "start_matching", ask: () => `Make your listing live for matching?`, args: () => ({ listing: listing().title }) },
  say_yes: { tool: "say_yes", ask: id => `Say yes to ${nameOf(id)}?`, args: id => ({ introduction: nameOf(id) }) },
  not_now: { tool: "not_now", ask: id => `Pass on ${nameOf(id)} for now?`, args: id => ({ introduction: nameOf(id) }) },
  answer_yes: { tool: "answer_question", ask: () => `Answer “Yes” to the question from Belong.?`, args: () => ({ answer: "yes" }) },
  answer_no: { tool: "answer_question", ask: () => `Answer “No” to the question from Belong.?`, args: () => ({ answer: "no" }) },
};
const nameOf = id => (ME.listings.flatMap(l => l.intros).find(x => x.intro_id === id) || { view: { fields: {} } }).view.fields.first_name || "this person";
function ask(kind, arg) {
  const a = ACTIONS[kind];
  // "Say yes" is never remembered: it always needs this tap and this confirmation.
  if (L.remember[a.tool] && kind !== "say_yes") return run(kind, arg);
  L.confirm = { kind, arg }; renderLayer();
}
async function run(kind, arg) {
  L.confirm = null; renderLayer();
  const l = listing();
  if (kind === "start_matching") {
    const d = l.draft, body = { intent_text: d.intent_text, exactness: d.exactness,
      fields: d.fields.filter(f => f.enabled && f.value !== null && f.value !== "" && !(Array.isArray(f.value) && !f.value.length))
        .map(f => ({ key: f.key, value: f.value, visibility: f.visibility, confirmed: !!f.confirmed })) };
    if (await api("submit", { listing_id: l.id, listing: body })) {
      for (const t of L.log) for (const c of t.cards || []) if (c.kind === "listing" || c.kind === "status") c.latest = false;
      L.log.push({ app: true, cards: [{ kind: "listing", latest: true }], bot: "Your listing is live. I'll update the card above when Belong. finds someone, or ask me any time." });
    }
  } else if (kind === "say_yes" || kind === "not_now") {
    await api("decide", { intro_id: arg, yes: kind === "say_yes" });
    const i = ME.listings.flatMap(x => x.intros).find(x => x.intro_id === arg);
    if (kind === "say_yes") L.log.push({ bot: i && i.status === "connected"
      ? `${nameOf(arg)} said yes too, so you're introduced. Message them in the Belong. app.`
      : `Done. I'll let you know if ${nameOf(arg)} says yes too; ask me any time.` });
  } else {
    const [lid, qid] = arg.split(":");
    await api("answer", { listing_id: lid, question_id: qid, answer: { yes: kind === "answer_yes" } });
    L.log.push({ bot: kind === "answer_yes" ? "Thanks, I've updated your listing. Ask me for matches again in a bit." : "No problem." });
  }
  L.jump = true; render();
}

// ---- overlays: the confirmation sheet, and the sign-in popup on Belong.'s site ----
function renderLayer() {
  const c = L.confirm, layer = $("layer");
  if (c) {
    const a = ACTIONS[c.kind];
    layer.innerHTML = `<div class="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cf-t">
      <h2 id="cf-t">${esc(a.ask(c.arg))}</h2><p>Belong. wants to use the <b>${a.tool}</b> action.</p>
      <pre>${esc(JSON.stringify(a.args(c.arg), null, 2))}</pre>
      ${c.kind === "say_yes" ? "" : `<label><input type="checkbox" id="cf-r"> Remember for this conversation</label>`}
      <div class="actions"><button class="btn secondary" onclick="L.confirm=null; renderLayer()">Cancel</button>
        <button class="btn system" onclick="confirmIt()">Confirm</button></div></div></div>`;
  } else if (L.popup) {
    const step = L.popup.step;
    layer.innerHTML = `<div class="scrim"><div class="popup" role="dialog" aria-modal="true" aria-label="Sign in to Belong.">
      <div class="chrome"><span>●●●</span><span class="url">belong.example/connect</span></div>
      <div class="body"><span class="wordmark">Belong.</span>
      ${step === 0 ? `<h3>Connect to ChatGPT</h3><p>Sign in with your verified Belong. account. An independent ID provider checks your document; we receive only that you're verified and your age band.</p>
        <label class="f" for="pn">First name</label><input class="i" id="pn" value="${esc(L.form.name || "")}" oninput="L.form.name=this.value">
        <label class="f" for="pa">Age</label><input class="i" id="pa" type="number" value="${esc(L.form.age || "")}" oninput="L.form.age=this.value">
        <button class="go" onclick="popupNext()">Continue</button>`
      : `<h3>What ChatGPT can do</h3>
        <ul class="facts"><li>Draft and update your listings, with you.</li><li>Show you introductions and questions when you ask.</li>
          <li>Ask before it changes anything. Saying yes is always your tap.</li></ul>
        <p>Your hidden details are never shown to matches. What you tell ChatGPT goes to OpenAI under their terms.</p>
        <label class="choice"><input type="checkbox" ${L.form.close ? "checked" : ""} onchange="L.form.close=this.checked"><span><b>Close matches</b><small>People who are almost what you asked for. One-way: they aren't told.</small></span></label>
        <label class="choice"><input type="checkbox" ${L.form.questions ? "checked" : ""} onchange="L.form.questions=this.checked"><span><b>Follow-up questions</b><small>Short questions that could find you more matches. We never say who asked.</small></span></label>
        <button class="go" onclick="popupDone()">Allow and connect</button>`}
      <p class="fine">Mockup of the sign-in a real connector would open (OAuth) on Belong.'s own site.</p></div></div></div>`;
  } else layer.innerHTML = "";
}
function confirmIt() {
  const c = L.confirm, r = $("cf-r");
  if (r && r.checked) L.remember[ACTIONS[c.kind].tool] = true;
  run(c.kind, c.arg);
}
function openPopup() { L.popup = { step: 0 }; renderLayer(); }
function popupNext() { if (!L.form.name || !L.form.age) return toast("Enter your first name and age."); L.popup.step = 1; renderLayer(); }
async function popupDone() {
  if (!await api("verify", { name: L.form.name, age: L.form.age })) { L.popup.step = 0; return renderLayer(); }
  await api("set_defaults", { defaults: { notify_close: !!L.form.close, notify_questions: !!L.form.questions, ask_each_time: false } });
  await api("new_listing", { prefs: { acknowledged: true, notify_close: !!L.form.close, notify_questions: !!L.form.questions } });
  L.popup = null;
  L.log.push({ app: true, cards: [], bot: `Belong. is connected. ${L.pendingText ? "Let's start on that." : "Tell me who you'd like to meet, or what you need."}` });
  render();
  if (L.pendingText) { const t = L.pendingText; L.pendingText = null; L.sending = true; render(); try { await draftWith(t); } finally { L.sending = false; L.jump = true; render(); } }
}

// Demo control: start the in-chat demo over (its own session; the phones aren't touched).
async function resetDemo() {
  if (L.sending) return;
  await api("reset");
  Object.assign(L, { log: [], confirm: null, popup: null, form: {}, remember: {}, pendingText: null });
  render(); toast("The in-chat demo has been reset.");
}
$("send").onclick = sendMsg;
$("box").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); } });
$("box").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(160, e.target.scrollHeight) + "px"; });
fetch("/api/chat/state").then(r => r.json()).then(d => {
  ME = d.me;
  // A fresh visit rebuilds the conversation from what Belong. holds for this chat.
  const l = ME.verified ? listing() : null;
  if (l) for (const m of l.chat.slice(1)) L.log.push(m.from === "me" ? { me: m.text } : { app: !!m.draft_updated, cards: [], bot: m.text });
  if (l && l.draft) L.log.push({ app: true, cards: [{ kind: "listing", latest: true }] });
  render();
});
setInterval(async () => { if (L.sending || L.confirm || L.popup) return; try { const d = await (await fetch("/api/chat/state")).json(); if (JSON.stringify(d.me) !== JSON.stringify(ME)) { ME = d.me; render(); } } catch (_) {} }, 3000);
</script>
</body>
</html>
