# Every pull request and every push to main: all tests, then the 300-person simulation with its
# leak audit (exit 1 on any leak). A merge to main then deploys the demo to the VM and the website to GitHub
# Pages, only if both pass.
name: Tests and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]  # the VM's (Debian 12) and the one we develop on
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: All tests (they fail on any leak)
        run: python3 -m unittest -v
      - name: 300-person simulation and leak audit
        run: python3 -m belong run

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.VM_HOST != ''
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v5
      - name: Send main to the VM
        # The deploy key can only run belong-update on the VM (deploy/allow-deploys.sh): it
        # replaces the app's code and restarts it. Keys and the demo password stay on the VM.
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VM_KNOWN_HOSTS }}
          VM_HOST: ${{ vars.VM_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          git archive --format=tar.gz HEAD | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes "deploy@$VM_HOST"

  # The public website (site/), built by tools/build_site.py and published with GitHub Pages (Settings > Pages >
  # Source: GitHub Actions). Like the demo, only a main that passed every test goes out. DEMO_URL (a repo variable,
  # e.g. https://34-66-86-34.sslip.io) is where its "Try the demo" and trust links point; without it, nothing deploys.
  site:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEMO_URL != ''
    runs-on: ubuntu-latest
    concurrency: pages
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Build the site
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: python3 tools/build_site.py --app "$DEMO_URL" --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
